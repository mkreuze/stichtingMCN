name: Deploy naar TransIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Voorbereiden upload-map
        run: |
          mkdir -p _deploy
          cp index.html nieuws.js _deploy/
          cp -r fotos _deploy/
          cp -r documenten _deploy/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP met lftp
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          lftp -e "
          set sftp:auto-confirm yes
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST
          mirror -R --verbose --no-perms ./_deploy/ $SFTP_TARGET_DIR
          bye
          "
