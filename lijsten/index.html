  // Het soort-veld wisselt tussen een keuzelijst en een eigen tekstveld.
  // Dat gebeurt ter plekke, zonder het formulier opnieuw te tekenen, zodat
  // wat er al ingevuld staat niet verloren gaat.
  function keuzeVeldLijst(veld, huidig) {
    var k = keuzelijst(veld);
    var opties = k.lees().slice();
    // Een bestaande waarde die niet in de lijst staat, blijft gewoon kiesbaar.
    if (huidig && opties.indexOf(huidig) === -1) opties.unshift(huidig);
    var html = '<select class="sel-input" data-field="org-' + veld + '" data-keuzeveld="' + veld + '">';
    html += '<option value=""' + (huidig ? "" : " selected") + '>— ' + veld + ' kiezen —</option>';
    opties.forEach(function (o) {
      html += '<option value="' + escapeHtml(o) + '"' + (o === huidig ? " selected" : "") + '>' + escapeHtml(o) + '</option>';
    });
    html += '<option value="__eigen__">+ Anders, namelijk…</option>';
    html += '</select>';
    return html;
  }

        html += '<div class="form-row"><label class="veld datum-veld"><span class="followup-hint">Datum</span><input type="date" class="txt-input date-field" data-field="decision-date" value="' + escapeHtml(d.date || "") + '" /></label></div>';

      html += '<span class="ak-veld" title="' + escapeHtml(d.taskTitle || "") + '">' + escapeHtml(d.taskTitle || "") + '</span>';

  function render() {
    var app = document.getElementById("app");

    if (opstartFout) {
      app.innerHTML = '<div class="poort"><p class="poort-tekst" style="white-space:pre-wrap;">' + escapeHtml(opstartFout) + '</p></div>';
      return;
    }
    if (!sessie) {
      app.innerHTML = renderInlogscherm();
      attachAutofocus();
      return;
    }
    if (!mijnRol) {
      app.innerHTML = '<div class="poort">' +
        '<h2 class="poort-kop heading-font">Nog geen toegang</h2>' +
        '<p class="poort-tekst">Je bent ingelogd als <strong>' + escapeHtml(sessie.user.email) + '</strong>, ' +
        'maar dat adres staat niet op de lijst met mensen die deze lijst mogen gebruiken. ' +
        'Vraag de beheerder om je toe te voegen.</p>' +
        '<button class="cancel-btn" data-action="uitloggen">Uitloggen</button></div>';
      return;
    }
    if (currentSections === null) {
      app.innerHTML = '<div class="status-line">Lijst laden…</div>';
      return;
    }
    applyInitialCollapse();
    var sections = currentSections;
    var allTasks = [];
    sections.forEach(function (s) { allTasks = allTasks.concat(s.tasks); });
    var totalDone = allTasks.filter(function (t) { return t.done; }).length;
    var totalCount = allTasks.length;
    var totalPct = totalCount ? Math.round((totalDone / totalCount) * 100) : 0;
    var owners = knownOwners(sections);
    var visibleSections = sortedSections(filterSectionsByLabel(sections, ui.labelFilter));
    var labelsInUse = allLabels(sections);
    var taskLabelsInUse = allTaskLabels(sections);

    var html = "";
    var besluitenAantal = (currentDecisions || []).length;
    app.classList.toggle("alleen-lezen", !magBewerken());

    var mijnViews = toegestaneViews();
    if (ui.view !== "instellingen" && mijnViews.indexOf(ui.view) === -1) ui.view = mijnViews[0] || "geen";
    html += '<div class="view-tabs">';
    [["acties", "Acties", totalCount],
     ["besluiten", "Besluiten", besluitenAantal],
     ["relaties", "Relaties", organisaties.length]].filter(function (v) { return mijnViews.indexOf(v[0]) !== -1; }).forEach(function (v) {
      html += '<button class="view-tab' + (ui.view === v[0] ? " active" : "") + '" data-action="set-view" data-view="' + v[0] + '">' + v[1] + '<span class="view-tab-count">' + v[2] + '</span></button>';
    });
    html += '<span class="toolbar-actions">';
    if (ui.view === "relaties") {
      html += '<button class="pdf-download-btn" data-action="download-adressen" title="Organisaties en personen, zoals ze nu gefilterd zijn">' + downloadSvg() + 'Adressenlijst</button>';
      html += '<button class="pdf-download-btn" data-action="download-mailing" title="Eén regel per e-mailadres, zoals nu gefilterd">' + downloadSvg() + 'Mailinglijst</button>';
    } else {
      html += '<button class="pdf-download-btn" data-action="download-pdf">' + downloadSvg() + 'PDF downloaden</button>';
    }
    if (pdfStatus) html += '<span class="pdf-status sans">' + escapeHtml(pdfStatus) + '</span>';
    html += '<button class="pdf-download-btn" data-action="uitloggen" title="' + escapeHtml(sessie.user.email) + (mijnRol === "kijker" ? " — je kunt meekijken, niet wijzigen" : "") + '">' + escapeHtml(sessie.user.email.split("@")[0]) + (mijnRol === "kijker" ? " (meekijken)" : "") + '</button>';
    html += '</span>';
    html += '</div>';

    if (ui.view === "geen") {
      html += '<div class="empty-state group-empty-state">Je hebt nog geen toegang tot de acties, besluiten of relaties. Vraag de beheerder om je toegang te geven.</div>';
      app.innerHTML = html;
      return;
    }

    if (ui.view === "instellingen") {
      html += renderInstellingenHtml();
      app.innerHTML = html;
      attachAutofocus();
      return;
    }

    if (!magBewerken()) {
      html += '<p class="meekijk-melding">Je kunt deze lijst bekijken, maar niet wijzigen. ' +
              'Vraag de beheerder om de rol \u201cbewerker\u201d als dat wel moet.</p>';
    }

    if (ui.view === "relaties") {
      if (saveError) {
        html += '<p class="sync-error sans" style="color:var(--danger);font-size:12px;margin:0 0 16px;">Opslaan lukte net niet. Probeer het nog eens.</p>';
      }
      html += '<div class="relaties-thema">' + renderRelatiesHtml() + '</div>';
      html += '<p class="footnote">Acties koppel je aan een organisatie of persoon bij het toevoegen of bewerken van een actie.</p>';
      app.innerHTML = html;
      attachAutofocus();
      return;

    if (ui.view === "besluiten") {
      if (saveError) {
        html += '<p class="sync-error sans" style="color:var(--danger);font-size:12px;margin:0 0 16px;">Opslaan lukte net niet. Probeer het nog eens.</p>';
      }
      html += renderDecisionsHtml();
      html += '<p class="footnote">Een besluit leg je vast bij het afronden van een actie. De PDF bevat beide lijsten.</p>';
      app.innerHTML = html;
      attachAutofocus();
      return;
    }

    html += '<div class="totals">';
    html += '<span class="totals-number sans">' + totalDone + ' / ' + totalCount + ' afgerond</span>';
    html += '<span class="totals-track"><span class="totals-fill" style="width:' + totalPct + '%"></span></span>';
    html += '<span class="sync-note">' + (syncing ? "Opslaan…" : "Gedeeld · live bijgewerkt") + '</span>';
    html += '</div>';

    if (saveError) {
      html += '<p class="sync-error sans" style="color:var(--danger);font-size:12px;margin:-8px 0 16px;">Opslaan lukte net niet. Probeer het nog eens.</p>';
    }

    var actieLabelFilter = ui.actionLabelFilter !== "alle" ? ui.actionLabelFilter : null;
    // Filter op wie: "persoon:<id>", "naam:<oude naam>" of een organisatie-id
    // (alle acties van die organisatie en haar mensen).
    var relFilterOrg = null, relFilterPersoon = null, relFilterNaam = null;
    if (ui.relatieFilter !== "alle") {
      if (ui.relatieFilter.indexOf("persoon:") === 0) relFilterPersoon = ui.relatieFilter.slice(8);
      else if (ui.relatieFilter.indexOf("naam:") === 0) relFilterNaam = ui.relatieFilter.slice(5);

      html += '<div class="followup-hint">Vervolgtaak — wordt toegevoegd aan hetzelfde onderdeel</div>';
      html += '<input type="text" class="txt-input" data-field="followup-title" placeholder="Titel van de vervolgtaak…" />';
      html += '</div>';
      if (magBesluiten()) {
        html += '<div class="form-row single">';
        html += '<div class="followup-hint">Besluit — komt op de besluitenlijst</div>';
        html += '<textarea class="txt-input" rows="2" data-field="decision-text" placeholder="Omschrijving van het besluit…">' + escapeHtml(decisionText) + '</textarea>';
        html += '</div>';
      } else {
        html += '<input type="hidden" data-field="decision-text" value="" />';
      }
      html += '</div>';
    }

    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-complete" data-section="' + section.id + '" data-task="' + task.id + '" data-mode="' + mode + '">Bevestig afronding</button>';
    html += '<button class="cancel-btn" data-action="cancel-complete" data-section="' + section.id + '" data-task="' + task.id + '" data-mode="' + mode + '">Annuleren</button>';
    html += '</div></div>';
    return html;
  }

  // "los" = geopend met de knop Nieuwe actie in de balk: dan kies je hier
  // ook de categorie, naast het label.
  function renderAddForm(section, owners, los) {
    var useCustom = !los && !!ui.customOwner[section.id];
    var html = '<div class="add-form" data-form="add" data-section="' + section.id + '"' + (los ? ' data-los="1"' : '') + '>';

    html += '<div class="owner-col">';

      html += renderEigenaarVeld(null);
    } else {
      html += '<div class="custom-owner-row">';
      html += '<input type="text" class="txt-input" data-field="owner-custom" placeholder="Naam" data-autofocus="1" />';
      html += '<button type="button" class="icon-btn small" data-action="cancel-custom-owner" data-section="' + section.id + '">' + xSvg(14) + '</button>';
      html += '</div>';
    }
    html += '</div>';
    html += '<label class="veld datum-veld"><span class="followup-hint">Datum</span>';
    html += '<input type="date" class="txt-input date-field" data-field="when" />';
    html += '</label>';
    html += '</div>';
    html += '<div class="form-row single"><span class="followup-hint">Toelichting</span><textarea class="txt-input note-area" data-field="note" rows="3"></textarea></div>';
    if (los) {
      html += '<div class="form-row naast-elkaar">';
      html += '<div class="veld">' + renderTaskLabelField(section, []) + '</div>';
      html += '<label class="veld"><span class="followup-hint">Categorie</span>';
      html += '<select class="sel-input" data-field="section-target">';
      (currentSections || []).forEach(function (s) {
        html += '<option value="' + escapeHtml(s.id) + '"' + (s.id === section.id ? " selected" : "") + '>' + escapeHtml(s.title) + '</option>';
      });
      html += '</select></label>';
      html += '</div>';
    } else {
      html += renderTaskLabelField(section, []);
    }
    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-add" data-section="' + section.id + '">Actie toevoegen</button>';
    html += '<button class="cancel-btn" data-action="' + (los ? "annuleer-nieuwe-actie" : "cancel-add") + '" data-section="' + section.id + '">Annuleren</button>';
    html += '</div></div>';
    return html;
  }

  // Wie doet het? Eerst de organisatie, standaard de eigen organisatie,
  // daarna een contactpersoon daarvan, of de hele organisatie. Losse namen
  // zijn niet meer te kiezen; een actie die er nog een heeft, houdt hem
  // tot je iemand anders kiest.
  function wieWaarde(taak) {
    if (!taak) return "";
    if (taak.eigenaarPersoonId) return "p:" + taak.eigenaarPersoonId;
    if (taak.eigenaarOrgId) return "o:" + taak.eigenaarOrgId;
    if (taak.owner) return "n:" + taak.owner;
    return "";
  }

  function renderEigenaarVeld(taak) {
    var orgId = taak ? wieOrgId(taak) : "";
    if (!orgId) orgId = (eigenOrganisatie() || {}).id || "";
    return '<span class="eigenaar-houder flex1">' + wieKiezer(orgId, wieWaarde(taak)) + '</span>';
  }

  function wieKiezer(orgId, waarde) {
    var org = orgId ? organisatieOp(orgId) : null;
    var lijst = organisaties.slice().sort(function (a, b) {
      if (!!a.eigen !== !!b.eigen) return a.eigen ? -1 : 1;
      return a.naam.localeCompare(b.naam, "nl");
    });
    var html = '<div class="wie-kiezer">';
    html += '<label class="veld"><span class="followup-hint">Organisatie</span>';
    html += '<select class="sel-input" data-field="wie-org">';
    if (!lijst.length) html += '<option value="">— nog geen organisaties —</option>';
    else if (!org) html += '<option value="" selected>— kies organisatie —</option>';
    lijst.forEach(function (o) {
      html += '<option value="' + escapeHtml(o.id) + '"' + (o.id === orgId ? " selected" : "") + '>' + escapeHtml(o.naam) + '</option>';
    });
    html += '</select></label>';

    html += '<label class="veld"><span class="followup-hint">Wie</span>';
    html += '<select class="sel-input" data-field="owner-keuze">';
    html += '<option value=""' + (waarde === "" ? " selected" : "") + '>— kies wie —</option>';
    if (waarde.indexOf("n:") === 0) {
      html += '<option value="' + escapeHtml(waarde) + '" selected>' + escapeHtml(waarde.slice(2)) + ' (oude naam)</option>';
    }
    var mensen = org ? personenBij(org.id).slice().sort(opAchternaam) : [];
    if (mensen.length) {
      html += '<optgroup label="Contactpersonen">';
      mensen.forEach(function (x) {
        var w = "p:" + x.id;
        html += '<option value="' + escapeHtml(w) + '"' + (w === waarde ? " selected" : "") + '>' + escapeHtml(volledigeNaam(x)) + '</option>';
      });
      html += '</optgroup>';
    }
    if (org) {
      var wo = "o:" + org.id;
      html += '<option value="' + escapeHtml(wo) + '"' + (wo === waarde ? " selected" : "") + '>Hele organisatie</option>';
    }
    html += '</select></label>';
    html += '</div>';
    return html;
  }

  function renderTaskLabelField(section, huidige) {
    var suggesties = labelsInSection(section).filter(function (l) { return huidige.indexOf(l) === -1; });
    var html = '<div class="form-row single">';
    html += '<div class="followup-hint">Label</div>';
    html += '<input type="text" class="txt-input" data-field="task-labels" value="' + escapeHtml(huidige.join(", ")) + '" placeholder="Meerdere mag, gescheiden door komma\'s" />';
    if (suggesties.length) {
      html += '<div class="label-suggests">';
      suggesties.forEach(function (l) {
        html += '<button type="button" class="label-suggest" data-action="add-task-label" data-label="' + escapeHtml(l) + '" style="color:' + labelColor(l) + ';">+ ' + escapeHtml(l) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function attachAutofocus() {
    var el = document.querySelector('[data-autofocus="1"]');
    if (el) el.focus();
  }

  // ---- Mutaties ----

  function cloneSections() {
    return JSON.parse(JSON.stringify(currentSections));
  }

  // Zet de lijst zoals hij op het scherm staat om naar tabelregels.
  function categorieRijen(secties) {
    return (secties || []).map(function (s) {
      return { id: s.id, nr: s.nr, titel: s.title, labels: sectionLabels(s) };
    });
  }
  function actieRijen(secties) {
    var rijen = [];
    (secties || []).forEach(function (s) {
      s.tasks.forEach(function (t, i) {
        var rij = {
          id: t.id, categorie_id: s.id, titel: t.title,
          eigenaar: t.owner || "", eigenaar_persoon_id: t.eigenaarPersoonId || null,
          wanneer: t.when || "", notitie: t.note || "",
          labels: taskLabels(t),
          organisatie_id: t.organisatieId || null,
          persoon_id: t.persoonId || null,
          gereed: !!t.done,
          gereed_op: isoDatumOfNull(t.completedDate),
          gereed_notitie: t.completedNote || "",
          volgorde: i
        };
        if (heeftWieOrg) rij.eigenaar_organisatie_id = t.eigenaarOrgId || null;
        rijen.push(rij);
      });
    });
    return rijen;
  }
  function besluitRijen(besluiten) {
    return (besluiten || []).map(function (d) {
      return {
        id: d.id, tekst: d.text, datum: isoDatumOfNull(d.date),
        actie_id: d.taskId || null,
        categorie_titel: d.sectionTitle || "", actie_titel: d.taskTitle || ""
      };
    });
  }
  function isoDatumOfNull(w) {
    return /^\d{4}-\d{2}-\d{2}$/.test(w || "") ? w : null;
  }

  // Wat is er veranderd tussen twee verzamelingen regels?
  function verschillen(oud, nieuw) {
    var oudOp = {};
    oud.forEach(function (r) { oudOp[r.id] = JSON.stringify(r); });
    var nieuwIds = {};
    var schrijven = [];
    nieuw.forEach(function (r) {
      nieuwIds[r.id] = true;
      if (oudOp[r.id] !== JSON.stringify(r)) schrijven.push(r);
    });
    var wissen = oud.filter(function (r) { return !nieuwIds[r.id]; })
                    .map(function (r) { return r.id; });
    return { schrijven: schrijven, wissen: wissen };
  }

  function wegschrijven(tabel, oud, nieuw) {
    var v = verschillen(oud, nieuw);
    var stappen = [];
    if (v.schrijven.length) stappen.push(sb.from(tabel).upsert(v.schrijven));
    if (v.wissen.length) stappen.push(sb.from(tabel).delete().in("id", v.wissen));
    return stappen;
  }

  function persist(next, nextDecisions) {
    var oudeSecties = currentSections || [];
    var oudeBesluiten = currentDecisions || [];
    currentSections = next;
    if (nextDecisions !== undefined) currentDecisions = nextDecisions;
    render();
    if (!sb) return;
    if (!magBewerken()) { saveError = true; render(); return; }

    syncing = true;
    render();

    // Categorieën eerst: een nieuwe actie verwijst ernaar. Verwijderen
    // gaat andersom, dus acties gaan vóór de categorieën eruit.
    var catV = verschillen(categorieRijen(oudeSecties), categorieRijen(next));
    var actV = verschillen(actieRijen(oudeSecties), actieRijen(next));
    var besV = verschillen(besluitRijen(oudeBesluiten), besluitRijen(currentDecisions));

    var keten = Promise.resolve();
    function stap(fn) { keten = keten.then(function () { return controleer(fn()); }); }

    if (catV.schrijven.length) stap(function () { return sb.from("categorieen").upsert(catV.schrijven); });
    if (actV.schrijven.length) stap(function () { return sb.from("acties").upsert(actV.schrijven); });
    if (besV.schrijven.length) stap(function () { return sb.from("besluiten").upsert(besV.schrijven); });
    if (besV.wissen.length) stap(function () { return sb.from("besluiten").delete().in("id", besV.wissen); });
    if (actV.wissen.length) stap(function () { return sb.from("acties").delete().in("id", actV.wissen); });
    if (catV.wissen.length) stap(function () { return sb.from("categorieen").delete().in("id", catV.wissen); });

    keten.then(function () {
      syncing = false; saveError = false; render();
    }).catch(function () {
      // Mislukt: haal de echte toestand terug op, zodat het scherm niet
      // iets toont wat niet is opgeslagen.
      syncing = false; saveError = true; render();
      laadAlles().then(render).catch(function () {});
    });
  }

  function controleer(p) {
    return Promise.resolve(p).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }

  function magBewerken() {
    return mijnRol === "bewerker" || mijnRol === "beheerder";
  }

  function findTask(sections, sectionId, taskId) {
    var s = sections.find(function (s) { return s.id === sectionId; });
    if (!s) return null;
    return s.tasks.find(function (t) { return t.id === taskId; }) || null;
  }

  function completeTask(sectionId, taskId, completedDate, completedNote) {
    completeTaskWithFollowup(sectionId, taskId, completedDate, completedNote, "", "");
  }

  function completeTaskWithFollowup(sectionId, taskId, completedDate, completedNote, followupTitle, decisionText) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.done = true;
    t.completedDate = completedDate;
    t.completedNote = completedNote;
    delete ui.completing[taskId];
    delete ui.editingCompletion[taskId];

    var s = next.find(function (s) { return s.id === sectionId; });

    if (followupTitle && s) {
      s.tasks.push({
        id: sectionId + "-" + Date.now(),
        title: followupTitle,
        owner: t.owner,
        when: "",
        note: "Vervolg op: " + t.title,
        done: false
      });
    }

    var nextDecisions = cloneDecisions();
    var existingIndex = nextDecisions.findIndex(function (d) { return d.taskId === taskId; });
    if (decisionText) {
      var record = {
        id: existingIndex !== -1 ? nextDecisions[existingIndex].id : "besluit-" + Date.now(),
        text: decisionText,
        date: completedDate,
        sectionTitle: s ? s.title : "",
        taskTitle: t.title,
        taskId: taskId
      };
      if (existingIndex !== -1) { nextDecisions[existingIndex] = record; } else { nextDecisions.push(record); }
    } else if (existingIndex !== -1) {
      nextDecisions.splice(existingIndex, 1);
    }

    persist(next, nextDecisions);
  }

  function updateDecision(decisionId, text, date) {
    var next = cloneDecisions();
    var d = next.find(function (x) { return x.id === decisionId; });
    if (!d) return;
    d.text = text;
    d.date = date;
    persist(currentSections, next);
  }

  function deleteDecision(decisionId) {
    var next = cloneDecisions().filter(function (d) { return d.id !== decisionId; });
    persist(currentSections, next);
  }

  // Heropenen bewaart datum en commentaar van de vorige afronding, zodat er
  // niets verloren gaat en opnieuw afronden die gegevens weer voorstelt.
  function uncompleteTask(sectionId, taskId) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.done = false;
    persist(next);
  }

  function deleteTask(sectionId, taskId) {
    var next = cloneSections();
    var s = next.find(function (s) { return s.id === sectionId; });
    if (!s) return;
    s.tasks = s.tasks.filter(function (t) { return t.id !== taskId; });
    persist(next);
  }

  function addTask(sectionId, task) {
    var next = cloneSections();
    var s = next.find(function (s) { return s.id === sectionId; });
    if (!s) return;
    task.id = sectionId + "-" + Date.now();
    task.done = false;
    task.labels = task.labels || [];
    task.organisatieId = task.organisatieId || "";
    task.persoonId = task.persoonId || "";
    task.eigenaarPersoonId = task.eigenaarPersoonId || "";
    task.eigenaarOrgId = task.eigenaarOrgId || "";
    s.tasks.push(task);
    persist(next);
  }

  function updateTask(sectionId, taskId, patch) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.title = patch.title;
    t.owner = patch.owner;
    t.when = patch.when;
    t.note = patch.note;
    t.labels = patch.labels || [];
    // De oude relatie staat niet meer in het formulier; die laten we staan.
    if ("organisatieId" in patch) t.organisatieId = patch.organisatieId || "";
    if ("persoonId" in patch) t.persoonId = patch.persoonId || "";
    t.eigenaarPersoonId = patch.eigenaarPersoonId || "";
    t.eigenaarOrgId = patch.eigenaarOrgId || "";

    if (patch.sectionId && patch.sectionId !== sectionId) {
      var from = next.find(function (s) { return s.id === sectionId; });
      var to = next.find(function (s) { return s.id === patch.sectionId; });
      if (from && to) {
        from.tasks = from.tasks.filter(function (x) { return x.id !== taskId; });
        to.tasks.push(t);
        ui.collapsed[to.id] = false;
      }
    }

    persist(next);
  }

  // Hernoemt een categorie en zet haar op de gevraagde plek in de leesvolgorde.
  // Daarna krijgen alle categorieën weer een aaneensluitend nummer (1, 2, 3, …).
  function updateSection(sectionId, title, desiredNr, labels) {
    var next = cloneSections();
    var index = next.findIndex(function (s) { return s.id === sectionId; });
    if (index === -1) return;

    next[index].title = title;
    next[index].labels = labels;
    delete next[index].group; // oude vaste groep is vervangen door labels

    var target = Math.min(Math.max(desiredNr, 1), next.length);
    var moved = next.splice(index, 1)[0];
    next.splice(target - 1, 0, moved);
    next.forEach(function (s, i) { s.nr = i + 1; });

    persist(next);
  }

  function deleteSection(sectionId) {
    var target = (currentSections || []).find(function (s) { return s.id === sectionId; });
    if (!target || target.tasks.length > 0) return;
    var next = cloneSections().filter(function (s) { return s.id !== sectionId; });
    persist(next);
  }

  function slugify(title) {
    return title
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "categorie";
  }

  function addSection(title, labels) {
    var next = cloneSections();
    var maxNr = next.reduce(function (m, s) { return Math.max(m, s.nr || 0); }, 0);
    var baseId = slugify(title);
    var id = baseId;
    var i = 2;
    while (next.some(function (s) { return s.id === id; })) {
      id = baseId + "-" + i;
      i++;
    }
    next.push({ id: id, nr: maxNr + 1, title: title, labels: labels || [], tasks: [] });
    persist(next);
  }

  // ---- Event delegation ----

  document.getElementById("app").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    if (btn.tagName === "SELECT") return;   // keuzelijsten lopen via de change-handler
    var action = btn.getAttribute("data-action");
    var sectionId = btn.getAttribute("data-section");
    var taskId = btn.getAttribute("data-task");
    var decisionId = btn.getAttribute("data-decision");

    var orgId = btn.getAttribute("data-org");
    var persoonId = btn.getAttribute("data-persoon");

    // Alles wat niets verandert mag iedereen; de rest alleen een bewerker.
    var KIJKACTIES = [
      "set-view", "set-filter", "toggle-collapse", "toggle-collapse-all",
      "set-label-filter", "set-task-label-filter", "clear-task-label-filter",
      "set-action-label-filter", "set-date-filter", "set-sort",
      "download-pdf", "download-adressen", "download-mailing",
      "uitloggen", "stuur-inloglink",
      "toggle-org", "filter-op-relatie", "filter-op-persoon",
      "toon-relatie", "wis-relatiefilter", "toggle-filterpaneel", "wis-filter", "wis-filters",
      "set-relatie-view", "toon-organisatie", "set-keuze-filter",
      "toggle-relfilter", "wis-relfilter", "wis-relfilters", "toggle-orgs-alle",
      "sluit-instellingen", "zet-thema", "toggle-instel", "toggle-instel-alle",
      "set-actie-view", "toon-categorie", "set-action-label-filter-knop", "toggle-groep", "toggle-groepen-alle"
    ];
    if (!magBewerken() && KIJKACTIES.indexOf(action) === -1) return;
    // Soorten, sectoren en labels beheren is voor de beheerder.
    var BEHEERACTIES = ["bewerk-label", "annuleer-label", "bewaar-label", "verwijder-label",
      "nieuw-lid", "bewerk-lid", "annuleer-lid", "bewaar-lid", "verwijder-lid",
      "open-edit-section", "cancel-edit-section", "submit-edit-section", "delete-section",
      "open-add-section", "cancel-add-section", "submit-add-section", "add-label-suggestion",
      "bewerk-soort", "annuleer-soort", "bewaar-soort", "verwijder-soort", "nieuwe-soort"];
    if (BEHEERACTIES.indexOf(action) !== -1 && mijnRol !== "beheerder") return;

    if (action === "uitloggen") {
      uitloggen();
      return;
    } else if (action === "stuur-inloglink") {
      var inlogForm = btn.closest('[data-form="inloggen"]');
      var adres = inlogForm.querySelector('[data-field="inlog-email"]').value.trim();
      if (adres) stuurInloglink(adres);
      return;
    } else if (action === "toggle-soorten-beheer") {
      ui.soortenBeheer = !ui.soortenBeheer;
      render();
      return;
    } else if (action === "nieuwe-soort") {
      ui.nieuwSoort = btn.getAttribute("data-keuzeveld"); render(); return;
    } else if (action === "bewerk-soort") {
      ui.bewerkSoort[btn.getAttribute("data-soort")] = true; render(); return;
    } else if (action === "annuleer-soort") {
      var asn = btn.getAttribute("data-soort");
      if (asn.indexOf("|nieuw") !== -1) ui.nieuwSoort = false; else delete ui.bewerkSoort[asn];
      render(); return;
    } else if (action === "bewaar-soort") {
      var deel = btn.getAttribute("data-soort").split("|");
      var veld = deel[0], oud = deel.slice(1).join("|");
      var sf = btn.closest('[data-form="soort"]');
      var nieuw = leesVeld(sf, "soort-naam");
      if (!nieuw) return;
      if (oud === "nieuw") ui.nieuwSoort = false; else delete ui.bewerkSoort[veld + "|" + oud];
      if (oud !== "nieuw" && oud === nieuw) { render(); return; }
      if (keuzelijst(veld).lees().indexOf(nieuw) !== -1) {
        saveError = true; render(); return;   // bestaat al
      }
      bewaarSoort(veld, oud === "nieuw" ? null : oud, nieuw);
      return;
    } else if (action === "verwijder-soort") {
      var vd = btn.getAttribute("data-soort").split("|");
      if (!window.confirm("\u201c" + vd.slice(1).join("|") + "\u201d verwijderen uit de keuzelijst?")) return;
      verwijderSoort(vd[0], vd.slice(1).join("|"));
      return;
    } else if (action === "set-actie-view") {
      ui.actieView = btn.getAttribute("data-actieview");
      render();
      return;
    } else if (action === "toggle-groepen-alle") {

        var actiesVak = lform.querySelector('[data-field="lid-acties"]');
        lform.querySelectorAll('.rechten input').forEach(function (x) {
          x.disabled = isBeh || (x.getAttribute("data-field") === "lid-groep" && actiesVak && !actiesVak.checked);
          if (isBeh) x.checked = true;
        });
        var uitleg = lform.querySelector(".rechten-uitleg");
        if (uitleg) uitleg.textContent = isBeh ? "Een beheerder ziet altijd alles."
          : "Staan alle groepen aan, dan ziet deze gebruiker ook groepen die er later bij komen.";
      }
      return;
    }
    if (e.target.matches('[data-action="set-wie-filter"]')) {
      ui.relatieFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches('[data-action="set-date-filter"]')) {
      ui.dateFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches("[data-keuzeveld]") && e.target.value === "__eigen__") {
      var houder = e.target.closest(".soort-holder");
      if (houder) {
        houder.innerHTML = keuzeVeldTekst(houder.getAttribute("data-keuzeveld"), "");
        var invoer = houder.querySelector("input");
        if (invoer) invoer.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="wie-org"]')) {
      var wieKiezerEl = e.target.closest(".wie-kiezer");
      if (wieKiezerEl) {
        var wieOuder = wieKiezerEl.parentNode;
        wieOuder.innerHTML = wieKiezer(e.target.value, "");
        var persVeld = wieOuder.querySelector('[data-field="owner-keuze"]');
        if (persVeld) persVeld.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="owner-keuze"]') && e.target.value === "__eigennaam__") {
      var naamHouder = e.target.closest(".eigenaar-houder");
      if (naamHouder) {
        naamHouder.innerHTML = '<div class="custom-owner-row">'
          + '<input type="text" class="txt-input" data-field="owner-custom" placeholder="Naam" />'
          + '<button type="button" class="icon-btn small" data-action="terug-naar-eigenaarlijst">' + xSvg(14) + '</button>'
          + '</div>';
        var tekstVeld = naamHouder.querySelector("input");
        if (tekstVeld) tekstVeld.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="owner-select"]') && e.target.value === "__custom__") {
      var addForm = e.target.closest('[data-form="add"]');
      var editForm = e.target.closest('[data-form="edit-task"]');
      if (addForm) {
        ui.customOwner[e.target.getAttribute("data-section")] = true;
      } else if (editForm) {
        ui.editCustomOwner[e.target.getAttribute("data-task")] = true;
      }
      render();
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var addForm = e.target.closest('[data-form="add"]');
    if (addForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      addForm.querySelector('[data-action="submit-add"]').click();
      return;
    }
    var completeForm = e.target.closest('[data-form="complete"]');
    if (completeForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      completeForm.querySelector('[data-action="submit-complete"]').click();
      return;
    }
    var editForm = e.target.closest('[data-form="edit-task"]');
    if (editForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      editForm.querySelector('[data-action="submit-edit-task"]').click();
      return;
    }
    var editSectionForm = e.target.closest('[data-form="edit-section"]');
    if (editSectionForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      editSectionForm.querySelector('[data-action="submit-edit-section"]').click();
      return;
    }
    var sectionForm = e.target.closest(".add-section-card");
    if (sectionForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      sectionForm.querySelector('[data-action="submit-add-section"]').click();
    }
  });

  window.addEventListener("beforeprint", function () {
    ui.collapsed = {};
    render();
  });

  // ---- Inloggen, laden en live bijwerken ----

  function laadAlles() {
    return Promise.all([
      sb.from("categorieen").select("*").order("nr"),
      sb.from("acties").select("*").order("volgorde"),
      sb.from("besluiten").select("*"),
      // Wie de acties wel maar de relaties niet ziet, krijgt alleen de namen
      // (nodig om bij een actie te kiezen wie het doet).
      (!magRelaties() && magActies()) ? sb.rpc("namen_organisaties") : sb.from("organisaties").select("*").order("naam"),
      (!magRelaties() && magActies()) ? sb.rpc("namen_personen") : sb.from("personen").select("*"),
      sb.from("organisatie_soorten").select("*").order("volgorde"),
      sb.from("organisatie_sectoren").select("*").order("volgorde")
    ]).then(function (r) {
      r.forEach(function (x, i) { if (x.error && i < 5) throw x.error; });
      var cats = r[0].data || [], acts = r[1].data || [], bes = r[2].data || [];
      heeftWieOrg = acts.length > 0 && Object.prototype.hasOwnProperty.call(acts[0], "eigenaar_organisatie_id");
      organisaties = r[3].data || [];
      personen = (r[4].data || []).sort(opAchternaam);
      soorten = (r[5].data || []).map(function (x) { return x.naam; });
      sectoren = (r[6].data || []).map(function (x) { return x.naam; });

      currentSections = cats.map(function (c) {
        return {
          id: c.id, nr: c.nr, title: c.titel, labels: c.labels || [],
          tasks: acts.filter(function (a) { return a.categorie_id === c.id; })
                     .map(function (a) {
            return {
              id: a.id, title: a.titel, owner: a.eigenaar || "", when: a.wanneer || "",
              note: a.notitie || "", labels: a.labels || [],
              organisatieId: a.organisatie_id || "", persoonId: a.persoon_id || "",
              eigenaarPersoonId: a.eigenaar_persoon_id || "",
              eigenaarOrgId: a.eigenaar_organisatie_id || "",
              done: !!a.gereed, completedDate: a.gereed_op || "",
              completedNote: a.gereed_notitie || ""
            };
          })
        };
      });
      currentDecisions = bes.map(function (b) {
        return {
          id: b.id, text: b.tekst, date: b.datum || "", taskId: b.actie_id || "",
          sectionTitle: b.categorie_titel || "", taskTitle: b.actie_titel || ""
        };
      });
    });
  }

  // Wijzigingen van anderen meteen overnemen.
  function luisterOpWijzigingen() {
    try {
      sb.channel("lijst")
        .on("postgres_changes", { event: "*", schema: "public" }, function () {
          if (syncing) return;              // eigen schrijfactie loopt nog
          laadAlles().then(render).catch(function () {});
        })
        .subscribe();
    } catch (e) { /* zonder live bijwerken werkt de lijst ook */ }
  }

  function bepaalRol() {
    return sb.from("leden").select("*").then(function (r) {
      if (r.error) { mijnRol = null; return; }
      leden = r.data || [];
      heeftRechten = leden.length > 0 && Object.prototype.hasOwnProperty.call(leden[0], "toegang_acties");
      var eigen = (r.data || []).find(function (l) {
        return (l.email || "").toLowerCase() === (sessie.user.email || "").toLowerCase();
      });
      mijnRol = eigen ? eigen.rol : null;
      mijnRechten = {
        acties: !heeftRechten || !eigen || eigen.toegang_acties !== false,
        groepen: (heeftRechten && eigen && eigen.acties_groepen) || [],
        besluiten: !heeftRechten || !eigen || eigen.toegang_besluiten !== false,
        relaties: !heeftRechten || !eigen || eigen.toegang_relaties !== false
      };
    });
  }
  function magActies() { return mijnRol === "beheerder" || mijnRechten.acties; }
  function magBesluiten() { return mijnRol === "beheerder" || mijnRechten.besluiten; }
  function magRelaties() { return mijnRol === "beheerder" || mijnRechten.relaties; }
  function toegestaneViews() {
    return [["acties", magActies()], ["besluiten", magBesluiten()], ["relaties", magRelaties()]]
      .filter(function (x) { return x[1]; }).map(function (x) { return x[0]; });
  }

  function naInloggen() {
    return bepaalRol().then(function () {
      if (!mijnRol) { render(); return; }      // wel ingelogd, geen toegang
      return laadAlles().then(function () {
        render();
        luisterOpWijzigingen();
      });
    }).catch(function (e) {
      opstartFout = "De lijst kon niet worden geladen.\n\n" +
                    "Melding: " + ((e && (e.message || e.hint || e.details)) || String(e));
      console.error("Laden mislukt:", e);
      render();
    });
  }

  function stuurInloglink(email) {
    inlogStatus = "Bezig…";
    render();
    sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.href.split("#")[0] }
    }).then(function (r) {
      inlogStatus = r.error
        ? "Versturen lukte niet: " + r.error.message
        : "Gelukt. Je krijgt een mail met een link om in te loggen — die kun je in dit venster openen.";
      render();
    });
  }

  function uitloggen() {
    sb.auth.signOut().then(function () {
      sessie = null; mijnRol = null;
      currentSections = null; currentDecisions = null;
      render();
    });
  }

  function init() {
    render();
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      opstartFout = "De verbinding met de database is nog niet ingesteld. " +
                    "Vul bovenin dit bestand de twee gegevens van Supabase in.";
      render();
      return;
    }
    function haalBibliotheek(i) {
      if (i >= SUPABASE_LIBS.length) {
        return Promise.reject(new Error("de bibliotheek kon van geen enkel adres geladen worden"));
      }
      return import(SUPABASE_LIBS[i]).catch(function () { return haalBibliotheek(i + 1); });
    }

    var laden = window.__maakClient
      ? Promise.resolve(window.__maakClient(SUPABASE_URL, SUPABASE_ANON_KEY))
      : haalBibliotheek(0).then(function (mod) {
          if (!mod || !mod.createClient) throw new Error("de bibliotheek laadde, maar bevat geen createClient");
          return mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        });

    laden.then(function (client) {
      sb = client;
      sb.auth.onAuthStateChange(function (_gebeurtenis, nieuweSessie) {
        var was = sessie && sessie.user && sessie.user.id;
        sessie = nieuweSessie;
        var is = sessie && sessie.user && sessie.user.id;
        if (is && is !== was) naInloggen();
        if (!is) render();
      });
      return sb.auth.getSession();
    }).then(function (r) {
      sessie = (r && r.data && r.data.session) || null;
      if (sessie) return naInloggen();
      render();
    }).catch(function (err) {
      opstartFout = "Er kon geen verbinding met de database worden gemaakt.\n\n" +
                    "Melding: " + ((err && (err.message || err.error_description)) || String(err));
      console.error("Opstarten mislukt:", err);
      render();
    });
  }

  // De lettertypen worden pas opgehaald nadat de pagina volledig geladen is.
  // Zo kan een trage of geblokkeerde verbinding met Google het openen van de
  // lijst nooit ophouden; tot die tijd staat alles in de systeemletter.
  function loadWebfonts() {
    if (document.getElementById("webfonts")) return;
    var el = document.createElement("link");
    el.id = "webfonts";
    el.rel = "stylesheet";
    el.href = "https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap";
    document.head.appendChild(el);
  }
  if (document.readyState === "complete") {
    setTimeout(loadWebfonts, 0);
  } else {
    window.addEventListener("load", function () { setTimeout(loadWebfonts, 0); });
  }

  init();
})();
</script>
</body>
</html>
