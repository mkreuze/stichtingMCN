      sectionLabels(section).forEach(function (l) {
        var c = labelColor(l);
        html += '<button class="label-chip" data-action="set-label-filter" data-label="' + escapeHtml(l) + '" title="Toon alleen categorieën met dit label" style="color:' + c + ';background:' + lightenHex(c, 0.14) + ';">' + escapeHtml(l) + '</button>';
      });
      html += '<button class="edit-btn" data-action="open-edit-section" data-section="' + section.id + '" aria-label="Categorie bewerken" title="Naam, volgnummer of labels wijzigen">' + pencilSvg() + '</button>';
      if (total === 0) {
        html += '<button class="delete-btn" data-action="delete-section" data-section="' + section.id + '" aria-label="Verwijder lege categorie" title="Lege categorie verwijderen">' + xSvg() + '</button>';
      }
      html += '</div>';

      if (!collapsed) {
        html += '<div class="section-body">';

        if (taakLabelFilter) {
          var fc = labelColor(taakLabelFilter);
          html += '<div class="label-filter-bar">';
          html += '<span>Alleen acties met label</span>';
          html += '<span class="label-chip" style="color:' + fc + ';background:' + lightenHex(fc, 0.14) + ';">' + escapeHtml(taakLabelFilter) + '</span>';
          html += '<button class="cancel-btn" data-action="clear-task-label-filter" data-section="' + section.id + '">Toon alles</button>';
          html += '</div>';
        }

        if (total === 0 && !ui.adding[section.id]) {
          html += '<div class="empty-state">Nog geen taken in dit onderdeel.</div>';
        } else if (total > 0 && visibleTasks.length === 0) {
          html += '<div class="empty-state">' + (ui.filter === "todo" ? "Alles hier is al afgerond." : "Hier staat nog niets afgerond.") + '</div>';
        }

        // Dezelfde overzichtelijke tabel als bij "Alle acties", maar
        // zonder de kolom Categorie: die weet je hier al.
        var opengeklapt = visibleTasks.filter(function (t) {
          return ui.editingTask[t.id] || ui.completing[t.id] || ui.editingCompletion[t.id] || ui.reopening[t.id];
        });
        if (opengeklapt.length) {
          // Staat er een formulier open, dan tonen we de gewone regels,
          // zodat het formulier de volle breedte houdt.
          visibleTasks.forEach(function (task) {
            html += renderTaskRow(section, task, owners);
          });
        } else if (visibleTasks.length) {
          html += renderActieTabel(visibleTasks.map(function (t) {
            return { sectie: section, taak: t };
          }), false);
        }

        if (ui.adding[section.id]) {
          html += renderAddForm(section, owners);
        } else {
          html += '<button class="add-task-btn" data-action="open-add" data-section="' + section.id + '">' + plusSvg() + 'Taak toevoegen</button>';
        }

        html += '</div>';
      }
      html += '</section>';
    });

    if (ui.addingSection) {
      html += renderAddSectionForm();
    } else {
      html += '<button class="add-section-btn" data-action="open-add-section">' + plusSvg() + 'Nieuwe categorie toevoegen</button>';
    }

    html += '<p class="footnote">Deze lijst is gedeeld: iedereen die deze pagina opent ziet dezelfde taken, en wijzigingen worden bewaard en direct bijgewerkt bij alle geopende vensters.</p>';

    app.innerHTML = html;
    attachAutofocus();
  }

  function renderAddSectionForm() {
    var html = '<div class="section-card add-section-card">';
    html += '<div class="add-section-body">';
    html += '<div class="form-row single"><input type="text" class="txt-input" data-field="section-title" placeholder="Naam van de nieuwe categorie…" data-autofocus="1" /></div>';
    html += '<div class="form-row single">';
    html += '<div class="followup-hint">Labels (optioneel) — meerdere mag, gescheiden door komma\'s</div>';
    html += '<input type="text" class="txt-input" data-field="section-labels" placeholder="Bijv. Bestuur, MCN Platform" />';
    html += '</div>';
    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-add-section">Categorie aanmaken</button>';
    html += '<button class="cancel-btn" data-action="cancel-add-section">Annuleren</button>';
    html += '</div></div></div>';
    return html;
  }

  function chevronSvg(collapsed) {
    var rot = collapsed ? ' style="transform:rotate(-90deg)"' : "";
    return '<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + rot + '><polyline points="6 9 12 15 18 9"></polyline></svg>';
  }
  function personSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
  }

  function plusSvg() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;flex-shrink:0;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
  }
  function checkSvg() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }
  function xSvg(size) {
    size = size || 14;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
  }
  function pencilSvg() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>';
  }
  function userSvg() {
    return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
  }
  function downloadSvg() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;flex-shrink:0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
  }

  function renderTaskRow(section, task, owners) {
    var color = ownerColor(eigenaarNaam(task));
    var editing = !task.done && ui.editingTask[task.id];
    var html = '<div class="task-row' + (task.done ? " done" : "") + '">';
    html += '<button class="check-btn" data-action="' + (task.done ? "ask-uncomplete" : "toggle-complete") + '" data-section="' + section.id + '" data-task="' + task.id + '" aria-label="' + (task.done ? "Taak weer openzetten" : "Markeer als afgerond") + '"' + (editing ? " disabled" : "") + '>';
    if (task.done) html += checkSvg();
    html += '</button>';
    html += '<div class="task-body">';

    if (editing) {
      html += renderEditTaskForm(section, task, owners);
    } else {
      html += '<div class="task-title">' + escapeHtml(task.title) + '</div>';
      var eigenTaakLabels = taskLabels(task);
      var relatie = relatieNaam(task);
      if (task.when || task.note || eigenTaakLabels.length || relatie) {
        html += '<div class="task-meta">';
        if (eigenTaakLabels.length) {
          html += '<div class="task-labels">';
          eigenTaakLabels.forEach(function (l) {
            var lc = labelColor(l);
            html += '<button class="label-chip" data-action="set-task-label-filter" data-section="' + section.id + '" data-label="' + escapeHtml(l) + '" title="Toon alleen acties met dit label" style="color:' + lc + ';background:' + lightenHex(lc, 0.14) + ';">' + escapeHtml(l) + '</button>';
          });
          html += '</div>';
        }
        if (relatie) {
          html += '<button class="relatie-chip" data-action="toon-relatie" data-org="' + escapeHtml(task.organisatieId || "") + '" data-persoon="' + escapeHtml(task.persoonId || "") + '" title="Naar de relatielijst">' + personSvg() + escapeHtml(relatie) + '</button>';
        }
        if (task.when) html += '<div class="when">' + escapeHtml(formatDateNL(task.when)) + '</div>';
        if (task.note) html += '<div class="note">' + escapeHtml(task.note) + '</div>';
        html += '</div>';
      }
    }

    if (task.done && !ui.editingCompletion[task.id]) {
      html += '<button class="completion-line" data-action="edit-completion" data-section="' + section.id + '" data-task="' + task.id + '" title="Bewerk afrondingsdatum of commentaar">';
      html += 'Afgerond op ' + escapeHtml(formatDateNL(task.completedDate));
      if (task.completedNote) html += ' — ' + escapeHtml(task.completedNote);
      html += '</button>';
    }

    if (task.done && ui.reopening[task.id] && !ui.editingCompletion[task.id]) {
      html += '<div class="reopen-confirm">';
      html += '<span>Deze taak weer op "te doen" zetten? De afrondingsgegevens blijven bewaard.</span>';
      html += '<button class="save-btn" data-action="confirm-uncomplete" data-section="' + section.id + '" data-task="' + task.id + '">Heropenen</button>';
      html += '<button class="cancel-btn" data-action="cancel-uncomplete" data-task="' + task.id + '">Annuleren</button>';
      html += '</div>';
    }

    if (task.done && ui.editingCompletion[task.id]) {
      html += renderCompletionForm(section, task, "edit-completion");
    }
    if (!task.done && ui.completing[task.id] && !editing) {
      html += renderCompletionForm(section, task, "complete");
    }

    html += '</div>';
    if (!editing) {
      html += '<span class="owner-tag" style="color:' + color + ';background:color-mix(in srgb, ' + color + ' 12%, var(--card));border-color:color-mix(in srgb, ' + color + ' 30%, var(--card));">' + userSvg() + ' ' + escapeHtml(eigenaarNaam(task)) + '</span>';
      if (!task.done) {
        html += '<button class="edit-btn" data-action="open-edit-task" data-section="' + section.id + '" data-task="' + task.id + '" aria-label="Bewerk taak">' + pencilSvg() + '</button>';
      }
      html += '<button class="delete-btn" data-action="delete-task" data-section="' + section.id + '" data-task="' + task.id + '" aria-label="Verwijder taak">' + xSvg() + '</button>';
    }
    html += '</div>';
    return html;
  }

  function renderEditTaskForm(section, task, owners) {
    var useCustom = !!ui.editCustomOwner[task.id] || owners.indexOf(task.owner) === -1;
    var html = '<div class="add-form" data-form="edit-task" data-section="' + section.id + '" data-task="' + task.id + '" style="border-top:none;padding-top:0;">';
    html += '<div class="form-row single"><input type="text" class="txt-input" data-field="title" value="' + escapeHtml(task.title) + '" data-autofocus="1" /></div>';
    html += '<div class="form-row">';
    html += '<div class="owner-col">';
    if (!useCustom) {
      html += renderEigenaarVeld(task);
    } else {
      html += '<div class="custom-owner-row">';
      html += '<input type="text" class="txt-input" data-field="owner-custom" value="' + escapeHtml(task.owner) + '" placeholder="Naam" />';
      html += '<button type="button" class="icon-btn small" data-action="cancel-edit-custom-owner" data-task="' + task.id + '">' + xSvg(14) + '</button>';
      html += '</div>';
    }
    html += '</div>';
    // Oudere taken hebben een vrije datumtekst ("17 aug"); die past niet in een
    // datumkiezer, dus dan een tekstveld — anders werd de tekst bij bewerken gewist.
    if (task.when && !/^\d{4}-\d{2}-\d{2}$/.test(task.when)) {
      html += '<input type="text" class="txt-input date-field" data-field="when" value="' + escapeHtml(task.when) + '" title="Wanneer (optioneel)" />';
    } else {
      html += '<input type="date" class="txt-input date-field" data-field="when" value="' + escapeHtml(task.when || "") + '" title="Wanneer (optioneel)" />';
    }
    html += '</div>';
    html += '<div class="form-row single"><textarea class="txt-input note-area" data-field="note" placeholder="Toelichting (optioneel)" rows="3">' + escapeHtml(task.note || "") + '</textarea></div>';
    html += renderTaskLabelField(section, taskLabels(task));
    html += renderRelatieVeld(task);
    html += '<div class="form-row single">';
    html += '<div class="followup-hint">Categorie</div>';
    html += '<select class="sel-input" data-field="section-target">';
    (currentSections || []).forEach(function (s) {
      html += '<option value="' + escapeHtml(s.id) + '"' + (s.id === section.id ? " selected" : "") + '>' + escapeHtml(s.title) + '</option>';
    });
    html += '</select>';
    html += '</div>';
    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-edit-task" data-section="' + section.id + '" data-task="' + task.id + '">Opslaan</button>';
    html += '<button class="cancel-btn" data-action="cancel-edit-task" data-task="' + task.id + '">Annuleren</button>';
    html += '</div></div>';
    return html;
  }

  function renderCompletionForm(section, task, mode) {
    var date = task.completedDate || todayISO();
    var note = task.completedNote || "";
    var existingDecision = findDecisionForTask(task.id);
    var decisionText = existingDecision ? existingDecision.text : "";
    var showExtra = !!ui.completingExtra[task.id] || !!decisionText;
    var html = '<div class="complete-form" data-form="complete" data-section="' + section.id + '" data-task="' + task.id + '" data-mode="' + mode + '">';
    html += '<div class="form-row single"><input type="date" class="txt-input date-field" data-field="date" value="' + escapeHtml(date) + '" /></div>';
    html += '<div class="form-row single"><textarea class="txt-input" rows="3" data-field="note" placeholder="Commentaar bij afronding (optioneel)" data-autofocus="1">' + escapeHtml(note) + '</textarea></div>';

    if (!showExtra) {
      html += '<button type="button" class="completion-extra-toggle" data-action="toggle-completing-extra" data-task="' + task.id + '">' + plusSvg() + 'Vervolgtaak of besluit toevoegen</button>';
      html += '<input type="hidden" data-field="followup-title" value="" />';
      html += '<input type="hidden" data-field="decision-text" value="" />';
    } else {
      html += '<div class="completion-extra">';
      html += '<div class="form-row single">';
      html += '<div class="followup-hint">Vervolgtaak — wordt toegevoegd aan hetzelfde onderdeel</div>';
      html += '<input type="text" class="txt-input" data-field="followup-title" placeholder="Titel van de vervolgtaak…" />';
      html += '</div>';
      html += '<div class="form-row single">';
      html += '<div class="followup-hint">Besluit — komt op de besluitenlijst</div>';
      html += '<textarea class="txt-input" rows="2" data-field="decision-text" placeholder="Omschrijving van het besluit…">' + escapeHtml(decisionText) + '</textarea>';
      html += '</div>';
      html += '</div>';
    }

    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-complete" data-section="' + section.id + '" data-task="' + task.id + '" data-mode="' + mode + '">Bevestig afronding</button>';
    html += '<button class="cancel-btn" data-action="cancel-complete" data-section="' + section.id + '" data-task="' + task.id + '" data-mode="' + mode + '">Annuleren</button>';
    html += '</div></div>';
    return html;
  }

  function renderAddForm(section, owners) {
    var useCustom = !!ui.customOwner[section.id];
    var html = '<div class="add-form" data-form="add" data-section="' + section.id + '">';
    html += '<div class="form-row single"><input type="text" class="txt-input" data-field="title" placeholder="Nieuwe taak…" data-autofocus="1" /></div>';
    html += '<div class="form-row">';
    html += '<div class="owner-col">';
    if (!useCustom) {
      html += renderEigenaarVeld(null);
    } else {
      html += '<div class="custom-owner-row">';
      html += '<input type="text" class="txt-input" data-field="owner-custom" placeholder="Naam" data-autofocus="1" />';
      html += '<button type="button" class="icon-btn small" data-action="cancel-custom-owner" data-section="' + section.id + '">' + xSvg(14) + '</button>';
      html += '</div>';
    }
    html += '</div>';
    html += '<input type="date" class="txt-input date-field" data-field="when" title="Wanneer (optioneel)" />';
    html += '</div>';
    html += '<div class="form-row single"><textarea class="txt-input note-area" data-field="note" placeholder="Toelichting (optioneel)" rows="3"></textarea></div>';
    html += renderTaskLabelField(section, []);
    html += renderRelatieVeld(null);
    html += '<div class="form-actions">';
    html += '<button class="save-btn" data-action="submit-add" data-section="' + section.id + '">Taak toevoegen</button>';
    html += '<button class="cancel-btn" data-action="cancel-add" data-section="' + section.id + '">Annuleren</button>';
    html += '</div></div>';
    return html;
  }

  // Wie doet het? Drie lagen: onze eigen mensen, losse namen die geen
  // persoon zijn, en iemand van een andere organisatie.
  function renderEigenaarVeld(taak) {
    var gekozenPersoon = (taak && taak.eigenaarPersoonId) || "";
    var gekozenNaam = (taak && !gekozenPersoon && taak.owner) || "";
    var onsVolk = eigenMensen();
    var namen = losseNamen();
    var extern = null;
    if (gekozenPersoon) {
      var pp = persoonOp(gekozenPersoon);
      if (pp && onsVolk.indexOf(pp) === -1) extern = pp;
    }

    var html = '<span class="eigenaar-houder flex1">';
    html += '<select class="sel-input" data-field="owner-keuze">';
    if (!gekozenPersoon && !gekozenNaam) html += '<option value="" selected>— wie doet het? —</option>';

    if (onsVolk.length) {
      html += '<optgroup label="Onze mensen">';
      onsVolk.forEach(function (x) {
        html += '<option value="p:' + escapeHtml(x.id) + '"' + (x.id === gekozenPersoon ? " selected" : "") + '>' + escapeHtml(volledigeNaam(x)) + '</option>';
      });
      html += '</optgroup>';
    }
    if (namen.length) {
      html += '<optgroup label="Namen zonder persoon">';
      namen.forEach(function (n) {
        html += '<option value="n:' + escapeHtml(n) + '"' + (n === gekozenNaam ? " selected" : "") + '>' + escapeHtml(n) + '</option>';
      });
      html += '</optgroup>';
    }
    if (extern) {
      var eOrg = organisatieOp(extern.organisatie_id);
      html += '<optgroup label="Van buiten">';
      html += '<option value="p:' + escapeHtml(extern.id) + '" selected>' + escapeHtml(volledigeNaam(extern)) + (eOrg ? " \u00b7 " + escapeHtml(eOrg.naam) : "") + '</option>';
      html += '</optgroup>';
    }
    html += '<option value="__extern__">+ Iemand van een andere organisatie…</option>';
    html += '<option value="__eigennaam__">+ Andere naam…</option>';
    html += '</select>';
    html += '</span>';
    return html;
  }

  // Het uitklapveld voor iemand van buiten: eerst de organisatie, dan de persoon.
  function externKiezer(orgId) {
    var html = '<div class="extern-kiezer">';
    html += '<select class="sel-input" data-field="extern-org">';
    html += '<option value="">— organisatie kiezen —</option>';
    organisaties.filter(function (o) { return !o.eigen; }).forEach(function (o) {
      html += '<option value="' + escapeHtml(o.id) + '"' + (o.id === orgId ? " selected" : "") + '>' + escapeHtml(o.naam) + '</option>';
    });
    html += '</select>';
    html += '<select class="sel-input" data-field="owner-keuze">';
    var lijst = orgId ? personenBij(orgId) : [];
    if (!lijst.length) {
      html += '<option value="">' + (orgId ? "— deze organisatie heeft nog geen personen —" : "— eerst een organisatie —") + '</option>';
    } else {
      html += '<option value="">— persoon kiezen —</option>';
      lijst.forEach(function (x) {
        html += '<option value="p:' + escapeHtml(x.id) + '">' + escapeHtml(volledigeNaam(x)) + '</option>';
      });
    }
    html += '</select>';
    html += '<button type="button" class="icon-btn small" data-action="terug-naar-eigenaarlijst" title="Terug naar de keuzelijst">' + xSvg(14) + '</button>';
    html += '</div>';
    return html;
  }

  function renderRelatieVeld(taak) {
    var orgId = (taak && taak.organisatieId) || "";
    var persId = (taak && taak.persoonId) || "";
    // Staat er een persoon maar geen organisatie, dan die van de persoon tonen.
    if (persId && !orgId) {
      var pp = persoonOp(persId);
      if (pp) orgId = pp.organisatie_id || "";
    }
    var html = '<div class="form-row single">';
    html += '<div class="followup-hint">Relatie (optioneel)</div>';
    html += '<div class="form-row" style="margin:0;">';
    html += '<select class="sel-input flex1" data-field="actie-org">';
    html += '<option value="">— geen organisatie —</option>';
    organisaties.forEach(function (o) {
      html += '<option value="' + escapeHtml(o.id) + '"' + (o.id === orgId ? " selected" : "") + '>' + escapeHtml(o.naam) + '</option>';
    });
    html += '</select>';
    html += '<select class="sel-input flex1" data-field="actie-persoon">';
    html += '<option value="">— geen persoon —</option>';
    (orgId ? personenBij(orgId) : personen).forEach(function (x) {
      html += '<option value="' + escapeHtml(x.id) + '"' + (x.id === persId ? " selected" : "") + '>' + escapeHtml(volledigeNaam(x)) + '</option>';
    });
    html += '</select>';
    html += '</div></div>';
    return html;
  }

  function renderTaskLabelField(section, huidige) {
    var suggesties = labelsInSection(section).filter(function (l) { return huidige.indexOf(l) === -1; });
    var html = '<div class="form-row single">';
    html += '<div class="followup-hint">Label (optioneel) — meerdere mag, gescheiden door komma\'s</div>';
    html += '<input type="text" class="txt-input" data-field="task-labels" value="' + escapeHtml(huidige.join(", ")) + '" placeholder="Bijv. Pica Project" />';
    if (suggesties.length) {
      html += '<div class="label-suggests">';
      suggesties.forEach(function (l) {
        html += '<button type="button" class="label-suggest" data-action="add-task-label" data-label="' + escapeHtml(l) + '" style="color:' + labelColor(l) + ';">+ ' + escapeHtml(l) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function attachAutofocus() {
    var el = document.querySelector('[data-autofocus="1"]');
    if (el) el.focus();
  }

  // ---- Mutaties ----

  function cloneSections() {
    return JSON.parse(JSON.stringify(currentSections));
  }

  // Zet de lijst zoals hij op het scherm staat om naar tabelregels.
  function categorieRijen(secties) {
    return (secties || []).map(function (s) {
      return { id: s.id, nr: s.nr, titel: s.title, labels: sectionLabels(s) };
    });
  }
  function actieRijen(secties) {
    var rijen = [];
    (secties || []).forEach(function (s) {
      s.tasks.forEach(function (t, i) {
        rijen.push({
          id: t.id, categorie_id: s.id, titel: t.title,
          eigenaar: t.owner || "", eigenaar_persoon_id: t.eigenaarPersoonId || null,
          wanneer: t.when || "", notitie: t.note || "",
          labels: taskLabels(t),
          organisatie_id: t.organisatieId || null,
          persoon_id: t.persoonId || null,
          gereed: !!t.done,
          gereed_op: isoDatumOfNull(t.completedDate),
          gereed_notitie: t.completedNote || "",
          volgorde: i
        });
      });
    });
    return rijen;
  }
  function besluitRijen(besluiten) {
    return (besluiten || []).map(function (d) {
      return {
        id: d.id, tekst: d.text, datum: isoDatumOfNull(d.date),
        actie_id: d.taskId || null,
        categorie_titel: d.sectionTitle || "", actie_titel: d.taskTitle || ""
      };
    });
  }
  function isoDatumOfNull(w) {
    return /^\d{4}-\d{2}-\d{2}$/.test(w || "") ? w : null;
  }

  // Wat is er veranderd tussen twee verzamelingen regels?
  function verschillen(oud, nieuw) {
    var oudOp = {};
    oud.forEach(function (r) { oudOp[r.id] = JSON.stringify(r); });
    var nieuwIds = {};
    var schrijven = [];
    nieuw.forEach(function (r) {
      nieuwIds[r.id] = true;
      if (oudOp[r.id] !== JSON.stringify(r)) schrijven.push(r);
    });
    var wissen = oud.filter(function (r) { return !nieuwIds[r.id]; })
                    .map(function (r) { return r.id; });
    return { schrijven: schrijven, wissen: wissen };
  }

  function wegschrijven(tabel, oud, nieuw) {
    var v = verschillen(oud, nieuw);
    var stappen = [];
    if (v.schrijven.length) stappen.push(sb.from(tabel).upsert(v.schrijven));
    if (v.wissen.length) stappen.push(sb.from(tabel).delete().in("id", v.wissen));
    return stappen;
  }

  function persist(next, nextDecisions) {
    var oudeSecties = currentSections || [];
    var oudeBesluiten = currentDecisions || [];
    currentSections = next;
    if (nextDecisions !== undefined) currentDecisions = nextDecisions;
    render();
    if (!sb) return;
    if (!magBewerken()) { saveError = true; render(); return; }

    syncing = true;
    render();

    // Categorieën eerst: een nieuwe actie verwijst ernaar. Verwijderen
    // gaat andersom, dus acties gaan vóór de categorieën eruit.
    var catV = verschillen(categorieRijen(oudeSecties), categorieRijen(next));
    var actV = verschillen(actieRijen(oudeSecties), actieRijen(next));
    var besV = verschillen(besluitRijen(oudeBesluiten), besluitRijen(currentDecisions));

    var keten = Promise.resolve();
    function stap(fn) { keten = keten.then(function () { return controleer(fn()); }); }

    if (catV.schrijven.length) stap(function () { return sb.from("categorieen").upsert(catV.schrijven); });
    if (actV.schrijven.length) stap(function () { return sb.from("acties").upsert(actV.schrijven); });
    if (besV.schrijven.length) stap(function () { return sb.from("besluiten").upsert(besV.schrijven); });
    if (besV.wissen.length) stap(function () { return sb.from("besluiten").delete().in("id", besV.wissen); });
    if (actV.wissen.length) stap(function () { return sb.from("acties").delete().in("id", actV.wissen); });
    if (catV.wissen.length) stap(function () { return sb.from("categorieen").delete().in("id", catV.wissen); });

    keten.then(function () {
      syncing = false; saveError = false; render();
    }).catch(function () {
      // Mislukt: haal de echte toestand terug op, zodat het scherm niet
      // iets toont wat niet is opgeslagen.
      syncing = false; saveError = true; render();
      laadAlles().then(render).catch(function () {});
    });
  }

  function controleer(p) {
    return Promise.resolve(p).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }

  function magBewerken() {
    return mijnRol === "bewerker" || mijnRol === "beheerder";
  }

  function findTask(sections, sectionId, taskId) {
    var s = sections.find(function (s) { return s.id === sectionId; });
    if (!s) return null;
    return s.tasks.find(function (t) { return t.id === taskId; }) || null;
  }

  function completeTask(sectionId, taskId, completedDate, completedNote) {
    completeTaskWithFollowup(sectionId, taskId, completedDate, completedNote, "", "");
  }

  function completeTaskWithFollowup(sectionId, taskId, completedDate, completedNote, followupTitle, decisionText) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.done = true;
    t.completedDate = completedDate;
    t.completedNote = completedNote;
    delete ui.completing[taskId];
    delete ui.editingCompletion[taskId];

    var s = next.find(function (s) { return s.id === sectionId; });

    if (followupTitle && s) {
      s.tasks.push({
        id: sectionId + "-" + Date.now(),
        title: followupTitle,
        owner: t.owner,
        when: "",
        note: "Vervolg op: " + t.title,
        done: false
      });
    }

    var nextDecisions = cloneDecisions();
    var existingIndex = nextDecisions.findIndex(function (d) { return d.taskId === taskId; });
    if (decisionText) {
      var record = {
        id: existingIndex !== -1 ? nextDecisions[existingIndex].id : "besluit-" + Date.now(),
        text: decisionText,
        date: completedDate,
        sectionTitle: s ? s.title : "",
        taskTitle: t.title,
        taskId: taskId
      };
      if (existingIndex !== -1) { nextDecisions[existingIndex] = record; } else { nextDecisions.push(record); }
    } else if (existingIndex !== -1) {
      nextDecisions.splice(existingIndex, 1);
    }

    persist(next, nextDecisions);
  }

  function updateDecision(decisionId, text, date) {
    var next = cloneDecisions();
    var d = next.find(function (x) { return x.id === decisionId; });
    if (!d) return;
    d.text = text;
    d.date = date;
    persist(currentSections, next);
  }

  function deleteDecision(decisionId) {
    var next = cloneDecisions().filter(function (d) { return d.id !== decisionId; });
    persist(currentSections, next);
  }

  // Heropenen bewaart datum en commentaar van de vorige afronding, zodat er
  // niets verloren gaat en opnieuw afronden die gegevens weer voorstelt.
  function uncompleteTask(sectionId, taskId) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.done = false;
    persist(next);
  }

  function deleteTask(sectionId, taskId) {
    var next = cloneSections();
    var s = next.find(function (s) { return s.id === sectionId; });
    if (!s) return;
    s.tasks = s.tasks.filter(function (t) { return t.id !== taskId; });
    persist(next);
  }

  function addTask(sectionId, task) {
    var next = cloneSections();
    var s = next.find(function (s) { return s.id === sectionId; });
    if (!s) return;
    task.id = sectionId + "-" + Date.now();
    task.done = false;
    task.labels = task.labels || [];
    task.organisatieId = task.organisatieId || "";
    task.persoonId = task.persoonId || "";
    task.eigenaarPersoonId = task.eigenaarPersoonId || "";
    s.tasks.push(task);
    persist(next);
  }

  function updateTask(sectionId, taskId, patch) {
    var next = cloneSections();
    var t = findTask(next, sectionId, taskId);
    if (!t) return;
    t.title = patch.title;
    t.owner = patch.owner;
    t.when = patch.when;
    t.note = patch.note;
    t.labels = patch.labels || [];
    t.organisatieId = patch.organisatieId || "";
    t.persoonId = patch.persoonId || "";
    t.eigenaarPersoonId = patch.eigenaarPersoonId || "";

    if (patch.sectionId && patch.sectionId !== sectionId) {
      var from = next.find(function (s) { return s.id === sectionId; });
      var to = next.find(function (s) { return s.id === patch.sectionId; });
      if (from && to) {
        from.tasks = from.tasks.filter(function (x) { return x.id !== taskId; });
        to.tasks.push(t);
        ui.collapsed[to.id] = false;
      }
    }

    persist(next);
  }

  // Hernoemt een categorie en zet haar op de gevraagde plek in de leesvolgorde.
  // Daarna krijgen alle categorieën weer een aaneensluitend nummer (1, 2, 3, …).
  function updateSection(sectionId, title, desiredNr, labels) {
    var next = cloneSections();
    var index = next.findIndex(function (s) { return s.id === sectionId; });
    if (index === -1) return;

    next[index].title = title;
    next[index].labels = labels;
    delete next[index].group; // oude vaste groep is vervangen door labels

    var target = Math.min(Math.max(desiredNr, 1), next.length);
    var moved = next.splice(index, 1)[0];
    next.splice(target - 1, 0, moved);
    next.forEach(function (s, i) { s.nr = i + 1; });

    persist(next);
  }

  function deleteSection(sectionId) {
    var target = (currentSections || []).find(function (s) { return s.id === sectionId; });
    if (!target || target.tasks.length > 0) return;
    var next = cloneSections().filter(function (s) { return s.id !== sectionId; });
    persist(next);
  }

  function slugify(title) {
    return title
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "categorie";
  }

  function addSection(title, labels) {
    var next = cloneSections();
    var maxNr = next.reduce(function (m, s) { return Math.max(m, s.nr || 0); }, 0);
    var baseId = slugify(title);
    var id = baseId;
    var i = 2;
    while (next.some(function (s) { return s.id === id; })) {
      id = baseId + "-" + i;
      i++;
    }
    next.push({ id: id, nr: maxNr + 1, title: title, labels: labels || [], tasks: [] });
    persist(next);
  }

  // ---- Event delegation ----

  document.getElementById("app").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");

    } else if (action === "annuleer-org") {

    } else if (action === "bewerk-org") {

    } else if (action === "bewaar-org") {

    } else if (action === "bewaar-persoon") {

      };

        naam: pnaam,

      };
      if (persoonId === "nieuw") delete ui.nieuwPersoonBij[orgId]; else delete ui.bewerkPersoon[persoonId];
      bewaarRelatie("personen", prij, personen);

    } else if (action === "verwijder-persoon") {

      if (!decText) return;
      delete ui.editingDecision[decisionId];
      updateDecision(decisionId, decText, decDate);
    } else if (action === "delete-section") {
      deleteSection(sectionId);
    } else if (action === "open-edit-section") {
      ui.editingSection[sectionId] = true;
      render();
    } else if (action === "cancel-edit-section") {
      delete ui.editingSection[sectionId];
      render();
    } else if (action === "submit-edit-section") {
      var secForm = btn.closest('[data-form="edit-section"]');
      var newTitle = secForm.querySelector('[data-field="section-title"]').value.trim();
      var newNr = parseInt(secForm.querySelector('[data-field="section-nr"]').value, 10);
      var newLabels = parseLabels(secForm.querySelector('[data-field="section-labels"]').value);
      if (!newTitle) return;
      delete ui.editingSection[sectionId];
      updateSection(sectionId, newTitle, isNaN(newNr) ? 1 : newNr, newLabels);
    } else if (action === "add-label-suggestion") {
      var labelForm = btn.closest('[data-form="edit-section"]');
      var labelInput = labelForm.querySelector('[data-field="section-labels"]');
      var huidige = parseLabels(labelInput.value);
      var nieuwLabel = btn.getAttribute("data-label");
      if (huidige.indexOf(nieuwLabel) === -1) huidige.push(nieuwLabel);
      labelInput.value = huidige.join(", ");
      labelInput.focus();
    } else if (action === "add-task-label") {
      var taakLabelForm = btn.closest("[data-form]");
      var taakLabelInput = taakLabelForm.querySelector('[data-field="task-labels"]');
      var huidigeTaakLabels = parseLabels(taakLabelInput.value);
      var nieuwTaakLabel = btn.getAttribute("data-label");
      if (huidigeTaakLabels.indexOf(nieuwTaakLabel) === -1) huidigeTaakLabels.push(nieuwTaakLabel);
      taakLabelInput.value = huidigeTaakLabels.join(", ");
      taakLabelInput.focus();
    } else if (action === "set-task-label-filter") {
      ui.taskLabelFilter[sectionId] = btn.getAttribute("data-label");
      render();
    } else if (action === "clear-task-label-filter") {
      delete ui.taskLabelFilter[sectionId];
      render();
    } else if (action === "open-edit-task") {
      ui.editingTask[taskId] = true;
      render();
    } else if (action === "cancel-edit-task") {
      delete ui.editingTask[taskId];
      delete ui.editCustomOwner[taskId];
      render();
    } else if (action === "cancel-edit-custom-owner") {
      delete ui.editCustomOwner[taskId];
      render();
    } else if (action === "submit-edit-task") {
      var eform = btn.closest('[data-form="edit-task"]');
      var etitle = eform.querySelector('[data-field="title"]').value.trim();
      var eWie = leesEigenaar(eform);
      var eowner = eWie.naam;
      var ewhen = eform.querySelector('[data-field="when"]').value.trim();
      var enote = eform.querySelector('[data-field="note"]').value.trim();
      var etargetField = eform.querySelector('[data-field="section-target"]');
      var etarget = etargetField ? etargetField.value : sectionId;
      if (!etitle || (!eowner && !eWie.persoonId)) return;
      delete ui.editingTask[taskId];
      delete ui.editCustomOwner[taskId];
      var elabels = parseLabels(eform.querySelector('[data-field="task-labels"]').value);
      updateTask(sectionId, taskId, { title: etitle, owner: eowner, eigenaarPersoonId: eWie.persoonId,
        when: ewhen, note: enote, sectionId: etarget, labels: elabels,
        organisatieId: leesVeld(eform, "actie-org"), persoonId: leesVeld(eform, "actie-persoon") });
    } else if (action === "toggle-collapse-all") {
      var visibleForCollapse = filterSectionsByLabel(currentSections, ui.labelFilter);
      var shouldCollapse = !visibleForCollapse.every(function (s) { return !!ui.collapsed[s.id]; });
      visibleForCollapse.forEach(function (s) {
        ui.collapsed[s.id] = shouldCollapse;
        if (shouldCollapse) closeOpenFormsInSection(s.id);
      });
      render();
    } else if (action === "set-label-filter") {
      ui.labelFilter = btn.getAttribute("data-label");
      render();
    } else if (action === "download-pdf") {
      downloadPdf();
    } else if (action === "download-adressen") {
      downloadExcel("adressen");
    } else if (action === "download-mailing") {
      downloadExcel("mailing");
    } else if (action === "open-add-section") {
      ui.addingSection = true;
      render();
    } else if (action === "cancel-add-section") {
      ui.addingSection = false;
      render();
    } else if (action === "submit-add-section") {
      var sform = btn.closest(".add-section-card");
      var stitle = sform.querySelector('[data-field="section-title"]').value.trim();
      var slabelsField = sform.querySelector('[data-field="section-labels"]');
      if (!stitle) return;
      addSection(stitle, parseLabels(slabelsField ? slabelsField.value : ""));
      ui.addingSection = false;
    }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    if (e.target.matches('[data-field="relatie-zoek"]')) {
      ui.relatieZoek = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var opnieuw = document.querySelector('[data-field="relatie-zoek"]');
      if (opnieuw) { opnieuw.focus(); try { opnieuw.setSelectionRange(pos, pos); } catch (x) {} }
    }
  });

  document.getElementById("app").addEventListener("change", function (e) {
    if (e.target.matches('[data-action="set-sort"]')) {
      ui.sortMode = e.target.value;
      render();
      return;
    }
    if (e.target.matches('[data-action="set-keuze-filter"]')) {
      if (e.target.getAttribute("data-keuzeveld") === "sector") ui.sectorFilter = e.target.value;
      else ui.soortFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches('[data-action="set-action-label-filter"]')) {
      ui.actionLabelFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches('[data-action="set-label-filter"]')) {
      ui.labelFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches('[data-action="set-date-filter"]')) {
      ui.dateFilter = e.target.value;
      render();
      return;
    }
    if (e.target.matches("[data-keuzeveld]") && e.target.value === "__eigen__") {
      var houder = e.target.closest(".soort-holder");
      if (houder) {
        houder.innerHTML = keuzeVeldTekst(houder.getAttribute("data-keuzeveld"), "");
        var invoer = houder.querySelector("input");
        if (invoer) invoer.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="extern-org"]')) {
      var kiezer = e.target.closest(".extern-kiezer");
      if (kiezer) {
        var houder = kiezer.parentNode;
        houder.innerHTML = externKiezer(e.target.value);
        var nieuwVeld = houder.querySelector('[data-field="extern-org"]');
        if (nieuwVeld) nieuwVeld.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="owner-keuze"]') && e.target.value === "__extern__") {
      var wieHouder = e.target.closest(".eigenaar-houder");
      if (wieHouder) {
        wieHouder.innerHTML = externKiezer("");
        var orgVeld = wieHouder.querySelector('[data-field="extern-org"]');
        if (orgVeld) orgVeld.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="owner-keuze"]') && e.target.value === "__eigennaam__") {
      var naamHouder = e.target.closest(".eigenaar-houder");
      if (naamHouder) {
        naamHouder.innerHTML = '<div class="custom-owner-row">'
          + '<input type="text" class="txt-input" data-field="owner-custom" placeholder="Naam" />'
          + '<button type="button" class="icon-btn small" data-action="terug-naar-eigenaarlijst">' + xSvg(14) + '</button>'
          + '</div>';
        var tekstVeld = naamHouder.querySelector("input");
        if (tekstVeld) tekstVeld.focus();
      }
      return;
    }
    if (e.target.matches('[data-field="owner-select"]') && e.target.value === "__custom__") {
      var addForm = e.target.closest('[data-form="add"]');
      var editForm = e.target.closest('[data-form="edit-task"]');
      if (addForm) {
        ui.customOwner[e.target.getAttribute("data-section")] = true;
      } else if (editForm) {
        ui.editCustomOwner[e.target.getAttribute("data-task")] = true;
      }
      render();
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var addForm = e.target.closest('[data-form="add"]');
    if (addForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      addForm.querySelector('[data-action="submit-add"]').click();
      return;
    }
    var completeForm = e.target.closest('[data-form="complete"]');
    if (completeForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      completeForm.querySelector('[data-action="submit-complete"]').click();
      return;
    }
    var editForm = e.target.closest('[data-form="edit-task"]');
    if (editForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      editForm.querySelector('[data-action="submit-edit-task"]').click();
      return;
    }
    var editSectionForm = e.target.closest('[data-form="edit-section"]');
    if (editSectionForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      editSectionForm.querySelector('[data-action="submit-edit-section"]').click();
      return;
    }
    var sectionForm = e.target.closest(".add-section-card");
    if (sectionForm && e.target.tagName === "INPUT") {
      e.preventDefault();
      sectionForm.querySelector('[data-action="submit-add-section"]').click();
    }
  });

  window.addEventListener("beforeprint", function () {
    ui.collapsed = {};
    render();
  });

  // ---- Inloggen, laden en live bijwerken ----

  function laadAlles() {
    return Promise.all([
      sb.from("categorieen").select("*").order("nr"),
      sb.from("acties").select("*").order("volgorde"),
      sb.from("besluiten").select("*"),
      sb.from("organisaties").select("*").order("naam"),
      sb.from("personen").select("*"),
      sb.from("organisatie_soorten").select("*").order("volgorde"),
      sb.from("organisatie_sectoren").select("*").order("volgorde")
    ]).then(function (r) {
      r.forEach(function (x, i) { if (x.error && i < 5) throw x.error; });
      var cats = r[0].data || [], acts = r[1].data || [], bes = r[2].data || [];
      organisaties = r[3].data || [];
      personen = (r[4].data || []).sort(opAchternaam);
      soorten = (r[5].data || []).map(function (x) { return x.naam; });
      sectoren = (r[6].data || []).map(function (x) { return x.naam; });

      currentSections = cats.map(function (c) {
        return {
          id: c.id, nr: c.nr, title: c.titel, labels: c.labels || [],
          tasks: acts.filter(function (a) { return a.categorie_id === c.id; })
                     .map(function (a) {
            return {
              id: a.id, title: a.titel, owner: a.eigenaar || "", when: a.wanneer || "",
              note: a.notitie || "", labels: a.labels || [],
              organisatieId: a.organisatie_id || "", persoonId: a.persoon_id || "",
              eigenaarPersoonId: a.eigenaar_persoon_id || "",
              done: !!a.gereed, completedDate: a.gereed_op || "",
              completedNote: a.gereed_notitie || ""
            };
          })
        };
      });
      currentDecisions = bes.map(function (b) {
        return {
          id: b.id, text: b.tekst, date: b.datum || "", taskId: b.actie_id || "",
          sectionTitle: b.categorie_titel || "", taskTitle: b.actie_titel || ""
        };
      });
    });
  }

  // Wijzigingen van anderen meteen overnemen.
  function luisterOpWijzigingen() {
    try {
      sb.channel("lijst")
        .on("postgres_changes", { event: "*", schema: "public" }, function () {
          if (syncing) return;              // eigen schrijfactie loopt nog
          laadAlles().then(render).catch(function () {});
        })
        .subscribe();
    } catch (e) { /* zonder live bijwerken werkt de lijst ook */ }
  }

  function bepaalRol() {
    return sb.from("leden").select("rol,email").then(function (r) {
      if (r.error) { mijnRol = null; return; }
      var eigen = (r.data || []).find(function (l) {
        return (l.email || "").toLowerCase() === (sessie.user.email || "").toLowerCase();
      });
      mijnRol = eigen ? eigen.rol : null;
    });
  }

  function naInloggen() {
    return bepaalRol().then(function () {
      if (!mijnRol) { render(); return; }      // wel ingelogd, geen toegang
      return laadAlles().then(function () {
        render();
        luisterOpWijzigingen();
      });
    }).catch(function (e) {
      opstartFout = "De lijst kon niet worden geladen.\n\n" +
                    "Melding: " + ((e && (e.message || e.hint || e.details)) || String(e));
      console.error("Laden mislukt:", e);
      render();
    });
  }

  function stuurInloglink(email) {
    inlogStatus = "Bezig…";
    render();
    sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.href.split("#")[0] }
    }).then(function (r) {
      inlogStatus = r.error
        ? "Versturen lukte niet: " + r.error.message
        : "Gelukt. Je krijgt een mail met een link om in te loggen — die kun je in dit venster openen.";
      render();
    });
  }

  function uitloggen() {
    sb.auth.signOut().then(function () {
      sessie = null; mijnRol = null;
      currentSections = null; currentDecisions = null;
      render();
    });
  }

  function init() {
    render();
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      opstartFout = "De verbinding met de database is nog niet ingesteld. " +
                    "Vul bovenin dit bestand de twee gegevens van Supabase in.";
      render();
      return;
    }
    function haalBibliotheek(i) {
      if (i >= SUPABASE_LIBS.length) {
        return Promise.reject(new Error("de bibliotheek kon van geen enkel adres geladen worden"));
      }
      return import(SUPABASE_LIBS[i]).catch(function () { return haalBibliotheek(i + 1); });
    }

    var laden = window.__maakClient
      ? Promise.resolve(window.__maakClient(SUPABASE_URL, SUPABASE_ANON_KEY))
      : haalBibliotheek(0).then(function (mod) {
          if (!mod || !mod.createClient) throw new Error("de bibliotheek laadde, maar bevat geen createClient");
          return mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        });

    laden.then(function (client) {
      sb = client;
      sb.auth.onAuthStateChange(function (_gebeurtenis, nieuweSessie) {
        var was = sessie && sessie.user && sessie.user.id;
        sessie = nieuweSessie;
        var is = sessie && sessie.user && sessie.user.id;
        if (is && is !== was) naInloggen();
        if (!is) render();
      });
      return sb.auth.getSession();
    }).then(function (r) {
      sessie = (r && r.data && r.data.session) || null;
      if (sessie) return naInloggen();
      render();
    }).catch(function (err) {
      opstartFout = "Er kon geen verbinding met de database worden gemaakt.\n\n" +
                    "Melding: " + ((err && (err.message || err.error_description)) || String(err));
      console.error("Opstarten mislukt:", err);
      render();
    });
  }

  // De lettertypen worden pas opgehaald nadat de pagina volledig geladen is.
  // Zo kan een trage of geblokkeerde verbinding met Google het openen van de
  // lijst nooit ophouden; tot die tijd staat alles in de systeemletter.
  function loadWebfonts() {
    if (document.getElementById("webfonts")) return;
    var el = document.createElement("link");
    el.id = "webfonts";
    el.rel = "stylesheet";
    el.href = "https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap";
    document.head.appendChild(el);
  }
  if (document.readyState === "complete") {
    setTimeout(loadWebfonts, 0);
  } else {
    window.addEventListener("load", function () { setTimeout(loadWebfonts, 0); });
  }

  init();
})();
</script>
</body>
</html>
