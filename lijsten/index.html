<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobiel Erfgoed Console — Stichting Mobiele Collectie Nederland</title>
<script>
  // Licht of donker zoals gekozen onder het tandwieltje; leeg = volg het apparaat.
  try { var t = localStorage.getItem("mec-thema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
  :root {
    --ink: #1E2624;
    --ink-soft: #5C6B66;
    --ink-faint: #90A19B;
    --paper: #F3F7F6;
    --card: #FFFFFF;
    --line: #DCE6E3;
    --line-soft: #EDF3F1;
    --header-bg: #EBF3F1;
    --blok: #EDF7F4;
    --blok-kop: #FFFFFF;
    --accent: #1D9C8C;
    --accent-soft: #DFF3EF;
    --accent-ink: #0C6358;
    --danger: #C4638E;
    --danger-soft: #FBECF2;
    --mcn-teal: #4DAE97;
    --mcn-pink: #C46FA0;
    --mcn-blue: #4FA3D6;
    --mcn-grey: #646C79;
    --shadow: 0 1px 2px rgba(24,33,30,.05), 0 14px 28px -20px rgba(24,33,30,.25);
    --r-lg: 16px;
    --r-md: 10px;
    --r-sm: 7px;
    --r-pill: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .relaties-thema {
      --accent: #75C3EA; --accent-soft: #1B3244; --accent-ink: #A9D8F2; --blok: #0E1821;
    }
    :root:not([data-theme="light"]) {
      --ink: #EAF2F1;
      --ink-soft: #9FB0AE;
      --ink-faint: #6E7D79;
      --paper: #14201F;
      --card: #1C2827;
      --line: #2C3B39;
      --line-soft: #23312E;
      --header-bg: #223130;
      --blok: #0F1918;
      --blok-kop: #1C2827;
      --accent: #4FC9B4;
      --accent-soft: #1E3A34;
      --accent-ink: #8FE0CE;
      --danger: #E28FB0;
      --danger-soft: #3A2430;
      --mcn-teal: #4DAE97;
      --mcn-pink: #D890BA;
      --mcn-blue: #6FBCE8;
      --mcn-grey: #97A0AB;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 28px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] .relaties-thema {
    --accent: #75C3EA; --accent-soft: #1B3244; --accent-ink: #A9D8F2; --blok: #0E1821;
  }
  :root[data-theme="dark"] {
    --ink: #EAF2F1;
    --ink-soft: #9FB0AE;
    --ink-faint: #6E7D79;
    --paper: #14201F;
    --card: #1C2827;
    --line: #2C3B39;
    --line-soft: #23312E;
    --header-bg: #223130;
    --blok: #0F1918;
    --blok-kop: #1C2827;
    --accent: #4FC9B4;
    --accent-soft: #1E3A34;
    --accent-ink: #8FE0CE;
    --danger: #E28FB0;
    --danger-soft: #3A2430;
    --mcn-teal: #4DAE97;
    --mcn-pink: #D890BA;
    --mcn-blue: #6FBCE8;
    --mcn-grey: #97A0AB;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 28px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 44px 20px 88px;
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .heading-font { font-family: "Baloo 2", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* Breder dan voorheen (720px), zodat de relatielijst en de acties meer
     kwijt kunnen. Boven de 1180px wordt een tekstregel te lang om
     prettig te lezen, dus daar stopt het. */
  .container { max-width: 1180px; margin: 0 auto; }
  /* De toelichting bij een actie blijft wel op leesbare breedte. */
  .task-meta .note { max-width: 78ch; }

  .masthead-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 4px;
  }
  /* Het i-knopje rechtsboven met het versienummer. Bij aanwijzen of
     aantikken verschijnt een kaartje. */
  .versie-houder { position: relative; align-self: flex-start; }
  .tandwiel-knop {
    margin-left: auto; align-self: flex-start; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-faint); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .tandwiel-knop:hover, .tandwiel-knop.actief { color: var(--accent); border-color: var(--accent); }
  .masthead-row .tandwiel-knop + .versie-houder { margin-left: -8px; }
  .versie-knop {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-faint); cursor: pointer;
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .versie-knop:hover, .versie-houder.open .versie-knop { color: var(--accent); border-color: var(--accent); }
  .versie-info {
    display: none; position: absolute; right: 0; top: 30px; z-index: 20; white-space: nowrap;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--shadow); padding: 10px 14px; font-size: 12.5px; color: var(--ink-soft);
  }
  .versie-info strong { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
  .versie-houder:hover .versie-info, .versie-houder:focus-within .versie-info, .versie-houder.open .versie-info { display: block; }
  @media print { .versie-houder, .tandwiel-knop { display: none; } }

  .logo-img {
    width: 78px;
    height: 52px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .kicker {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  h1 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 32px;
    margin: 0 0 24px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .totals {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .totals-number { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .totals-track { flex: 1; height: 6px; background: var(--line-soft); border-radius: var(--r-pill); overflow: hidden; }
  .totals-fill { height: 100%; background: linear-gradient(90deg, var(--mcn-teal), var(--accent)); border-radius: var(--r-pill); transition: width 0.3s ease; }
  .sync-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Wie alleen mag meekijken, krijgt de wijzigknoppen niet te zien. */
  .alleen-lezen .edit-btn,
  .alleen-lezen .delete-btn,
  .alleen-lezen .add-task-btn,
  .alleen-lezen .add-section-btn,
  .alleen-lezen .check-btn { display: none !important; }
  .alleen-lezen .task-row { padding-left: 2px; }
  .meekijk-melding {
    font-size: 12.5px; color: var(--ink-soft); background: var(--line-soft);
    border-radius: var(--r-sm); padding: 8px 12px; margin: 0 0 16px;
  }

  .seg-telling { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; opacity: 0.7; margin-left: 3px; }
  .soorten-kaart { border-color: var(--accent); }
  .soort-row { padding: 9px 0; }
  .vink-regel { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--ink-soft); padding: 2px 0 4px; cursor: pointer; }
  .vink-regel input { margin-top: 2px; accent-color: var(--accent); }
  .vink-regel .followup-hint { display: block; margin: 1px 0 0; }
  .eigen-merk {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: var(--r-pill);
  }

  .eigenaar-houder { display: flex; min-width: 0; }
  .eigenaar-houder > * { flex: 1; min-width: 0; }
  /* Organisatie, Wie en Datum naast elkaar, elk met een kopje erboven. */
  .wie-kiezer { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; width: 100%; }
  .veld { display: flex; flex-direction: column; flex: 1 1 180px; min-width: 0; }
  .veld > .followup-hint { margin: 0 0 4px; }
  .veld select, .veld input { width: 100%; }
  .datum-veld { flex: 0 0 150px; }
  .veld.smal { flex: 0 0 130px; }
  .veld.breed { flex: 2 1 240px; }
  .veld textarea { width: 100%; }
  .soort-holder { display: flex; }
  .soort-holder > * { flex: 1; min-width: 0; }
  .filter-row .zoek-veld { flex: 0 1 320px; min-width: 180px; }
  .datum-veld .date-field { flex: none; width: 100%; }
  .form-row.naast-elkaar { align-items: flex-start; }
  .naast-elkaar .veld > .form-row { margin-bottom: 0; }
  .naast-elkaar .veld > .form-row > .followup-hint { margin: 0 0 4px; }
  .add-form .form-row.single > .followup-hint { margin: 0 0 4px; }
  .wie-extern { display: block; font-size: 9.5px; font-weight: 600; opacity: 0.75; margin-top: -1px; }

  .soort-holder { display: flex; }
  .soort-holder > * { flex: 1; min-width: 0; }
  .zoek-veld { font-size: 12.5px; padding: 5px 10px; min-width: 200px; }
  .pc-field { flex: 0 0 96px; }
  .tv-field { flex: 0 0 104px; }
  .geslacht-veld { flex: 0 0 150px; }
  .org-adres { white-space: pre-line; }

  .relatie-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--accent-ink); background: var(--accent-soft);
    border: none; border-radius: var(--r-pill); padding: 3px 9px 3px 7px;
    cursor: pointer; align-self: flex-start;
  }
  .relatie-chip svg { width: 11px; height: 11px; flex-shrink: 0; }
  .relatie-chip:hover { filter: brightness(0.96); }
  .relatie-meta { font-size: 12px; color: var(--ink-faint); flex: 1; min-width: 60px; }
  .persoon-row .task-title { font-size: 14px; }

  /* Alle acties als kolommen: vinkje, actie, wie, datum, categorie,
     label, relatie. Onder 980px klapt het terug naar onder elkaar. */
  .acties-tabel { padding: 6px 18px 12px; }
  .acties-kop, .actie-regel {
    display: grid;
    grid-template-columns: 22px minmax(180px, 2.4fr) minmax(0, 1.3fr) minmax(0, 118px) minmax(0, 1fr) minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 12px;
  }
  .acties-kop {
    font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-faint); padding: 6px 0 8px; border-bottom: 1px solid var(--line);
  }
  /* Elke actie een eigen kaartje op een rustige ondergrond, met links een
     smal streepje in de kleur van wie het doet. Dat scheidt de regels en
     laat meteen zien van wie een actie is. */
  .acties-tabel { padding: 12px; }
  /* Het blok onder de acties loopt van rand tot rand van de kaart en heeft
     een eigen kleur, anders dan het scherm. Zo ook bij Alle acties. */
  .acties-kaart .acties-body { background: var(--blok); padding: 12px 12px 14px; }
  .acties-body .acties-tabel { background: transparent; padding: 0; }
  .acties-kaart > .section-header.open { background: var(--blok-kop); }
  .acties-body .add-task-btn { border-top-color: var(--line); margin-top: 12px; padding: 12px 4px 0; }
  .acties-body .empty-state { padding: 6px 4px 4px; }

  /* Kop van een groep in de weergaven Per persoon, Per relatie en Agenda. */
  .groep-stip { width: 9px; height: 9px; }
  .groep-sub { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
  .groep-telling {
    margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--ink-soft); white-space: nowrap;
  }
  .groep-verlopen, .section-title.groep-verlopen { color: var(--danger); }
  .groep-link { flex: 0 0 auto; font-size: 12px; }
  .acties-kop { padding: 4px 13px 10px; border-bottom: none; }
  .actie-regel {
    font-size: 13px;
    padding: 11px 13px 11px 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--balk, var(--line));
    border-radius: var(--r-md);
    margin-bottom: 7px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .actie-regel:last-child { margin-bottom: 0; }
  .actie-regel:hover { box-shadow: var(--shadow); }
  /* Een afgeronde actie houdt hetzelfde kaartje en hetzelfde kleurbalkje;
     dat hij klaar is blijkt uit het gevulde bolletje en de doorgestreepte
     titel. Een doorzichtige achtergrond maakte er een gat van, en zette
     tegelijk het kleurbalkje uit. */
  .actie-regel.gereed {
    background: var(--paper);
    border-color: var(--line);
    border-left-color: color-mix(in srgb, var(--balk, var(--line)) 45%, var(--paper));
  }
  .actie-regel.gereed .ak-veld { color: var(--ink-faint); }
  .actie-regel.gereed .ak-stip { opacity: 0.45; }

  /* Binnen een actieregel geen doosjes in het doosje: wie krijgt een klein
     gekleurd stipje met de naam ernaast, en label, categorie en relatie zijn
     gewone gedempte tekst. Anders staan er drie randjes in een regel. */
  .ak-wie { display: inline-flex; align-items: center; gap: 7px; min-width: 0; color: var(--ink-soft); }
  .ak-stip { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ak-wie-naam { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ak-wie .wie-extern { color: var(--ink-faint); font-weight: 500; }
  .ak-label {
    font-family: inherit; font-size: 11.5px; color: var(--ink-faint);
    background: none; border: none; padding: 0; cursor: pointer; text-align: left;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ak-label + .ak-label { margin-left: 8px; }
  .ak-label:hover { color: var(--accent); text-decoration: underline; }
  .acties-tabel.zonder-categorie {
    grid-template-columns: 22px minmax(180px, 2.4fr) minmax(0, 1.3fr) minmax(0, 118px) minmax(0, 1fr) auto;
  }
  .acties-tabel.zonder-categorie .acties-kop,
  .acties-tabel.zonder-categorie .actie-regel {
    grid-template-columns: 22px minmax(180px, 2.4fr) minmax(0, 1.3fr) minmax(0, 118px) minmax(0, 1fr) auto;
  }
  .ak-note {
    display: block; font-size: 11.5px; font-weight: 400; color: var(--ink-faint);
    margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ak-titel { font-weight: 600; color: var(--ink); min-width: 0; }
  .actie-regel.gereed .ak-titel { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }
  .ak-veld { color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .ak-veld.verlopen { color: var(--danger); font-weight: 600; }
  .ak-vink { display: flex; align-items: center; }
  .ak-knoppen { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  .ak-link {
    font-family: inherit; font-size: 11.5px; color: var(--ink-faint); background: none;
    border: none; padding: 0; cursor: pointer; text-align: left; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ak-link:hover { color: var(--accent); text-decoration: underline; }
  /* Een geopende actie is een wit kaartje zoals de andere regels, met rand
     en kleurbalkje, zodat je ziet waar hij begint en waar de volgende start. */
  .actie-formulier {
    background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--balk, var(--accent));
    border-radius: var(--r-md); margin-bottom: 7px; padding: 4px 14px 6px 10px;
    box-shadow: var(--shadow);
  }
  .actie-formulier:last-child { margin-bottom: 0; }
  .actie-formulier > .task-row { border-top: none; }
  .actie-formulier .complete-form {
    background: none; border-radius: 0; border-top: 1px solid var(--line);
    padding: 12px 0 2px; max-width: none;
  }
  /* Een nieuwe actie toevoegen: hetzelfde witte kaartje, onder de lijst.
     Alleen het formulier dat direct in het blok staat; het bewerkformulier
     gebruikt dezelfde klasse maar zit al in een kaartje. */
  .actie-formulier .add-form { border-top: none; padding-top: 4px; }
  .acties-body > .add-form {
    background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--r-md);
    margin-top: 7px; padding: 14px 14px 10px 12px; box-shadow: var(--shadow);
  }

  @media (max-width: 980px) {
    .acties-kop { display: none; }
    .actie-regel { grid-template-columns: 22px 1fr auto; row-gap: 3px; padding: 12px 0; align-items: start; }
    .actie-regel .ak-vink { grid-row: 1; grid-column: 1; }
    .actie-regel .ak-titel { grid-row: 1; grid-column: 2; }
    .actie-regel .ak-knoppen { grid-row: 1; grid-column: 3; }
    .actie-regel .ak-veld { grid-column: 2; white-space: normal; }
    .actie-regel .ak-veld:empty { display: none; }
  }

  /* De personenlijst als kolommen: naam, functie, organisatie, e-mail,
     telefoon. Op een smal scherm klapt het terug naar onder elkaar. */
  .personen-tabel { padding: 6px 18px 12px; }
  .personen-kop, .persoon-regel {
    display: grid;
    grid-template-columns: minmax(130px, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.5fr) minmax(0, 118px) auto;
    align-items: center;
    column-gap: 14px;
  }
  .personen-kop {
    font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-faint); padding: 6px 0 8px; border-bottom: 1px solid var(--line);
  }
  .persoon-regel { padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .persoon-regel:hover { background: var(--line-soft); }
  .pk-naam { font-weight: 700; color: var(--ink); }
  .pk-veld { color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-veld .relatie-chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; white-space: nowrap; }
  .pk-leeg { color: var(--ink-faint); font-style: italic; }
  .pk-knoppen { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  .persoon-formulier { padding: 4px 0; border-top: 1px solid var(--line-soft); }

  @media (max-width: 820px) {
    .personen-kop { display: none; }
    .persoon-regel { grid-template-columns: 1fr auto; row-gap: 2px; padding: 12px 0; }
    .persoon-regel .pk-naam { grid-column: 1; }
    .persoon-regel .pk-knoppen { grid-row: 1 / span 5; grid-column: 2; align-items: flex-start; }
    .persoon-regel .pk-veld { grid-column: 1; white-space: normal; }
    .persoon-regel .pk-veld:empty { display: none; }
  }
  /* Bij een contactpersoon staan de gegevens achter elkaar in plaats van
     onder elkaar; bij een actie blijft het onder elkaar staan. */
  .persoon-row .task-meta {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    column-gap: 18px;
    row-gap: 4px;
  }
  .persoon-row .task-title-row { gap: 12px; }
  .persoon-functie { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .contact-link { color: var(--ink-soft); text-decoration: none; }
  .contact-link:hover { color: var(--accent); text-decoration: underline; }
  .org-details { padding: 10px 0 4px; border-bottom: 1px solid var(--line-soft); }
  .org-website { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .org-website:hover { text-decoration: underline; }

  .poort {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: 28px 26px; max-width: 460px; margin: 8px auto 0;
  }
