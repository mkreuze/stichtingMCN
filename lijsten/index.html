<script>
(function () {
  "use strict";

  // Het i-knopje: op een telefoon is er geen aanwijzen, dus ook aantikken.
  (function () {
    var houder = document.querySelector(".versie-houder");
    if (!houder) return;
    var knop = houder.querySelector(".versie-knop");
    knop.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = houder.classList.toggle("open");
      knop.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", function () {
      houder.classList.remove("open");
      knop.setAttribute("aria-expanded", "false");
    });
  })();

  // ─── Verbinding met de database ───────────────────────────────────
  // Deze twee waarden staan in Supabase onder Settings → API Keys:
  // de Project URL en de publishable sleutel (sb_publishable_...).
  // Ze mogen openbaar zijn: wat iemand mag zien en wijzigen wordt in de
  // database zelf bepaald, aan de hand van de tabel "leden".
  // De secret sleutel (sb_secret_...) hoort hier NOOIT te staan.
  var SUPABASE_URL = "https://zdpmrliolynupkbydxpp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_kLI1xtdgeAir1K6d7vc7ng_Mn_pBURg";
  // De soorten organisaties komen uit de database en zijn in de Console
  // zelf te beheren (tabblad Relaties, knop "Soorten beheren").
  var soorten = [];
  var sectoren = [];

  // De twee keuzelijsten werken hetzelfde; deze beschrijving houdt de
  // code op één plek in plaats van alles twee keer.
  var KEUZELIJSTEN = [
    { veld: "soort",  tabel: "organisatie_soorten",  kop: "Soorten organisaties",
      omschrijving: "Wat voor organisatie is het", lees: function () { return soorten; },
      zet: function (v) { soorten = v; } },
    { veld: "sector", tabel: "organisatie_sectoren", kop: "Sectoren",
      omschrijving: "In welk deel van het mobiel erfgoed is ze actief", lees: function () { return sectoren; },
      zet: function (v) { sectoren = v; } }
  ];
  function keuzelijst(veld) {
    return KEUZELIJSTEN.find(function (k) { return k.veld === veld; });
  }

  // Twee adressen voor dezelfde bibliotheek: is de eerste onbereikbaar,
  // dan wordt de tweede geprobeerd.
  var SUPABASE_LIBS = [
    "https://esm.sh/@supabase/supabase-js@2",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  ];

  var sb = null;            // verbinding met de database
  var sessie = null;        // wie is er ingelogd
  var mijnRol = null;       // kijker | bewerker | beheerder | null
  var leden = [];           // de ledenlijst: wie mag inloggen, met welke rol
  // Wat mag ik zien? Na 21-rechten-per-gebruiker.sql per gebruiker in te
  // stellen; daarvoor ziet iedereen alles. Een beheerder ziet altijd alles.
  var heeftRechten = false;
  var mijnRechten = { acties: true, groepen: [], besluiten: true, relaties: true };
  var inlogStatus = "";     // melding op het inlogscherm
  var opstartFout = "";     // als de verbinding niet lukt
  var organisaties = [];
  // Pas na 17-wie-organisatie.sql bestaat acties.eigenaar_organisatie_id.
  // Tot die tijd schrijven we het veld niet mee, anders mislukt opslaan.
  var heeftWieOrg = false;
  var personen = [];

  // De lijst komt volledig uit de database; er is geen startlijst in de pagina.

  // Lokale UI-state (niet gedeeld, niet opgeslagen)
  var ui = {
    view: "acties", // acties | besluiten | relaties
    bewerkOrg: {},      // organisatie-id -> true
    bewerkPersoon: {},  // persoon-id -> true
    nieuweOrg: false,
    nieuwPersoonBij: {},// organisatie-id -> true
    relatieFilter: "alle", // "alle" of een organisatie-id
    relatieView: "organisaties", // organisaties | personen
    actieView: "alle",           // categorie | alle | persoon | organisatie | agenda
    nieuweActie: false,          // het formulier "Nieuwe actie" boven de lijst
    relFilterOpen: false,        // het filterpaneel bij de relaties
    bewerkLabel: null,           // label dat onder Instellingen wordt hernoemd
    instelOpen: { weergave: true }, // welke kaarten onder Instellingen open staan
    bewerkLid: null,             // e-mailadres van de gebruiker die wordt bewerkt, of "nieuw"
    lidFout: "",                 // melding bij het opslaan van een gebruiker
    groepDicht: {},              // "weergave|groep" -> true als ingeklapt
    filterOpen: false,           // het filterpaneel onder de knop Filter
    relatieZoek: "",   // zoektekst in de relatielijst
    soortFilter: "alle",   // "alle", een soort, of "geen"
    sectorFilter: "alle",  // idem voor sector
    soortenBeheer: false, // het beheerpaneel voor soorten
    bewerkSoort: {},      // soortnaam -> true
    nieuwSoort: false,
    openOrg: {},        // organisatie-id -> true (personen tonen)
    filter: "todo", // todo | done | alle
    labelFilter: "alle", // "alle" of de naam van een label
    actionLabelFilter: "alle", // "alle" of een label dat op acties staat
    sortMode: "standaard", // standaard | label | datum
    dateFilter: "alle", // alle | verlopen | week | maand | geen
    editingDecision: {}, // besluit-id -> true
    taskLabelFilter: {}, // sectionId -> label (alleen acties met dat label tonen)
    collapsed: {},
    adding: {},        // sectionId -> true
    customOwner: {},   // sectionId -> true (aan het typen van nieuwe naam)
    completing: {},    // taskId -> true (bezig met afronden)
    completingExtra: {}, // taskId -> true (vervolgtaak/besluit-velden getoond)
    editingCompletion: {}, // taskId -> true (afrondingsgegevens bewerken)
    reopening: {},     // taskId -> true (bevestiging om weer open te zetten)
    editingTask: {},   // taskId -> true (taakgegevens bewerken)
    editingSection: {}, // sectionId -> true (naam/volgnummer bewerken)
    editCustomOwner: {}, // taskId -> true (aan het typen van nieuwe naam bij bewerken)
    addingSection: false // formulier voor nieuwe categorie tonen
  };

  var currentSections = null;
  var currentDecisions = null;
  var syncing = false;
  var saveError = false;
  var pdfStatus = "";

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Categorieën hadden vroeger één vaste groep; dat leest nu als labels verder.
  // Oude gegevens hoeven daardoor niet omgezet te worden.
  var LEGACY_GROUP_LABELS = {
    bestuur: ["Bestuur"],
    projectgroep: ["Projectgroep"],
    beide: ["Bestuur", "Projectgroep"]
  };
  var LABEL_PALETTE = { "Bestuur": "#3E86B8", "Projectgroep": "#1D9C8C" };
  var LABEL_HUES = ["#B85D95", "#7A6BA6", "#C07A3E", "#4A8F6B", "#646C79", "#3E86B8", "#1D9C8C"];

  function sectionLabels(section) {
    if (Array.isArray(section.labels)) return section.labels;
    return LEGACY_GROUP_LABELS[section.group] || [];
  }

  function taskLabels(task) {
    return Array.isArray(task.labels) ? task.labels : [];
  }

  // Labels van acties verschillen per categorie, dus suggesties komen
  // altijd uit dezelfde categorie.
  function organisatieOp(id) {
    return organisaties.find(function (o) { return o.id === id; }) || null;
  }
  function persoonOp(id) {
    return personen.find(function (x) { return x.id === id; }) || null;
  }
  // De volledige naam uit de drie delen. Staan die niet ingevuld
  // (bijvoorbeeld bij oudere gegevens), dan blijft het naamveld gelden.
  function volledigeNaam(p) {
    if (!p) return "";
    var delen = [p.voornaam, p.tussenvoegsel, p.achternaam].filter(function (x) { return x && x.trim(); });
    return delen.length ? delen.join(" ") : (p.naam || "");
  }

  // Sorteren gaat op achternaam: dat is wat je in een adressenlijst zoekt.
  function opAchternaam(a, b) {
    var aa = (a.achternaam || a.naam || ""), bb = (b.achternaam || b.naam || "");
    var v = aa.localeCompare(bb, "nl");
    return v !== 0 ? v : (a.voornaam || "").localeCompare(b.voornaam || "", "nl");
  }

  var GESLACHTEN = [["", "—"], ["vrouw", "Vrouw"], ["man", "Man"], ["anders", "Anders"]];

  function adresVan(org) {
    if (!org) return "";
    var regel = [org.adres || "", [org.postcode || "", org.plaats || ""].filter(Boolean).join("  ")]
      .filter(Boolean).join(", ");
    return regel;
  }

  function personenBij(orgId) {
    return personen.filter(function (x) { return x.organisatie_id === orgId; });
  }
  // Bij welke organisatie hoort de actiehouder? Die van de persoon, of de
  // organisatie die als geheel is gekozen.
  function wieOrgId(taak) {
    if (taak.eigenaarPersoonId) {
      var p = persoonOp(taak.eigenaarPersoonId);
      if (p) return p.organisatie_id || "";
    }
    return taak.eigenaarOrgId || "";
  }
  function eigenOrganisatie() {
    return organisaties.filter(function (o) { return o.eigen; })[0] || null;
  }

  // De acties van een organisatie of persoon: waar die de actiehouder is.
  function actiesBij(orgId, persoonId) {
    var uit = [];
    (currentSections || []).forEach(function (sec) {
      sec.tasks.forEach(function (t) {
        if (persoonId ? t.eigenaarPersoonId === persoonId : wieOrgId(t) === orgId) {
          uit.push({ sectie: sec, taak: t });
        }
      });
    });
    return uit;
  }
  // Wie doet deze actie? Een persoon uit de relatielijst gaat voor; is er
  // geen gekoppeld, dan de losse naam ("Sectoren", "Allen").
  function eigenaarNaam(taak) {
    if (taak.eigenaarPersoonId) {
      var p = persoonOp(taak.eigenaarPersoonId);
      if (p) return volledigeNaam(p);
    }
    if (taak.eigenaarOrgId) {
      var o = organisatieOp(taak.eigenaarOrgId);
      if (o) return o.naam;
    }
    return taak.owner || "";
  }

  // Bij iemand van buiten is de organisatie net zo belangrijk als de naam.
  function eigenaarToelichting(taak) {
    if (!taak.eigenaarPersoonId) return "";
    var p = persoonOp(taak.eigenaarPersoonId);
    if (!p) return "";
    var org = organisatieOp(p.organisatie_id);
    if (!org || org.eigen) return "";
    return org.naam;
  }

  function nieuwId(voorvoegsel) {
    return voorvoegsel + "-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
  }

  // ── Opslaan van relaties ───────────────────────────────────────
  function bewaarRelatie(tabel, rij, lokaleLijst) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    syncing = true; render();
    controleer(sb.from(tabel).upsert(rij)).then(function () {
      var i = lokaleLijst.findIndex(function (x) { return x.id === rij.id; });
      if (i === -1) lokaleLijst.push(rij); else lokaleLijst[i] = rij;
      lokaleLijst.sort(tabel === "personen" ? opAchternaam
        : function (a, b) { return (a.naam || "").localeCompare(b.naam || "", "nl"); });
      syncing = false; saveError = false; render();
    }).catch(function () {
      syncing = false; saveError = true; render();
      laadAlles().then(render).catch(function () {});
    });
  }

  function bewaarSoort(veld, oudeNaam, nieuweNaam) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    var k = keuzelijst(veld);
    syncing = true; render();
    var lijst = k.lees();
    var volgorde = oudeNaam ? (lijst.indexOf(oudeNaam) + 1) * 10 : (lijst.length + 1) * 10 + 100;
    controleer(sb.from(k.tabel).upsert({ naam: nieuweNaam, volgorde: volgorde }))
      .then(function () {
        if (!oudeNaam) return;
        // Hernoemen: de organisaties die deze waarde hadden, gaan mee.
        var raken = organisaties.filter(function (o) { return o[veld] === oudeNaam; });
        return Promise.all(raken.map(function (o) {
          var patch = {}; patch[veld] = nieuweNaam;
          return controleer(sb.from("organisaties").update(patch).eq("id", o.id));
        })).then(function () {
          return controleer(sb.from(k.tabel).delete().eq("naam", oudeNaam));
        });
      })
      .then(function () { return laadAlles(); })
      .then(function () { syncing = false; saveError = false; render(); })
      .catch(function () { syncing = false; saveError = true; render(); laadAlles().then(render).catch(function () {}); });
  }

  function verwijderSoort(veld, naam) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    var k = keuzelijst(veld);
    syncing = true; render();
    controleer(sb.from(k.tabel).delete().eq("naam", naam))
      .then(function () {
        k.zet(k.lees().filter(function (x) { return x !== naam; }));
        syncing = false; saveError = false; render();
      })
      .catch(function () { syncing = false; saveError = true; render(); });
  }

  function verwijderRelatie(tabel, id, lokaleLijst) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    syncing = true; render();
    controleer(sb.from(tabel).delete().eq("id", id)).then(function () {
      var i = lokaleLijst.findIndex(function (x) { return x.id === id; });
      if (i !== -1) lokaleLijst.splice(i, 1);
      syncing = false; saveError = false; render();
      // Acties die eraan hingen zijn in de database losgekoppeld; hier ook.
      laadAlles().then(render).catch(function () {});
    }).catch(function () {
      syncing = false; saveError = true; render();
    });
  }

  function allTaskLabels(sections) {
    var set = {};
    (sections || []).forEach(function (s) {
      s.tasks.forEach(function (t) { taskLabels(t).forEach(function (l) { set[l] = true; }); });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "nl"); });
  }

  function labelsInSection(section) {
    var set = {};
    section.tasks.forEach(function (t) { taskLabels(t).forEach(function (l) { set[l] = true; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "nl"); });
  }

  function allLabels(sections) {
    var set = {};
    (sections || []).forEach(function (s) {
      sectionLabels(s).forEach(function (l) { set[l] = true; });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "nl"); });
  }

  function labelColor(label) {
    if (LABEL_PALETTE[label]) return LABEL_PALETTE[label];
    var hash = 0;
    for (var i = 0; i < label.length; i++) hash = label.charCodeAt(i) + ((hash << 5) - hash);
    return LABEL_HUES[Math.abs(hash) % LABEL_HUES.length];
  }

  // De keuzelijst levert "p:<persoon-id>", "o:<organisatie-id>" (de hele
  // organisatie) of "n:<naam>"; het losse tekstveld levert gewoon een naam.
  function leesEigenaar(form) {
    var leeg = { naam: "", persoonId: "", orgId: "" };
    var eigen = form.querySelector('[data-field="owner-custom"]');
    if (eigen) return { naam: eigen.value.trim(), persoonId: "", orgId: "" };
    var keuze = form.querySelector('[data-field="owner-keuze"]');
    var w = keuze ? keuze.value : "";
    if (w.indexOf("p:") === 0) {
      var p = persoonOp(w.slice(2));
      return p ? { naam: volledigeNaam(p), persoonId: p.id, orgId: p.organisatie_id || "" } : leeg;
    }
    if (w.indexOf("o:") === 0) {
      var o = organisatieOp(w.slice(2));
      return o ? { naam: o.naam, persoonId: "", orgId: o.id } : leeg;
    }
    if (w.indexOf("n:") === 0) return { naam: w.slice(2), persoonId: "", orgId: "" };
    return leeg;
  }

  // Ontbreekt de titel of wie het doet, dan krijgt dat veld een rood randje
  // en de focus, in plaats van dat er stil niets gebeurt.
  function formulierCompleet(form, titel, wie) {
    form.querySelectorAll(".veld-fout").forEach(function (x) { x.classList.remove("veld-fout"); });
    var mist = !titel ? form.querySelector('[data-field="title"]')
             : !wie ? form.querySelector('[data-field="owner-keuze"], [data-field="owner-custom"]')
             : null;
    if (!mist) return true;
    mist.classList.add("veld-fout");
    mist.focus();
    return false;
  }

  function leesVeld(form, naam) {
    var el = form.querySelector('[data-field="' + naam + '"]');
    return el ? el.value.trim() : "";
  }

  function parseLabels(text) {
    return String(text || "").split(",").map(function (l) {
      return l.trim();
    }).filter(function (l, i, arr) {
      return l && arr.indexOf(l) === i;
    });
  }

  var OWNER_PALETTE = { "Marinus": "#1D9C8C", "Sectoren": "#3E86B8", "Marketing": "#B85D95" };
  var HUES = ["#3E86B8", "#B85D95", "#1D9C8C", "#646C79", "#7A6BA6"];
  function ownerColor(owner) {
    if (OWNER_PALETTE[owner]) return OWNER_PALETTE[owner];
    var hash = 0;
    for (var i = 0; i < owner.length; i++) hash = owner.charCodeAt(i) + ((hash << 5) - hash);
    return HUES[Math.abs(hash) % HUES.length];
  }

  function todayISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function formatDateNL(iso) {
    if (!iso) return "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  }

  function knownOwners(sections) {
    var set = {};
    sections.forEach(function (s) { s.tasks.forEach(function (t) { if (t.owner) set[t.owner] = true; }); });
    return Object.keys(set);
  }

  // Bij het openen staan alle categorieën ingeklapt: je ziet eerst een inhoudsopgave.
  // Categorieën die je later zelf toevoegt beginnen wel uitgeklapt.
  var initialCollapseApplied = false;
  function applyInitialCollapse() {
    if (initialCollapseApplied || !currentSections) return;
    initialCollapseApplied = true;
    currentSections.forEach(function (s) { ui.collapsed[s.id] = true; });
  }

  // Invouwen sluit ook de formulieren die in die categorie openstonden,
  // anders staat een taak bij het volgende uitklappen nog in bewerkmodus.
  function closeOpenFormsInSection(sectionId) {
    delete ui.adding[sectionId];
    delete ui.taskLabelFilter[sectionId];
    delete ui.customOwner[sectionId];
    var s = (currentSections || []).find(function (x) { return x.id === sectionId; });
    if (!s) return;
    s.tasks.forEach(function (t) {
      delete ui.editingTask[t.id];
      delete ui.editCustomOwner[t.id];
      delete ui.completing[t.id];
      delete ui.completingExtra[t.id];
      delete ui.editingCompletion[t.id];
      delete ui.reopening[t.id];
    });
  }

  function parseWhenDate(when) {
    if (when && /^\d{4}-\d{2}-\d{2}$/.test(when)) return when;
    return null;
  }

  function addDaysISO(iso, dagen) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + dagen);
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  // Alleen echte datums (uit de datumkiezer) zijn te vergelijken; vrije tekst
  // zoals "week van 17 aug" telt als "zonder datum".
  function matchesDateFilter(task) {
    if (ui.dateFilter === "alle") return true;
    var d = parseWhenDate(task.when);
    if (ui.dateFilter === "geen") return !d;
    if (!d) return false;
    var vandaag = todayISO();
    if (ui.dateFilter === "verlopen") return d < vandaag;
    if (ui.dateFilter === "week") return d <= addDaysISO(vandaag, 7);
    if (ui.dateFilter === "maand") return d <= addDaysISO(vandaag, 30);
    return true;
  }

  function sortedSections(sections) {
    var list = sections.slice();
    if (ui.sortMode === "label") {
      list.sort(function (a, b) {
        var la = sectionLabels(a)[0] || "";
        var lb = sectionLabels(b)[0] || "";
        if (la !== lb) {
          if (!la) return 1;
          if (!lb) return -1;
          return la.localeCompare(lb, "nl");
        }
        return (a.nr || 0) - (b.nr || 0);
      });
    }
    return list;
  }

  // Taken zonder echte datum ("week van 17 aug") komen achteraan.
  function sortedTasks(tasks) {
    if (ui.sortMode !== "datum") return tasks;
    var list = tasks.slice();
    list.sort(function (a, b) {
      var da = parseWhenDate(a.when);
      var db = parseWhenDate(b.when);
      if (da && db) return da < db ? -1 : da > db ? 1 : 0;
      if (da && !db) return -1;
      if (!da && db) return 1;
      return 0;
    });
    return list;
  }

  function filterSectionsByLabel(sections, labelFilter) {
    if (labelFilter === "alle") return sections;
    return sections.filter(function (s) { return sectionLabels(s).indexOf(labelFilter) !== -1; });
  }

  function cloneDecisions() {
    return JSON.parse(JSON.stringify(currentDecisions || []));
  }

  function findDecisionForTask(taskId) {
    return (currentDecisions || []).find(function (d) { return d.taskId === taskId; }) || null;
  }

  function sortedDecisions(decisions) {
    return (decisions || []).slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
  }

  function lightenHex(hex, pct) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    function mix(c) { return Math.round(c * pct + 255 * (1 - pct)); }
    return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
  }
  function ownerTagStyle(owner) {
    var color = ownerColor(owner);
    return "color:" + color + ";background:" + lightenHex(color, 0.14) + ";";
  }

  function buildPrintHtml(sections, labelFilter, decisions) {
    var visible = filterSectionsByLabel(sections, labelFilter);
    var scopeLabel = labelFilter === "alle" ? "alle labels" : labelFilter;
    var html = "";
    html += '<div class="pdf-kicker">Stichting Mobiele Collectie Nederland</div>';
    html += '<div class="pdf-h1">Mobiel Erfgoed Console</div>';
    html += '<div class="pdf-scope">Afgedrukt op ' + escapeHtml(formatDateNL(todayISO())) + " — " + escapeHtml(scopeLabel) + '</div>';

    visible.forEach(function (section) {
      html += '<div class="pdf-section-card">';
      html += '<div class="pdf-section-header"><span class="pdf-section-nr">' + String(section.nr).padStart(2, "0") + '</span><span class="pdf-section-title">' + escapeHtml(section.title) + '</span>';
      sectionLabels(section).forEach(function (l) {
        var lc = labelColor(l);
        html += '<span class="pdf-label" style="color:' + lc + ';background:' + lightenHex(lc, 0.14) + ';">' + escapeHtml(l) + '</span>';
      });
      html += '</div>';
      html += '<div class="pdf-section-body">';
      if (section.tasks.length === 0) {
        html += '<div class="pdf-empty">Geen taken.</div>';
      }
      section.tasks.forEach(function (task) {
        html += '<div class="pdf-row' + (task.done ? " done" : "") + '">';
        html += '<div class="pdf-check' + (task.done ? " done" : "") + '"></div>';
        html += '<div class="pdf-row-body">';
        html += '<div class="pdf-title-row"><div class="pdf-title">' + escapeHtml(task.title) + '</div><span class="pdf-owner" style="' + ownerTagStyle(task.owner) + '">' + escapeHtml(task.owner) + "</span></div>";
        var pdfTaakLabels = taskLabels(task);
        if (task.when || task.note || pdfTaakLabels.length || (task.done && task.completedDate)) {
          html += '<div class="pdf-meta">';
          if (pdfTaakLabels.length) {
            html += '<div class="pdf-labels">';
            pdfTaakLabels.forEach(function (l) {
              var lc = labelColor(l);
              html += '<span class="pdf-label" style="color:' + lc + ';background:' + lightenHex(lc, 0.14) + ';">' + escapeHtml(l) + '</span>';
            });
            html += '</div>';
          }
          if (task.when) html += '<span class="pdf-when">' + escapeHtml(formatDateNL(task.when)) + "</span>";
          if (task.done && task.completedDate) html += '<span class="pdf-when">Afgerond ' + escapeHtml(formatDateNL(task.completedDate)) + "</span>";
          if (task.note) html += '<div class="pdf-note">' + escapeHtml(task.note) + "</div>";
          html += "</div>";
        }
        html += "</div></div>";
      });
      html += "</div></div>";
    });

    if (visible.length === 0) {
      html += '<div class="pdf-empty">Geen categorieën met dit label.</div>';
    }

    var decisionList = sortedDecisions(decisions);
    html += '<div class="pdf-besluiten-heading">Besluitenlijst</div>';
    if (decisionList.length === 0) {
      html += '<div class="pdf-empty">Nog geen besluiten vastgelegd.</div>';
    } else {
      html += '<div class="pdf-section-card"><div class="pdf-section-body" style="padding-top:8px;">';
      decisionList.forEach(function (d) {
        var sourceBits = [d.date ? formatDateNL(d.date) : "", d.sectionTitle, d.taskTitle].filter(function (v) { return !!v; });
        html += '<div class="pdf-row"><div class="pdf-row-body">';
        html += '<div class="pdf-title">' + escapeHtml(d.text) + "</div>";
        if (sourceBits.length) html += '<div class="pdf-meta"><div class="pdf-note">' + escapeHtml(sourceBits.join("   ·   ")) + "</div></div>";
        html += "</div></div>";
      });
      html += "</div></div>";
    }

    return html;
  }

  function renderPdfBlob(sections, labelFilter, decisions) {
    return new Promise(function (resolve, reject) {
      if (!window.html2canvas || !window.jspdf) { resolve(null); return; }
      var container = document.createElement("div");
      container.id = "pdf-export-root";
      container.innerHTML = buildPrintHtml(sections, labelFilter, decisions);
      document.body.appendChild(container);

      function cleanup() {
        if (container.parentNode) container.parentNode.removeChild(container);
      }

      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      }).then(function () {
        var scale = 2;
        var rootRect = container.getBoundingClientRect();
        var rows = container.querySelectorAll(".pdf-row, .pdf-section-card, .pdf-besluiten-heading");
        var points = [];
        rows.forEach(function (r) {
          var rect = r.getBoundingClientRect();
          var top = Math.round((rect.top - rootRect.top) * scale);
          if (top > 0) points.push(top);
        });
        var breakPoints = Array.from(new Set(points)).sort(function (a, b) { return a - b; });

        return html2canvas(container, { scale: scale, backgroundColor: "#ffffff", useCORS: true }).then(function (canvas) {
          var jsPDFCtor = window.jspdf.jsPDF;
          var doc = new jsPDFCtor({ unit: "mm", format: "a4" });
          var pageWidthMM = doc.internal.pageSize.getWidth();
          var pageHeightMM = doc.internal.pageSize.getHeight();
          var marginMM = 14;
          var contentWidthMM = pageWidthMM - marginMM * 2;
          var pxPerMM = canvas.width / contentWidthMM;
          var pageContentHeightMM = pageHeightMM - marginMM * 2;
          var pageContentHeightPx = Math.floor(pageContentHeightMM * pxPerMM);

          var renderedPx = 0;
          var first = true;
          while (renderedPx < canvas.height) {
            var maxEnd = Math.min(renderedPx + pageContentHeightPx, canvas.height);
            var chosen = maxEnd;
            if (maxEnd < canvas.height) {
              for (var i = breakPoints.length - 1; i >= 0; i--) {
                if (breakPoints[i] > renderedPx && breakPoints[i] <= maxEnd) { chosen = breakPoints[i]; break; }
              }
            }
            var sliceHeightPx = chosen - renderedPx;
            if (sliceHeightPx <= 0) sliceHeightPx = maxEnd - renderedPx;

            var sliceCanvas = document.createElement("canvas");
            sliceCanvas.width = canvas.width;
            sliceCanvas.height = sliceHeightPx;
            var ctx = sliceCanvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
            ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

            if (!first) doc.addPage();
            first = false;
            var sliceHeightMM = sliceHeightPx / pxPerMM;
            doc.addImage(sliceCanvas.toDataURL("image/jpeg", 0.92), "JPEG", marginMM, marginMM, contentWidthMM, sliceHeightMM);

            renderedPx += sliceHeightPx;
          }

          cleanup();
          resolve(doc.output("blob"));
        });
      }).catch(function (err) {
        cleanup();
        reject(err);
      });
    });
  }

  // De PDF-bibliotheken zijn samen ruim een halve megabyte. Ze worden pas
  // opgehaald wanneer iemand echt een PDF wil, zodat de lijst zelf snel opent.
  var PDF_LIBS = [
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
  ];
  var pdfLibsPromise = null;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement("script");
      el.src = src;
      el.onload = function () { resolve(); };
      el.onerror = function () { reject(new Error("script laden mislukt")); };
      document.head.appendChild(el);
    });
  }

  function loadPdfLibs() {
    if (window.html2canvas && window.jspdf) return Promise.resolve();
    if (!pdfLibsPromise) {
      pdfLibsPromise = Promise.all(PDF_LIBS.map(loadScript)).catch(function (err) {
        pdfLibsPromise = null;   // volgende poging mag het opnieuw proberen
        throw err;
      });
    }
    return pdfLibsPromise;
  }

  function bewaarBestand(blob, bestandsnaam) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = bestandsnaam;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return Promise.resolve();
  }

  // ── Excel-bestanden ────────────────────────────────────────────
  var EXCEL_LIBS = [
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ];
  var excelPromise = null;

  function loadExcelLib() {
    if (window.XLSX) return Promise.resolve();
    if (!excelPromise) {
      excelPromise = laadEenVan(EXCEL_LIBS).catch(function (err) {
        excelPromise = null;
        throw err;
      });
    }
    return excelPromise;
  }

  function laadEenVan(adressen) {
    function poging(i) {
      if (i >= adressen.length) return Promise.reject(new Error("het bestand kon van geen enkel adres geladen worden"));
      return loadScript(adressen[i]).catch(function () { return poging(i + 1); });
    }
    return poging(0);
  }

  // Waar gaat deze download over? Dat zetten we boven de lijst, zodat
  // later terug te vinden is welke selectie je hebt uitgedraaid.
  function selectieOmschrijving() {
    var d = [];
    if (ui.soortFilter === "geen") d.push("zonder soort");
    else if (ui.soortFilter !== "alle") d.push("soort: " + ui.soortFilter);
    if (ui.sectorFilter === "geen") d.push("zonder sector");
    else if (ui.sectorFilter !== "alle") d.push("sector: " + ui.sectorFilter);
    if ((ui.relatieZoek || "").trim()) d.push('zoekterm: "' + ui.relatieZoek.trim() + '"');
    return d.length ? d.join(" \u00b7 ") : "alle relaties";
  }

  function adressenlijstRijen() {
    var orgs = zichtbareOrganisaties();
    var orgBlad = [["Organisatie", "Soort", "Sector", "Adres", "Postcode", "Plaats",
                    "E-mail algemeen", "Telefoon", "Website", "Toelichting",
                    "Personen", "Openstaande acties"]];
    orgs.forEach(function (o) {
      orgBlad.push([
        o.naam, o.soort || "", o.sector || "", o.adres || "", o.postcode || "", o.plaats || "",
        o.email || "", o.telefoon || "", o.website || "", o.notitie || "",
        personenBij(o.id).length,
        actiesBij(o.id, null).filter(function (x) { return !x.taak.done; }).length
      ]);
    });

    var persBlad = [["Voornaam", "Tussenvoegsel", "Achternaam", "Volledige naam", "Geslacht",
                     "Functie", "Organisatie", "E-mail", "Telefoon", "Openstaande acties"]];
    zichtbarePersonen().forEach(function (x) {
      var org = organisatieOp(x.organisatie_id);
      persBlad.push([
        x.voornaam || "", x.tussenvoegsel || "", x.achternaam || "", volledigeNaam(x), x.geslacht || "",
        x.functie || "", org ? org.naam : "", x.email || "", x.telefoon || "",
        actiesBij(null, x.id).filter(function (y) { return !y.taak.done; }).length
      ]);
    });
    return { organisaties: orgBlad, personen: persBlad };
  }

  function mailinglijstRijen() {
    var rijen = [["Naam", "Organisatie", "E-mailadres", "Soort adres"]];
    var gezien = {};
    function voegToe(naam, org, email, soort) {
      var sleutel = (email || "").trim().toLowerCase();
      if (!sleutel || gezien[sleutel]) return;
      gezien[sleutel] = true;
      rijen.push([naam, org, email.trim(), soort]);
    }
    zichtbarePersonen().forEach(function (x) {
      var org = organisatieOp(x.organisatie_id);
      voegToe(volledigeNaam(x), org ? org.naam : "", x.email, "persoon");
    });
    zichtbareOrganisaties().forEach(function (o) {
      voegToe("", o.naam, o.email, "algemeen");
    });
    return rijen;
  }

  function downloadExcel(soort) {
    pdfStatus = "Bestand maken\u2026";
    render();
    loadExcelLib().then(function () {
      var wb = XLSX.utils.book_new();
      var naam, toelichting;
      if (soort === "mailing") {
        var m = mailinglijstRijen();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(m), "Mailinglijst");
        naam = "mailinglijst-" + todayISO() + ".xlsx";
        toelichting = [["Mailinglijst"], [], ["Gemaakt op", formatDateNL(todayISO())],
          ["Selectie", selectieOmschrijving()], ["Aantal adressen", m.length - 1],
          [], ["Elk e-mailadres staat één keer in de lijst, ook als het bij"],
          ["meerdere personen of organisaties voorkwam."]];
      } else {
        var r = adressenlijstRijen();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r.organisaties), "Organisaties");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r.personen), "Personen");
        naam = "adressenlijst-" + todayISO() + ".xlsx";
        toelichting = [["Adressenlijst"], [], ["Gemaakt op", formatDateNL(todayISO())],
          ["Selectie", selectieOmschrijving()],
          ["Aantal organisaties", r.organisaties.length - 1],
          ["Aantal personen", r.personen.length - 1]];
      }
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(toelichting), "Over deze lijst");
      var data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      return bewaarBestand(new Blob([data], { type: "application/octet-stream" }), naam);
    }).then(function () {
      pdfStatus = "Gedownload.";
      render();
    }).catch(function (err) {
      pdfStatus = "Downloaden lukte niet: " + ((err && err.message) || String(err));
      render();
    });
  }

  function downloadPdf() {
    pdfStatus = "PDF opmaken…";
    render();
    loadPdfLibs().then(function () {
      return renderPdfBlob(currentSections, ui.labelFilter, currentDecisions);
    }).then(function (blob) {
      if (!blob) {
        pdfStatus = "PDF kon niet worden gemaakt. Ververs de pagina en probeer het opnieuw.";
        render();
        return;
      }
      pdfStatus = "Bestand aanbieden…";
      render();
      return bewaarBestand(blob, "mobiel-erfgoed-console-" + todayISO() + ".pdf").then(function () {
        pdfStatus = "Gedownload.";
        render();
      });
    }).catch(function (err) {
      pdfStatus = "Downloaden lukte niet" + (err && err.code ? " (" + err.code + ")" : "") + ".";
      render();
    });
  }

  function relatieZoekFilter(tekst) {
    var z = (ui.relatieZoek || "").trim().toLowerCase();
    if (!z) return true;
    return (tekst || "").toLowerCase().indexOf(z) !== -1;
  }

  function keuzeOk(org, waarde, veld) {
    if (waarde === "alle") return true;
    if (waarde === "geen") return !org || !org[veld];
    return !!org && org[veld] === waarde;
  }
  function soortOk(org) {
    return keuzeOk(org, ui.soortFilter, "soort") && keuzeOk(org, ui.sectorFilter, "sector");
  }

  function zichtbareOrganisaties() {
    return organisaties.filter(function (org) {
      return soortOk(org) &&
        relatieZoekFilter([org.naam, org.plaats, org.soort, org.sector, org.adres,
                           org.postcode, org.email, org.notitie].join(" "));
    });
  }

  function zichtbarePersonen() {
    return personen.filter(function (x) {
      var org = organisatieOp(x.organisatie_id);
      return soortOk(org) &&
        relatieZoekFilter([volledigeNaam(x), x.achternaam, x.functie, x.email,
                           org ? org.naam : ""].join(" "));
    });
  }

  // Zelfde opbouw als bij de acties: tabbladen, dan zoeken, Filter en
  // rechts de knoppen; wat er gefilterd wordt staat als label eronder.
  function renderRelatiesHtml() {
    var html = "";
    var mag = magBewerken();
    var isOrg = ui.relatieView !== "personen";

    html += '<div class="subtabs">';
    [["organisaties", "Organisaties", organisaties.length],
     ["personen", "Personen", personen.length]].forEach(function (v) {
      html += '<button class="subtab' + (ui.relatieView === v[0] ? " active" : "") + '" data-action="set-relatie-view" data-relatieview="' + v[0] + '">'
           + v[1] + ' <span class="seg-telling">' + v[2] + '</span></button>';
    });
    html += '</div>';

    var actief = [];
    if (ui.relatieZoek) actief.push({ soort: "zoek", tekst: "Zoeken: \u201c" + ui.relatieZoek + "\u201d" });
    if (ui.soortFilter !== "alle") actief.push({ soort: "soort", tekst: "Soort: " + (ui.soortFilter === "geen" ? "nog geen soort" : ui.soortFilter) });
    if (ui.sectorFilter !== "alle") actief.push({ soort: "sector", tekst: "Sector: " + (ui.sectorFilter === "geen" ? "nog geen sector" : ui.sectorFilter) });
    var aantalFilters = actief.filter(function (f) { return f.soort !== "zoek"; }).length;

    html += '<div class="filter-row">';
    html += '<input type="search" class="txt-input zoek-veld" data-field="relatie-zoek" value="' + escapeHtml(ui.relatieZoek || "") + '" placeholder="Zoeken op naam, plaats, e-mail…" />';
    html += '<button class="filter-btn filter-knop' + (ui.relFilterOpen ? " active" : "") + '" data-action="toggle-relfilter">Filter'
         + (aantalFilters ? '<span class="filter-aantal">' + aantalFilters + '</span>' : '') + '</button>';
    html += '<span class="toolbar-rechts">';
    if (isOrg) {
      var zicht = zichtbareOrganisaties();
      var allesDicht = !zicht.some(function (o) { return !!ui.openOrg[o.id]; });
      if (zicht.length) html += '<button class="filter-btn" data-action="toggle-orgs-alle">' + (allesDicht ? "Alles uitklappen" : "Alles inklappen") + '</button>';
    }
    if (mag && !ui.nieuweOrg) {
      html += '<button class="filter-btn nieuwe-actie-knop" data-action="nieuwe-org">' + plusSvg() + 'Nieuwe organisatie</button>';
    }
    html += '</span>';
    html += '</div>';

    if (ui.relFilterOpen) {
      html += '<div class="filter-paneel">';
      [["soort", ui.soortFilter, soorten, "Soort", "soorten"], ["sector", ui.sectorFilter, sectoren, "Sector", "sectoren"]].forEach(function (f) {
        html += '<label class="veld"><span class="followup-hint">' + f[3] + '</span>';
        html += '<select class="sel-input" data-action="set-keuze-filter" data-keuzeveld="' + f[0] + '">';
        html += '<option value="alle"' + (f[1] === "alle" ? " selected" : "") + '>Alle ' + f[4] + '</option>';
        f[2].forEach(function (x) {
          var n = organisaties.filter(function (o) { return o[f[0]] === x; }).length;
          html += '<option value="' + escapeHtml(x) + '"' + (f[1] === x ? " selected" : "") + '>' + escapeHtml(x) + ' (' + n + ')</option>';
        });
        var zonder = organisaties.filter(function (o) { return !o[f[0]]; }).length;
        html += '<option value="geen"' + (f[1] === "geen" ? " selected" : "") + '>Nog geen ' + f[0] + ' (' + zonder + ')</option>';
        html += '</select></label>';
      });
      if (actief.length) html += '<button class="link-btn" data-action="wis-relfilters">Filters wissen</button>';
      html += '</div>';
    }

    if (actief.length) {
      html += '<div class="filter-chips">';
      actief.forEach(function (f) {
        html += '<span class="filter-chip">' + escapeHtml(f.tekst)
             + '<button data-action="wis-relfilter" data-filtersoort="' + f.soort + '" title="Filter weghalen" aria-label="Filter weghalen">\u00d7</button></span>';
      });
      html += '</div>';
    }

    return html + (ui.relatieView === "personen" ? renderPersonenHtml() : renderOrganisatiesHtml());
  }

  function renderAlleActiesHtml(secties, hoort) {
    var regels = [];
    secties.forEach(function (sec) {
      sec.tasks.filter(hoort).forEach(function (t) { regels.push({ sectie: sec, taak: t }); });
    });
    regels = sorteerRegels(regels);
    if (regels.length === 0) {
      return '<div class="empty-state group-empty-state">Geen acties die aan deze selectie voldoen.</div>';
    }
    return '<section class="section-card acties-kaart"><div class="acties-body">'
         + renderActieTabel(regels, true) + '</div></section>';
  }

  // ── Extra weergaven: dezelfde acties, anders gegroepeerd ─────────
  // Per persoon (wie doet het), per relatie (met welke organisatie) en
  // als agenda (wanneer). Elke groep is een kaart, net als een categorie.
  var AGENDA_GROEPEN = [
    ["verlopen", "Datum verstreken"],
    ["week", "Binnen 7 dagen"],
    ["maand", "Binnen 30 dagen"],
    ["later", "Later"],
    ["geen", "Geen vaste datum"],
    ["af", "Afgerond"]
  ];

  function agendaGroep(t) {
    if (t.done) return "af";
    var d = parseWhenDate(t.when);
    if (!d) return "geen";
    var vandaag = todayISO();
    if (d < vandaag) return "verlopen";
    if (d <= addDaysISO(vandaag, 7)) return "week";
    if (d <= addDaysISO(vandaag, 30)) return "maand";
    return "later";
  }

  function groepVan(t, soort) {
    if (soort === "agenda") {
      var a = agendaGroep(t), rang = 0;
      AGENDA_GROEPEN.forEach(function (g, i) { if (g[0] === a) rang = i; });
      return { sleutel: a, titel: AGENDA_GROEPEN[rang][1], rang: rang, sorteer: "" };
    }
    if (soort === "persoon") {
      var p = t.eigenaarPersoonId ? persoonOp(t.eigenaarPersoonId) : null;
      if (p) {
        var org = organisatieOp(p.organisatie_id);
        var eigen = !!(org && org.eigen);
        return { sleutel: "p:" + p.id, titel: volledigeNaam(p), sub: eigen || !org ? "" : org.naam,
                 kleur: ownerColor(eigenaarNaam(t)), rang: eigen ? 0 : 1,
                 sorteer: (p.achternaam || p.naam || "") + " " + (p.voornaam || "") };
      }
      var ho = t.eigenaarOrgId ? organisatieOp(t.eigenaarOrgId) : null;
      if (ho) return { sleutel: "o:" + ho.id, titel: ho.naam, sub: "hele organisatie",
                       kleur: ownerColor(eigenaarNaam(t)), rang: ho.eigen ? 0.5 : 1.5, sorteer: ho.naam };
      if (t.owner) return { sleutel: "n:" + t.owner, titel: t.owner, kleur: ownerColor(t.owner), rang: 2, sorteer: t.owner };
      return { sleutel: "_geen", titel: "Zonder actiehouder", rang: 3, sorteer: "" };
    }
    // Per organisatie: de organisatie van de actiehouder. De eigen
    // organisatie eerst, dan de rest op naam, losse namen als laatste.
    var oid = wieOrgId(t);
    var o = oid ? organisatieOp(oid) : null;
    if (o) return { sleutel: "o:" + o.id, titel: o.naam, orgId: o.id, rang: o.eigen ? 0 : 1, sorteer: o.naam };
    return { sleutel: "_geen", titel: "Zonder organisatie", rang: 2, sorteer: "" };
  }

  // Keuzelijst voor het filter op wie: personen, organisaties (met al hun
  // mensen) en oude losse namen, alleen als er acties bij horen.
  function wieFilterKeuze() {
    var pers = {}, orgs = {}, namen = {};
    (currentSections || []).forEach(function (sec) {
      sec.tasks.forEach(function (t) {
        if (t.eigenaarPersoonId && persoonOp(t.eigenaarPersoonId)) pers[t.eigenaarPersoonId] = true;
        var oid = wieOrgId(t);
        if (oid && organisatieOp(oid)) orgs[oid] = true;
        if (!t.eigenaarPersoonId && !t.eigenaarOrgId && t.owner) namen[t.owner] = true;
      });
    });
    var gekozen = ui.relatieFilter;
    function optie(waarde, tekst) {
      return '<option value="' + escapeHtml(waarde) + '"' + (waarde === gekozen ? " selected" : "") + '>' + escapeHtml(tekst) + '</option>';
    }
    var html = '<select class="sel-input" data-action="set-wie-filter">';
    html += optie("alle", "Iedereen");
    var pl = Object.keys(pers).map(persoonOp).sort(opAchternaam);
    if (pl.length) {
      html += '<optgroup label="Personen">';
      pl.forEach(function (p) { html += optie("persoon:" + p.id, volledigeNaam(p)); });
      html += '</optgroup>';
    }
    var ol = Object.keys(orgs).map(organisatieOp).sort(function (a, b) {
      if (!!a.eigen !== !!b.eigen) return a.eigen ? -1 : 1;
      return a.naam.localeCompare(b.naam, "nl");
    });
    if (ol.length) {
      html += '<optgroup label="Organisaties, met hun mensen">';
      ol.forEach(function (o) { html += optie(o.id, o.naam); });
      html += '</optgroup>';
    }
    var nl = Object.keys(namen).sort(function (a, b) { return a.localeCompare(b, "nl"); });
    if (nl.length) {
      html += '<optgroup label="Oude namen">';
      nl.forEach(function (n) { html += optie("naam:" + n, n); });
      html += '</optgroup>';
    }
    return html + '</select>';
  }

  // In de agenda altijd op datum; afgeronde acties de laatst afgeronde eerst.
  function agendaVolgorde(regels, sleutel) {
    return regels.slice().sort(function (a, b) {
      if (sleutel === "af") return (b.taak.completedDate || "").localeCompare(a.taak.completedDate || "");
      var da = parseWhenDate(a.taak.when) || "9999", db = parseWhenDate(b.taak.when) || "9999";
      return da < db ? -1 : da > db ? 1 : 0;
    });
  }

  var laatsteGroepen = [];   // sleutels van de groepen die net getekend zijn
  function renderGroepenHtml(secties, hoort, soort) {
    var groepen = {}, lijst = [];
    laatsteGroepen = [];
    secties.forEach(function (sec) {
      sec.tasks.filter(hoort).forEach(function (t) {
        var g = groepVan(t, soort);
        if (!groepen[g.sleutel]) { g.regels = []; groepen[g.sleutel] = g; lijst.push(g); }
        groepen[g.sleutel].regels.push({ sectie: sec, taak: t });
      });
    });
    if (lijst.length === 0) {
      return '<div class="empty-state group-empty-state">Geen acties die aan deze selectie voldoen.</div>';
    }
    lijst.sort(function (a, b) {
      if (a.rang !== b.rang) return a.rang - b.rang;
      return (a.sorteer || "").localeCompare(b.sorteer || "", "nl");
    });

    var html = "";
    lijst.forEach(function (g) {
      var regels = soort === "agenda" ? agendaVolgorde(g.regels, g.sleutel) : sorteerRegels(g.regels);
      var sleutel = soort + "|" + g.sleutel;
      laatsteGroepen.push(sleutel);
      var dicht = !!ui.groepDicht[sleutel];
      var verlopen = regels.filter(function (r) { return !r.taak.done && isVerlopen(r.taak.when); }).length;
      html += '<section class="section-card acties-kaart">';
      html += '<div class="section-header' + (dicht ? "" : " open") + '">';
      html += '<button class="section-header-btn" data-action="toggle-groep" data-groep="' + escapeHtml(sleutel) + '">';
      if (g.kleur) html += '<span class="ak-stip groep-stip" style="background:' + g.kleur + ';"></span>';
      html += '<span class="section-title' + (g.sleutel === "verlopen" ? " groep-verlopen" : "") + '">' + escapeHtml(g.titel) + '</span>';
      if (g.sub) html += '<span class="groep-sub">' + escapeHtml(g.sub) + '</span>';
      html += '<span class="groep-telling">' + regels.length + (regels.length === 1 ? " actie" : " acties");
      if (verlopen && g.sleutel !== "verlopen") html += ' · <span class="groep-verlopen">' + verlopen + ' verlopen</span>';
      html += '</span>';
      html += chevronSvg(dicht);
      html += '</button>';
      if (g.orgId && magRelaties()) {
        html += '<button class="ak-link groep-link" data-action="toon-relatie" data-org="' + escapeHtml(g.orgId) + '" data-persoon="">Naar relatie</button>';
      }
      html += '</div>';
      if (!dicht) html += '<div class="section-body acties-body">' + renderActieTabel(regels, true) + '</div>';
      html += '</section>';
    });
    return html;
  }

  // Dezelfde tabel voor "Alle acties" en voor een uitgeklapte categorie.
  // Binnen een categorie is de kolom Categorie overbodig.
  function renderActieTabel(regels, toonCategorie) {
    var mag = magBewerken();
    var html = '<div class="section-body acties-tabel' + (toonCategorie ? "" : " zonder-categorie") + '">';
    html += '<div class="acties-kop sans">';
    html += '<span></span><span>Actie</span><span>Wie</span><span>Datum</span>';
    if (toonCategorie) html += '<span>Categorie</span>';
    html += '<span>Label</span><span></span>';
    html += '</div>';

    regels.forEach(function (r) {
      var t = r.taak, sec = r.sectie;
      if (ui.editingTask[t.id] || ui.completing[t.id] || ui.editingCompletion[t.id] || ui.reopening[t.id]) {
        html += '<div class="actie-formulier" style="--balk:' + ownerColor(eigenaarNaam(t)) + ';">' + renderTaskRow(sec, t, knownOwners(currentSections)) + '</div>';
        return;
      }
      var labels = taskLabels(t);
      var verlopen = !t.done && isVerlopen(t.when);

      html += '<div class="actie-regel' + (t.done ? " gereed" : "") + '" style="--balk:' + ownerColor(eigenaarNaam(t)) + ';">';
      html += '<span class="ak-vink">';
      html += '<button class="check-btn' + (t.done ? " done" : "") + '" data-action="toggle-complete" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="' + (t.done ? "Weer openzetten" : "Afronden") + '"></button>';
      html += '</span>';
      html += '<span class="ak-titel">' + escapeHtml(t.title);
      if (t.note) html += '<span class="ak-note" title="' + escapeHtml(t.note) + '">' + escapeHtml(t.note) + '</span>';
      if (t.done && t.completedNote) html += '<span class="ak-note" title="' + escapeHtml(t.completedNote) + '">' + escapeHtml(t.completedNote) + '</span>';
      html += '</span>';
      var wie = eigenaarNaam(t), wieOrg = eigenaarToelichting(t);
      html += '<span class="ak-veld"><span class="ak-wie"'
           + (wieOrg ? ' title="' + escapeHtml(wie + " — " + wieOrg) + '"' : '') + '>'
           + '<span class="ak-stip" style="background:' + ownerColor(wie) + ';"></span>'
           + '<span class="ak-wie-naam">' + escapeHtml(wie)
           + (wieOrg ? '<span class="wie-extern">' + escapeHtml(wieOrg) + '</span>' : '') + '</span></span></span>';
      var datumTekst = toonDatum(t) ? formatDateNL(toonDatum(t)) : "";
      html += '<span class="ak-veld' + (verlopen ? " verlopen" : "") + '">' + escapeHtml(datumTekst) + '</span>';
      if (toonCategorie) {
        html += '<span class="ak-veld"><button class="ak-link" data-action="toon-categorie" data-section="' + sec.id + '">' + escapeHtml(sec.title) + '</button></span>';
      }
      html += '<span class="ak-veld">';
      labels.forEach(function (l) {
        html += '<button class="ak-label" data-action="set-action-label-filter-knop" data-label="' + escapeHtml(l) + '" title="' + escapeHtml(l) + '">' + escapeHtml(l) + '</button>';
      });
      html += '</span>';
      html += '<span class="ak-knoppen">';
      if (mag) {
        html += '<button class="edit-btn" data-action="open-edit-task" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="Actie bewerken">' + pencilSvg() + '</button>';
        html += '<button class="delete-btn" data-action="delete-task" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="Actie verwijderen">' + xSvg() + '</button>';
      }
      html += '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // De sortering van de keuzelijst toepassen op de vlakke lijst.
  function sorteerRegels(regels) {
    if (ui.sortMode === "datum") {
      return regels.slice().sort(function (a, b) {
        var da = parseWhenDate(toonDatum(a.taak)), db = parseWhenDate(toonDatum(b.taak));
        if (da && db) return da < db ? -1 : da > db ? 1 : 0;
        if (da && !db) return -1;
        if (!da && db) return 1;
        return 0;
      });
    }
    if (ui.sortMode === "label") {
      return regels.slice().sort(function (a, b) {
        var la = (taskLabels(a.taak)[0] || "\uffff"), lb = (taskLabels(b.taak)[0] || "\uffff");
        return la.localeCompare(lb, "nl");
      });
    }
    return regels;   // standaard: op categorie en daarbinnen op volgorde
  }

  // Welke datum staat er in de kolom? Bij een afgeronde actie de datum
  // waarop hij is afgerond, anders de geplande datum. Sorteren gebruikt
  // dezelfde waarde, anders lijkt de lijst niet gesorteerd.
  function toonDatum(t) {
    return t.done && t.completedDate ? t.completedDate : (t.when || "");
  }

  function isVerlopen(wanneer) {
    var d = parseWhenDate(wanneer);
    return !!d && d < todayISO();
  }

  function renderPersonenHtml() {
    var html = "";
    var mag = magBewerken();
    var lijst = zichtbarePersonen();

    if (personen.length === 0) {
      html += '<div class="empty-state group-empty-state">Nog geen personen. Voeg ze toe bij een organisatie.</div>';
      return html;
    }
    if (lijst.length === 0) {
      html += '<div class="empty-state group-empty-state">Geen personen gevonden voor \u201c' + escapeHtml(ui.relatieZoek) + '\u201d.</div>';
      return html;
    }

    html += '<section class="section-card acties-kaart"><div class="acties-body">';
    html += persoonKop(true);
    lijst.forEach(function (pers) {
      var org = organisatieOp(pers.organisatie_id);
      if (ui.bewerkPersoon[pers.id] && org) {
        html += '<div class="actie-formulier" style="--balk:var(--rel-balk);">' + renderPersoonFormulier(org, pers) + '</div>';
        return;
      }
      html += persoonKaart(pers, org || "geen", mag);
    });
    html += '</div></section>';
    return html;
  }

  // Een contactpersoon als wit kaartje, zoals een actie. Met "metOrg" (de
  // weergave Personen) staat de organisatie er als kolom bij.
  function persoonKop(metOrg) {
    return '<div class="acties-kop persoon-kop' + (metOrg ? " met-org" : "") + ' sans"><span>Naam</span><span>Functie</span>'
         + (metOrg ? '<span>Organisatie</span>' : '') + '<span>E-mail</span><span>Telefoon</span><span>Acties</span><span></span></div>';
  }
  function persoonKaart(pers, org, mag) {
    var eigenActies = actiesBij(null, pers.id).filter(function (x) { return !x.taak.done; }).length;
    var html = '<div class="actie-regel persoon-kaart' + (org ? " met-org" : "") + '" style="--balk:var(--rel-balk);">';
    html += '<span class="ak-titel">' + escapeHtml(volledigeNaam(pers)) + '</span>';
    html += '<span class="ak-veld">' + escapeHtml(pers.functie || "") + '</span>';
    if (org) {
      html += '<span class="ak-veld">' + (org === "geen"
        ? '<span class="pk-leeg">geen organisatie</span>'
        : '<button class="ak-link" data-action="toon-organisatie" data-org="' + org.id + '" title="Naar deze organisatie">' + escapeHtml(org.naam) + '</button>') + '</span>';
    }
    html += '<span class="ak-veld">' + (pers.email
      ? '<a class="contact-link" href="mailto:' + escapeHtml(pers.email) + '" title="' + escapeHtml(pers.email) + '">' + escapeHtml(pers.email) + '</a>' : '') + '</span>';
    html += '<span class="ak-veld">' + (pers.telefoon
      ? '<a class="contact-link" href="tel:' + escapeHtml(pers.telefoon.replace(/\s/g, "")) + '">' + escapeHtml(pers.telefoon) + '</a>' : '') + '</span>';
    html += '<span class="ak-veld">' + (eigenActies
      ? '<button class="ak-label pk-acties" data-action="filter-op-persoon" data-persoon="' + pers.id + '" title="Toon de acties van deze persoon">' + eigenActies + (eigenActies === 1 ? " actie" : " acties") + '</button>' : '') + '</span>';
    html += '<span class="ak-knoppen">';
    if (mag) {
      html += '<button class="edit-btn" data-action="bewerk-persoon" data-persoon="' + pers.id + '" aria-label="Persoon bewerken">' + pencilSvg() + '</button>';
      html += '<button class="delete-btn" data-action="verwijder-persoon" data-persoon="' + pers.id + '" aria-label="Persoon verwijderen">' + xSvg() + '</button>';
    }
    html += '</span>';
    html += '</div>';
    return html;
  }

  // ── Instellingen (het tandwieltje) ────────────────────────────────
  // Basis, voor iedereen: licht of donker. Beheer, alleen voor de rol
  // beheerder: soorten en sectoren van organisaties, en de labels van
  // acties.
  function huidigThema() {
    try { return localStorage.getItem("mec-thema") || ""; } catch (e) { return ""; }
  }
  function zetThema(t) {
    try { if (t) localStorage.setItem("mec-thema", t); else localStorage.removeItem("mec-thema"); } catch (e) {}
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }

  var INSTEL_KAARTEN = ["gebruikers", "categorieen", "soort", "sector", "labels"];
  function instelOpen(sleutel) { return !!ui.instelOpen[sleutel]; }
  function instelKop(sleutel, titel, meta, telling) {
    var open = instelOpen(sleutel);
    return '<div class="section-header' + (open ? " open" : "") + '">'
      + '<button class="section-header-btn" data-action="toggle-instel" data-instel="' + sleutel + '">'
      + '<span class="section-title">' + escapeHtml(titel) + '</span>'
      + (meta ? '<span class="relatie-meta sans">' + escapeHtml(meta) + '</span>' : '')
      + (telling ? '<span class="groep-telling">' + escapeHtml(telling) + '</span>' : '<span class="groep-telling"></span>')
      + chevronSvg(!open) + '</button></div>';
  }

  function renderInstellingenHtml() {
    var html = '<div class="instellingen">';
    html += '<div class="instel-kop"><h2 class="instel-titel">Instellingen</h2>';
    html += '<span class="relatie-meta sans">Ingelogd als ' + escapeHtml(sessie.user.email) + ' \u00b7 ' + escapeHtml(mijnRol || "") + '</span>';
    html += '<button class="link-btn" data-action="sluit-instellingen">Terug</button></div>';

    // Basis
    var t = huidigThema();
    html += '<section class="section-card acties-kaart">' + instelKop("weergave", "Weergave", "voor iedereen", "");
    if (instelOpen("weergave")) {
      html += '<div class="section-body acties-body"><div class="instel-regel">';
      html += '<div><div class="instel-naam">Licht of donker</div><div class="followup-hint">Automatisch volgt de instelling van je computer of telefoon. Je keuze geldt op dit apparaat.</div></div>';
      html += '<span class="seg">';
      [["", "Automatisch"], ["light", "Licht"], ["dark", "Donker"]].forEach(function (o) {
        html += '<button class="filter-btn' + (t === o[0] ? " active" : "") + '" data-action="zet-thema" data-thema="' + o[0] + '">' + o[1] + '</button>';
      });
      html += '</span></div></div>';
    }
    html += '</section>';

    // Beheer
    if (mijnRol === "beheerder") {
      var allesOpen = INSTEL_KAARTEN.every(instelOpen);
      html += '<h3 class="instel-sub">Beheer <span class="relatie-meta sans">alleen voor de beheerder</span>'
           + '<button class="filter-btn instel-alles" data-action="toggle-instel-alle">' + (allesOpen ? "Alles inklappen" : "Alles uitklappen") + '</button></h3>';
      html += renderGebruikersBeheer();
      html += renderCategorieBeheer();
      html += '<div class="relaties-thema">' + renderKeuzelijstBeheer() + '</div>';
      html += renderLabelBeheer();
    }
    html += '</div>';
    return html;
  }

  // ── Categorieen: naam, volgorde en groepen (alleen beheerder) ─────
  function alleGroepen() {
    var set = {};
    (currentSections || []).forEach(function (s) { sectionLabels(s).forEach(function (l) { set[l] = true; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "nl"); });
  }

  function categorieFormulier(sec) {
    var nieuw = !sec;
    var huidige = sec ? sectionLabels(sec) : [];
    var suggesties = alleGroepen().filter(function (l) { return huidige.indexOf(l) === -1; });
    var html = '<div class="actie-formulier" style="--balk:var(--accent);"><div class="add-form' + (nieuw ? ' add-section-card' : '') + '" data-form="' + (nieuw ? "add-section" : "edit-section") + '"' + (nieuw ? '' : ' data-section="' + sec.id + '"') + '>';
    html += '<div class="form-row">';
    if (!nieuw) html += '<label class="veld smal"><span class="followup-hint">Volgnummer</span><input type="number" class="txt-input" data-field="section-nr" min="1" max="' + currentSections.length + '" value="' + (sec.nr || 1) + '" /></label>';
    html += '<label class="veld breed"><span class="followup-hint">Naam</span><input type="text" class="txt-input" data-field="section-title" value="' + escapeHtml(sec ? sec.title : "") + '" data-autofocus="1" /></label>';
    html += '</div>';
    html += '<div class="form-row single"><span class="followup-hint">Groepen</span>';
    html += '<input type="text" class="txt-input" data-field="section-labels" value="' + escapeHtml(huidige.join(", ")) + '" placeholder="Bijv. Bestuur, Projectgroep \u2014 meerdere mag, gescheiden door komma\'s" />';
    if (suggesties.length) {
      html += '<div class="label-suggests">';
      suggesties.forEach(function (l) {
        html += '<button type="button" class="label-suggest" data-action="add-label-suggestion" data-label="' + escapeHtml(l) + '" style="color:' + labelColor(l) + ';">+ ' + escapeHtml(l) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="followup-hint">De groepen bepalen wie de categorie ziet: een gebruiker die alleen bepaalde groepen mag zien, ziet alleen categorie\u00ebn met een van die groepen.</div>';
    html += '<div class="form-actions">';
    if (nieuw) {
      html += '<button class="save-btn" data-action="submit-add-section">Toevoegen</button>';
      html += '<button class="cancel-btn" data-action="cancel-add-section">Annuleren</button>';
    } else {
      html += '<button class="save-btn" data-action="submit-edit-section" data-section="' + sec.id + '">Opslaan</button>';
      html += '<button class="cancel-btn" data-action="cancel-edit-section" data-section="' + sec.id + '">Annuleren</button>';
    }
    html += '</div></div></div>';
    return html;
  }

  function renderCategorieBeheer() {
    var lijst = (currentSections || []).slice().sort(function (a, b) { return (a.nr || 0) - (b.nr || 0); });
    var html = '<section class="section-card acties-kaart">';
    html += instelKop("categorieen", "Categorie\u00ebn", "naam, volgorde en groepen", lijst.length + (lijst.length === 1 ? " categorie" : " categorie\u00ebn"));
    if (!instelOpen("categorieen")) return html + '</section>';
    html += '<div class="section-body acties-body">';
    if (lijst.length) html += '<div class="acties-kop cat-kop sans"><span>Nr</span><span>Naam</span><span>Groepen</span><span>Acties</span><span></span></div>';
    lijst.forEach(function (sec) {
      if (ui.editingSection[sec.id]) { html += categorieFormulier(sec); return; }
      var n = sec.tasks.length;
      html += '<div class="actie-regel cat-regel" style="--balk:var(--accent);">';
      html += '<span class="ak-veld cat-nr">' + String(sec.nr || 0).padStart(2, "0") + '</span>';
      html += '<span class="ak-titel">' + escapeHtml(sec.title) + '</span>';
      html += '<span class="ak-veld">' + escapeHtml(sectionLabels(sec).join(", ") || "\u2014 geen groep \u2014") + '</span>';
      html += '<span class="ak-veld">' + n + (n === 1 ? " actie" : " acties") + '</span>';
      html += '<span class="ak-knoppen">';
      html += '<button class="edit-btn" data-action="open-edit-section" data-section="' + sec.id + '" aria-label="Categorie bewerken" title="Naam, volgnummer of groepen wijzigen">' + pencilSvg() + '</button>';
      if (n === 0) html += '<button class="delete-btn" data-action="delete-section" data-section="' + sec.id + '" aria-label="Lege categorie verwijderen" title="Verwijderen">' + xSvg() + '</button>';
      html += '</span></div>';
    });
    if (ui.addingSection) html += categorieFormulier(null);
    else html += '<button class="add-task-btn" data-action="open-add-section">' + plusSvg() + 'Categorie toevoegen</button>';
    html += '</div></section>';
    return html;
  }

  // ── Gebruikers: wie mag inloggen, met welke rol ─────────────────
  var ROLLEN = [["kijker", "Kijker", "kan lezen, niets wijzigen"],
                ["bewerker", "Bewerker", "kan lezen en wijzigen"],
                ["beheerder", "Beheerder", "ziet alles en beheert gebruikers, categorie\u00ebn, soorten, sectoren en labels"]];
  function isIkZelf(email) { return (email || "").toLowerCase() === (sessie.user.email || "").toLowerCase(); }

  function renderLidFormulier(lid) {
    var nieuw = !lid;
    var zelf = !nieuw && isIkZelf(lid.email);
    var html = '<div class="actie-formulier" style="--balk:var(--accent);"><div class="add-form" data-form="lid">';
    html += '<div class="form-row">';
    html += '<label class="veld"><span class="followup-hint">Naam</span><input type="text" class="txt-input" data-field="lid-naam" value="' + escapeHtml(lid ? (lid.naam || "") : "") + '"' + (nieuw ? ' data-autofocus="1"' : '') + ' /></label>';
    html += '<label class="veld breed"><span class="followup-hint">E-mailadres</span><input type="email" class="txt-input" data-field="lid-email" value="' + escapeHtml(lid ? lid.email : "") + '"' + (nieuw ? '' : ' readonly') + ' /></label>';
    html += '<label class="veld"><span class="followup-hint">Rol</span><select class="sel-input" data-field="lid-rol"' + (zelf ? ' disabled' : '') + '>';
    ROLLEN.forEach(function (r) {
      var gekozen = lid ? lid.rol === r[0] : r[0] === "bewerker";
      html += '<option value="' + r[0] + '"' + (gekozen ? " selected" : "") + '>' + r[1] + '</option>';
    });
    html += '</select></label>';
    html += '</div>';
    html += '<div class="followup-hint rol-uitleg">' + ROLLEN.map(function (r) { return '<b>' + r[1] + '</b> ' + r[2]; }).join(' \u00b7 ') + '</div>';
    html += rechtenBlok(lid);
    if (zelf) html += '<div class="followup-hint">Je eigen rol kun je hier niet wijzigen, zodat je jezelf niet per ongeluk buitensluit.</div>';
    if (nieuw) html += '<div class="followup-hint">Daarna kan deze persoon op het inlogscherm een link per e-mail aanvragen. Een wachtwoord is niet nodig.</div>';
    else html += '<div class="followup-hint">Het e-mailadres is de sleutel en kun je niet wijzigen. Klopt het niet, verwijder de gebruiker dan en voeg hem opnieuw toe.</div>';
    if (ui.lidFout) html += '<div class="lid-fout">' + escapeHtml(ui.lidFout) + '</div>';
    html += '<div class="form-actions"><button class="save-btn" data-action="bewaar-lid" data-lid="' + escapeHtml(lid ? lid.email : "nieuw") + '">' + (nieuw ? "Toevoegen" : "Opslaan") + '</button>';
    html += '<button class="cancel-btn" data-action="annuleer-lid">Annuleren</button></div>';
    html += '</div></div>';
    return html;
  }

  // Wat mag deze gebruiker zien: acties (eventueel alleen bepaalde
  // groepen), besluiten en relaties. Een beheerder ziet altijd alles.
  function rechtenBlok(lid) {
    if (!heeftRechten) {
      return '<div class="followup-hint">Rechten per gebruiker (acties, besluiten, relaties) kun je instellen nadat 21-rechten-per-gebruiker.sql is gedraaid.</div>';
    }
    var beh = lid ? lid.rol === "beheerder" : false;
    var r = {
      acties: !lid || lid.toegang_acties !== false,
      groepen: (lid && lid.acties_groepen) || [],
      besluiten: !lid || lid.toegang_besluiten !== false,
      relaties: !lid || lid.toegang_relaties !== false
    };
    var groepen = alleGroepen();
    var uit = beh ? ' disabled' : '';
    function vink(veld, aan, tekst, extra) {
      return '<label class="rechten-vink"><input type="checkbox" data-field="' + veld + '"' + (aan || beh ? " checked" : "") + uit + (extra || "") + ' /> ' + tekst + '</label>';
    }
    var html = '<div class="rechten" data-rechten="1">';
    html += '<div class="followup-hint rechten-kop">Toegang</div>';
    html += '<div class="rechten-regel">' + vink("lid-acties", r.acties, "<b>Acties</b>");
    if (groepen.length) {
      html += '<span class="rechten-groepen">';
      groepen.forEach(function (g) {
        var aan = r.groepen.length === 0 || r.groepen.indexOf(g) !== -1;
        html += '<label class="rechten-vink"><input type="checkbox" data-field="lid-groep" value="' + escapeHtml(g) + '"' + (aan || beh ? " checked" : "") + (beh || !r.acties ? " disabled" : "") + ' /> ' + escapeHtml(g) + '</label>';
      });
      html += '</span>';
    }
    html += '</div>';
    html += '<div class="rechten-regel">' + vink("lid-besluiten", r.besluiten, "<b>Besluiten</b>") + '</div>';
    html += '<div class="rechten-regel">' + vink("lid-relaties", r.relaties, "<b>Relaties</b>")
         + '<span class="followup-hint">zonder relaties ziet iemand bij acties alleen de namen, geen adres, e-mail of telefoon</span></div>';
    html += '<div class="followup-hint rechten-uitleg">' + (beh ? "Een beheerder ziet altijd alles."
         : "Staan alle groepen aan, dan ziet deze gebruiker ook groepen die er later bij komen.") + '</div>';
    html += '</div>';
    return html;
  }

  function rechtenSamenvatting(l) {
    if (l.rol === "beheerder" || !heeftRechten) return "Alles";
    var delen = [];
    if (l.toegang_acties !== false) delen.push("Acties" + ((l.acties_groepen || []).length ? " (" + l.acties_groepen.join(", ") + ")" : ""));
    if (l.toegang_besluiten !== false) delen.push("Besluiten");
    if (l.toegang_relaties !== false) delen.push("Relaties");
    return delen.length ? delen.join(" \u00b7 ") : "Niets";
  }

  function renderGebruikersBeheer() {
    var lijst = leden.slice().sort(function (a, b) {
      return (a.naam || a.email).localeCompare(b.naam || b.email, "nl");
    });
    var html = '<section class="section-card acties-kaart">';
    html += instelKop("gebruikers", "Gebruikers", "wie mag inloggen, en wat mag die", lijst.length + (lijst.length === 1 ? " gebruiker" : " gebruikers"));
    if (!instelOpen("gebruikers")) return html + '</section>';
    html += '<div class="section-body acties-body">';
    if (ui.lidFout && ui.bewerkLid === null) html += '<div class="lid-fout">' + escapeHtml(ui.lidFout) + '</div>';
    html += '<div class="acties-kop lid-kop sans"><span>Naam</span><span>E-mail</span><span>Rol</span><span>Toegang</span><span></span></div>';
    lijst.forEach(function (l) {
      if (ui.bewerkLid === l.email) { html += renderLidFormulier(l); return; }
      var zelf = isIkZelf(l.email);
      html += '<div class="actie-regel lid-regel" style="--balk:' + (l.rol === "beheerder" ? "var(--accent)" : l.rol === "bewerker" ? "var(--rel-balk, #75C3EA)" : "var(--line)") + ';">';
      html += '<span class="ak-titel">' + escapeHtml(l.naam || "\u2014") + (zelf ? ' <span class="relatie-meta sans">(jij)</span>' : '') + '</span>';
      html += '<span class="ak-veld" title="' + escapeHtml(l.email) + '">' + escapeHtml(l.email) + '</span>';
      html += '<span class="ak-veld">' + escapeHtml((ROLLEN.filter(function (r) { return r[0] === l.rol; })[0] || [0, l.rol])[1]) + '</span>';
      var sam = rechtenSamenvatting(l);
      html += '<span class="ak-veld" title="' + escapeHtml(sam) + '">' + escapeHtml(sam) + '</span>';
      html += '<span class="ak-knoppen">';
      html += '<button class="edit-btn" data-action="bewerk-lid" data-lid="' + escapeHtml(l.email) + '" aria-label="Gebruiker bewerken" title="Naam of rol wijzigen">' + pencilSvg() + '</button>';
      if (!zelf) html += '<button class="delete-btn" data-action="verwijder-lid" data-lid="' + escapeHtml(l.email) + '" aria-label="Gebruiker verwijderen" title="Toegang intrekken">' + xSvg() + '</button>';
      html += '</span></div>';
    });
    if (ui.bewerkLid === "nieuw") html += renderLidFormulier(null);
    else html += '<button class="add-task-btn" data-action="nieuw-lid">' + plusSvg() + 'Gebruiker toevoegen</button>';
    html += '</div></section>';
    return html;
  }

  function bewaarLid(rij, nieuw) {
    ui.lidFout = "";
    syncing = true; render();
    var wijz = { naam: rij.naam, rol: rij.rol };
    if (heeftRechten) ["toegang_acties", "acties_groepen", "toegang_besluiten", "toegang_relaties"].forEach(function (k) {
      if (k in rij) wijz[k] = rij[k];
    });
    var q = nieuw ? sb.from("leden").insert(rij)
                  : sb.from("leden").update(wijz).eq("email", rij.email);
    controleer(q).then(function () {
      if (nieuw) leden.push(rij);
      else {
        var l = leden.filter(function (x) { return x.email === rij.email; })[0];
        if (l) Object.keys(wijz).forEach(function (k) { l[k] = wijz[k]; });
      }
      ui.bewerkLid = null;
    }).catch(function (e) {
      var m = (e && e.message) || "";
      ui.lidFout = (e && e.code === "23505") || /duplicate/i.test(m) ? "Dit e-mailadres staat al in de lijst."
                 : /row-level|violates/i.test(m) ? "Dat mag niet: er moet minstens \u00e9\u00e9n beheerder overblijven."
                 : "Opslaan lukte niet. Probeer het nog eens.";
    }).then(function () { syncing = false; render(); });
  }

  function verwijderLid(email) {
    ui.lidFout = "";
    syncing = true; render();
    controleer(sb.from("leden").delete().eq("email", email)).then(function () {
      leden = leden.filter(function (x) { return x.email !== email; });
    }).catch(function () {
      ui.lidFout = "Verwijderen lukte niet. Probeer het nog eens.";
    }).then(function () { syncing = false; render(); });
  }

  // Alle labels die bij acties in gebruik zijn, met hoe vaak. Hernoemen
  // past alle acties aan; hernoem je naar een label dat al bestaat, dan
  // worden ze samengevoegd. Verwijderen haalt het label bij alle acties weg.
  function labelsMetAantal() {
    var tel = {};
    (currentSections || []).forEach(function (sec) {
      sec.tasks.forEach(function (t) { taskLabels(t).forEach(function (l) { tel[l] = (tel[l] || 0) + 1; }); });
    });
    return Object.keys(tel).sort(function (a, b) { return a.localeCompare(b, "nl"); })
                 .map(function (l) { return { naam: l, aantal: tel[l] }; });
  }

  function renderLabelBeheer() {
    var lijst = labelsMetAantal();
    var html = '<section class="section-card acties-kaart">';
    html += instelKop("labels", "Labels bij acties", "een label ontstaat door het bij een actie in te vullen", lijst.length + (lijst.length === 1 ? " label" : " labels"));
    if (!instelOpen("labels")) return html + '</section>';
    html += '<div class="section-body acties-body">';
    if (!lijst.length) html += '<div class="empty-state">Er zijn nog geen labels in gebruik.</div>';
    else html += '<div class="acties-kop label-kop sans"><span>Label</span><span>Acties</span><span></span></div>';
    lijst.forEach(function (l) {
      if (ui.bewerkLabel === l.naam) {
        html += '<div class="actie-formulier" style="--balk:' + labelColor(l.naam) + ';"><div class="add-form" data-form="label">';
        html += '<div class="form-row"><label class="veld"><span class="followup-hint">Nieuwe naam</span>';
        html += '<input type="text" class="txt-input" data-field="label-naam" value="' + escapeHtml(l.naam) + '" data-autofocus="1" /></label></div>';
        html += '<div class="followup-hint">Wordt aangepast bij ' + l.aantal + (l.aantal === 1 ? " actie" : " acties") + '. Kies je een naam die al bestaat, dan worden de twee labels samengevoegd.</div>';
        html += '<div class="form-actions"><button class="save-btn" data-action="bewaar-label" data-label="' + escapeHtml(l.naam) + '">Opslaan</button>';
        html += '<button class="cancel-btn" data-action="annuleer-label">Annuleren</button></div>';
        html += '</div></div>';
        return;
      }
      html += '<div class="actie-regel label-regel" style="--balk:' + labelColor(l.naam) + ';">';
      html += '<span class="ak-titel">' + escapeHtml(l.naam) + '</span>';
      html += '<span class="ak-veld">' + l.aantal + (l.aantal === 1 ? " actie" : " acties") + '</span>';
      html += '<span class="ak-knoppen">';
      html += '<button class="edit-btn" data-action="bewerk-label" data-label="' + escapeHtml(l.naam) + '" aria-label="Label hernoemen" title="Hernoemen">' + pencilSvg() + '</button>';
      html += '<button class="delete-btn" data-action="verwijder-label" data-label="' + escapeHtml(l.naam) + '" aria-label="Label verwijderen" title="Bij alle acties weghalen">' + xSvg() + '</button>';
      html += '</span></div>';
    });
    html += '</div></section>';
    return html;
  }

  function wijzigLabel(oud, nieuw) {
    var next = cloneSections();
    next.forEach(function (sec) {
      sec.tasks.forEach(function (t) {
        var l = taskLabels(t);
        if (l.indexOf(oud) === -1) return;
        var uit = [];
        l.forEach(function (x) {
          var y = x === oud ? nieuw : x;
          if (y && uit.indexOf(y) === -1) uit.push(y);
        });
        t.labels = uit;
      });
    });
    if (ui.actionLabelFilter === oud) ui.actionLabelFilter = nieuw || "alle";
    persist(next);
  }

  function renderKeuzelijstBeheer() {
    var html = "";
    KEUZELIJSTEN.forEach(function (k) {
      var lijst = k.lees();
      html += '<section class="section-card acties-kaart soorten-kaart">';
      html += instelKop(k.veld, k.kop, k.omschrijving, lijst.length + (lijst.length === 1 ? " waarde" : " waarden"));
      if (!instelOpen(k.veld)) { html += '</section>'; return; }
      html += '<div class="section-body acties-body">';

      if (lijst.length === 0) html += '<div class="empty-state">Nog niets in deze lijst.</div>';
      else html += '<div class="acties-kop label-kop sans"><span>Naam</span><span>Organisaties</span><span></span></div>';

      lijst.forEach(function (x) {
        var sleutel = k.veld + "|" + x;
        var aantal = organisaties.filter(function (o) { return o[k.veld] === x; }).length;
        if (ui.bewerkSoort[sleutel]) {
          html += '<div class="actie-formulier" style="--balk:var(--rel-balk);"><div class="add-form" data-form="soort" data-soort="' + escapeHtml(sleutel) + '">';
          html += '<div class="form-row"><label class="veld"><span class="followup-hint">Nieuwe naam</span>';
          html += '<input type="text" class="txt-input" data-field="soort-naam" value="' + escapeHtml(x) + '" data-autofocus="1" /></label></div>';
          if (aantal) html += '<div class="followup-hint">Hernoemen past ' + aantal + ' ' + (aantal === 1 ? 'organisatie' : 'organisaties') + ' mee aan.</div>';
          html += '<div class="form-actions"><button class="save-btn" data-action="bewaar-soort" data-soort="' + escapeHtml(sleutel) + '">Opslaan</button>';
          html += '<button class="cancel-btn" data-action="annuleer-soort" data-soort="' + escapeHtml(sleutel) + '">Annuleren</button></div>';
          html += '</div></div>';
          return;
        }
        html += '<div class="actie-regel label-regel" style="--balk:var(--rel-balk);">';
        html += '<span class="ak-titel">' + escapeHtml(x) + '</span>';
