<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobiel Erfgoed Console — Stichting Mobiele Collectie Nederland</title>
<style>
  :root {
    --ink: #1E2624;
    --ink-soft: #5C6B66;
    --ink-faint: #90A19B;
    --paper: #F3F7F6;
    --card: #FFFFFF;
    --line: #DCE6E3;
    --line-soft: #EDF3F1;
    --header-bg: #EBF3F1;
    --accent: #1D9C8C;
    --accent-soft: #DFF3EF;
    --accent-ink: #0C6358;
    --danger: #C4638E;
    --danger-soft: #FBECF2;
    --mcn-teal: #4DAE97;
    --mcn-pink: #C46FA0;
    --mcn-blue: #4FA3D6;
    --mcn-grey: #646C79;
    --shadow: 0 1px 2px rgba(24,33,30,.05), 0 14px 28px -20px rgba(24,33,30,.25);
    --r-lg: 16px;
    --r-md: 10px;
    --r-sm: 7px;
    --r-pill: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EAF2F1;
      --ink-soft: #9FB0AE;
      --ink-faint: #6E7D79;
      --paper: #14201F;
      --card: #1C2827;
      --line: #2C3B39;
      --line-soft: #23312E;
      --header-bg: #223130;
      --accent: #4FC9B4;
      --accent-soft: #1E3A34;
      --accent-ink: #8FE0CE;
      --danger: #E28FB0;
      --danger-soft: #3A2430;
      --mcn-teal: #4DAE97;
      --mcn-pink: #D890BA;
      --mcn-blue: #6FBCE8;
      --mcn-grey: #97A0AB;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 28px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ink: #EAF2F1;
    --ink-soft: #9FB0AE;
    --ink-faint: #6E7D79;
    --paper: #14201F;
    --card: #1C2827;
    --line: #2C3B39;
    --line-soft: #23312E;
    --header-bg: #223130;
    --accent: #4FC9B4;
    --accent-soft: #1E3A34;
    --accent-ink: #8FE0CE;
    --danger: #E28FB0;
    --danger-soft: #3A2430;
    --mcn-teal: #4DAE97;
    --mcn-pink: #D890BA;
    --mcn-blue: #6FBCE8;
    --mcn-grey: #97A0AB;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 28px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 44px 20px 88px;
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .heading-font { font-family: "Baloo 2", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* Breder dan voorheen (720px), zodat de relatielijst en de acties meer
     kwijt kunnen. Boven de 1180px wordt een tekstregel te lang om
     prettig te lezen, dus daar stopt het. */
  .container { max-width: 1180px; margin: 0 auto; }
  /* De toelichting bij een actie blijft wel op leesbare breedte. */
  .task-meta .note { max-width: 78ch; }

  .masthead-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 4px;
  }
  .logo-img {
    width: 78px;
    height: 52px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .kicker {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  h1 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 32px;
    margin: 0 0 24px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .totals {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .totals-number { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .totals-track { flex: 1; height: 6px; background: var(--line-soft); border-radius: var(--r-pill); overflow: hidden; }
  .totals-fill { height: 100%; background: linear-gradient(90deg, var(--mcn-teal), var(--accent)); border-radius: var(--r-pill); transition: width 0.3s ease; }
  .sync-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Wie alleen mag meekijken, krijgt de wijzigknoppen niet te zien. */
  .alleen-lezen .edit-btn,
  .alleen-lezen .delete-btn,
  .alleen-lezen .add-task-btn,
  .alleen-lezen .add-section-btn,
  .alleen-lezen .check-btn { display: none !important; }
  .alleen-lezen .task-row { padding-left: 2px; }
  .meekijk-melding {
    font-size: 12.5px; color: var(--ink-soft); background: var(--line-soft);
    border-radius: var(--r-sm); padding: 8px 12px; margin: 0 0 16px;
  }

  .seg-telling { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; opacity: 0.7; margin-left: 3px; }
  .soorten-kaart { border-color: var(--accent); }
  .soort-row { padding: 9px 0; }
  .vink-regel { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--ink-soft); padding: 2px 0 4px; cursor: pointer; }
  .vink-regel input { margin-top: 2px; accent-color: var(--accent); }
  .vink-regel .followup-hint { display: block; margin: 1px 0 0; }
  .eigen-merk {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: var(--r-pill);
  }

  .eigenaar-houder { display: flex; min-width: 0; }
  .eigenaar-houder > * { flex: 1; min-width: 0; }
  .extern-kiezer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
  .extern-kiezer select { flex: 1 1 140px; min-width: 0; }
  .wie-extern { display: block; font-size: 9.5px; font-weight: 600; opacity: 0.75; margin-top: -1px; }

  .soort-holder { display: flex; }
  .soort-holder > * { flex: 1; min-width: 0; }
  .zoek-veld { font-size: 12.5px; padding: 5px 10px; min-width: 200px; }
  .pc-field { flex: 0 0 96px; }
  .tv-field { flex: 0 0 104px; }
  .geslacht-veld { flex: 0 0 150px; }
  .org-adres { white-space: pre-line; }

  .relatie-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--accent-ink); background: var(--accent-soft);
    border: none; border-radius: var(--r-pill); padding: 3px 9px 3px 7px;
    cursor: pointer; align-self: flex-start;
  }
  .relatie-chip svg { width: 11px; height: 11px; flex-shrink: 0; }
  .relatie-chip:hover { filter: brightness(0.96); }
  .relatie-meta { font-size: 12px; color: var(--ink-faint); flex: 1; min-width: 60px; }
  .persoon-row .task-title { font-size: 14px; }

  /* Alle acties als kolommen: vinkje, actie, wie, datum, categorie,
     label, relatie. Onder 980px klapt het terug naar onder elkaar. */
  .acties-tabel { padding: 6px 18px 12px; }
  .acties-kop, .actie-regel {
    display: grid;
    grid-template-columns: 22px minmax(180px, 2.2fr) minmax(0, 88px) minmax(0, 118px) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 12px;
  }
  .acties-kop {
    font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-faint); padding: 6px 0 8px; border-bottom: 1px solid var(--line);
  }
  /* Elke actie een eigen kaartje op een rustige ondergrond, met links een
     smal streepje in de kleur van wie het doet. Dat scheidt de regels en
     laat meteen zien van wie een actie is. */
  .acties-tabel { padding: 12px; }
  .section-card .acties-tabel { background: var(--paper); }
  .acties-kop { padding: 4px 13px 10px; border-bottom: none; }
  .actie-regel {
    font-size: 13px;
    padding: 11px 13px 11px 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--balk, var(--line));
    border-radius: var(--r-md);
    margin-bottom: 7px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .actie-regel:last-child { margin-bottom: 0; }
  .actie-regel:hover { box-shadow: var(--shadow); }
  /* Een afgeronde actie houdt hetzelfde kaartje en hetzelfde kleurbalkje;
     dat hij klaar is blijkt uit het gevulde bolletje en de doorgestreepte
     titel. Een doorzichtige achtergrond maakte er een gat van, en zette
     tegelijk het kleurbalkje uit. */
  .actie-regel.gereed .ak-veld { color: var(--ink-faint); }
  .acties-tabel.zonder-categorie {
    grid-template-columns: 22px minmax(180px, 2.2fr) minmax(0, 88px) minmax(0, 118px) minmax(0, 1fr) minmax(0, 1fr) auto;
  }
  .acties-tabel.zonder-categorie .acties-kop,
  .acties-tabel.zonder-categorie .actie-regel {
    grid-template-columns: 22px minmax(180px, 2.2fr) minmax(0, 88px) minmax(0, 118px) minmax(0, 1fr) minmax(0, 1fr) auto;
  }
  .ak-note {
    display: block; font-size: 11.5px; font-weight: 400; color: var(--ink-faint);
    margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ak-titel { font-weight: 600; color: var(--ink); min-width: 0; }
  .actie-regel.gereed .ak-titel { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }
  .ak-veld { color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .ak-veld.verlopen { color: var(--danger); font-weight: 600; }
  .ak-vink { display: flex; align-items: center; }
  .ak-knoppen { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  .ak-link {
    font-family: inherit; font-size: 12px; color: var(--ink-soft); background: none;
    border: none; padding: 0; cursor: pointer; text-align: left; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ak-link:hover { color: var(--accent); text-decoration: underline; }
  .actie-formulier { border-top: 1px solid var(--line-soft); padding: 2px 0; }

  @media (max-width: 980px) {
    .acties-kop { display: none; }
    .actie-regel { grid-template-columns: 22px 1fr auto; row-gap: 3px; padding: 12px 0; align-items: start; }
    .actie-regel .ak-vink { grid-row: 1; grid-column: 1; }
    .actie-regel .ak-titel { grid-row: 1; grid-column: 2; }
    .actie-regel .ak-knoppen { grid-row: 1; grid-column: 3; }
    .actie-regel .ak-veld { grid-column: 2; white-space: normal; }
    .actie-regel .ak-veld:empty { display: none; }
  }

  /* De personenlijst als kolommen: naam, functie, organisatie, e-mail,
     telefoon. Op een smal scherm klapt het terug naar onder elkaar. */
  .personen-tabel { padding: 6px 18px 12px; }
  .personen-kop, .persoon-regel {
    display: grid;
    grid-template-columns: minmax(130px, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.5fr) minmax(0, 118px) auto;
    align-items: center;
    column-gap: 14px;
  }
  .personen-kop {
    font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-faint); padding: 6px 0 8px; border-bottom: 1px solid var(--line);
  }
  .persoon-regel { padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .persoon-regel:hover { background: var(--line-soft); }
  .pk-naam { font-weight: 700; color: var(--ink); }
  .pk-veld { color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-veld .relatie-chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; white-space: nowrap; }
  .pk-leeg { color: var(--ink-faint); font-style: italic; }
  .pk-knoppen { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  .persoon-formulier { padding: 4px 0; border-top: 1px solid var(--line-soft); }

  @media (max-width: 820px) {
    .personen-kop { display: none; }
    .persoon-regel { grid-template-columns: 1fr auto; row-gap: 2px; padding: 12px 0; }
    .persoon-regel .pk-naam { grid-column: 1; }
    .persoon-regel .pk-knoppen { grid-row: 1 / span 5; grid-column: 2; align-items: flex-start; }
    .persoon-regel .pk-veld { grid-column: 1; white-space: normal; }
    .persoon-regel .pk-veld:empty { display: none; }
  }
  /* Bij een contactpersoon staan de gegevens achter elkaar in plaats van
     onder elkaar; bij een actie blijft het onder elkaar staan. */
  .persoon-row .task-meta {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    column-gap: 18px;
    row-gap: 4px;
  }
  .persoon-row .task-title-row { gap: 12px; }
  .persoon-functie { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .contact-link { color: var(--ink-soft); text-decoration: none; }
  .contact-link:hover { color: var(--accent); text-decoration: underline; }
  .org-details { padding: 10px 0 4px; border-bottom: 1px solid var(--line-soft); }
  .org-website { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .org-website:hover { text-decoration: underline; }

  .poort {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: 28px 26px; max-width: 460px; margin: 8px auto 0;
  }
  .poort-kop { font-size: 20px; font-weight: 700; margin: 0 0 10px; color: var(--ink); }
  .poort-tekst { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 18px; }
  .poort-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .poort-form .txt-input { flex: 1 1 200px; }
  .poort-status { font-size: 13px; color: var(--accent-ink); background: var(--accent-soft);
    padding: 10px 12px; border-radius: var(--r-sm); margin: 16px 0 0; line-height: 1.5; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filter-row + .filter-row { margin-bottom: 22px; }
  .collapse-toggle-btn { margin-left: auto; }
  .filter-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 5px 11px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--card); }

  /* Te doen / Afgerond / Alle als één aaneengesloten knoppenrij */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--card); }
  .seg .filter-btn { border: none; border-radius: 0; padding: 5px 12px; background: transparent; }
  .seg .filter-btn + .filter-btn { border-left: 1px solid var(--line); }
  .seg .filter-btn:hover { background: var(--line-soft); color: var(--accent); }
  .seg .filter-btn.active { background: var(--accent); color: var(--card); }
  .seg .filter-btn.active + .filter-btn { border-left-color: var(--accent); }

  .view-tabs {
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  .view-tab {
    font-family: inherit; font-size: 14.5px; font-weight: 700; color: var(--ink-faint);
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 2px; margin-bottom: -1px; cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .view-tab + .view-tab { margin-left: 22px; }
  .view-tab:hover { color: var(--accent); }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .view-tab-count {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--ink-faint); margin-left: 6px;
  }
  .view-tab.active .view-tab-count { color: var(--accent); }
  .view-tabs .toolbar-actions { padding-bottom: 6px; }

  .toolbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .pdf-download-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-faint);
    background: none; border: none; padding: 4px 2px; cursor: pointer;
  }
  .pdf-download-btn:hover { color: var(--accent); }
  .pdf-download-btn svg { width: 13px; height: 13px; margin-right: 0 !important; }
  .pdf-status { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .group-empty-state { padding: 18px 0 24px; text-align: center; }
  .sort-select {
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 5px 8px; cursor: pointer;
  }
  .sort-select:hover { border-color: var(--accent); }
  .sort-select.filter-on { border-color: var(--accent); color: var(--accent); }
  .toolbar-selects { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sort-select:hover { border-color: var(--accent); color: var(--accent); }
  .collapse-toggle-btn { margin-left: 6px; }

  .section-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    flex-wrap: wrap;
  }
  .section-header-btn {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    flex-wrap: wrap;
    padding: 0;
  }
  .section-nr { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); flex-shrink: 0; }
  .section-title { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 17px; flex: 0 0 auto; margin-right: 8px; white-space: nowrap; color: var(--ink); letter-spacing: -0.005em; }
  .section-progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .progress-track { flex: 1; height: 4px; background: var(--line-soft); border-radius: var(--r-pill); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: var(--r-pill); }
  .progress-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; flex-shrink: 0;
  }
  .chevron { flex-shrink: 0; color: var(--ink-faint); transition: transform 0.2s ease; }
  .chevron.collapsed { transform: rotate(-90deg); }

  .section-header.open {
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
  }

  .section-body { padding: 4px 18px 16px; }
  .section-body > .task-row:first-child { border-top: none; }
  .empty-state {
    font-size: 13px; color: var(--ink-faint); font-style: italic; padding: 10px 0 14px;
  }

  .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .task-row.done .task-title { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); font-weight: 600; }
  .task-row.done .task-meta { color: var(--ink-faint); opacity: 0.85; }

  .check-btn {
    width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--ink-faint);
    background: none; flex-shrink: 0; margin-top: 2px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--card);
    padding: 0; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .check-btn:hover { border-color: var(--accent); }
  /* Geldt voor beide opbouwen: de oude regel en het nieuwe kaartje. */
  .task-row.done .check-btn,
  .check-btn.done { background: var(--accent); border-color: var(--accent); }

  .task-body { flex: 1; min-width: 0; }

<script>
(function () {
  "use strict";

  // ─── Verbinding met de database ───────────────────────────────────
  // Deze twee waarden staan in Supabase onder Settings → API Keys:
  // de Project URL en de publishable sleutel (sb_publishable_...).
  // Ze mogen openbaar zijn: wat iemand mag zien en wijzigen wordt in de
  // database zelf bepaald, aan de hand van de tabel "leden".
  // De secret sleutel (sb_secret_...) hoort hier NOOIT te staan.
  var SUPABASE_URL = "https://zdpmrliolynupkbydxpp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_kLI1xtdgeAir1K6d7vc7ng_Mn_pBURg";
  // De soorten organisaties komen uit de database en zijn in de Console
  // zelf te beheren (tabblad Relaties, knop "Soorten beheren").
  var soorten = [];
  var sectoren = [];

  // De twee keuzelijsten werken hetzelfde; deze beschrijving houdt de
  // code op één plek in plaats van alles twee keer.
  var KEUZELIJSTEN = [
    { veld: "soort",  tabel: "organisatie_soorten",  kop: "Soorten organisaties",
      omschrijving: "Wat voor organisatie is het", lees: function () { return soorten; },
      zet: function (v) { soorten = v; } },
    { veld: "sector", tabel: "organisatie_sectoren", kop: "Sectoren",
      omschrijving: "In welk deel van het mobiel erfgoed is ze actief", lees: function () { return sectoren; },
      zet: function (v) { sectoren = v; } }
  ];
  function keuzelijst(veld) {
    return KEUZELIJSTEN.find(function (k) { return k.veld === veld; });
  }

  // Twee adressen voor dezelfde bibliotheek: is de eerste onbereikbaar,
  // dan wordt de tweede geprobeerd.
  var SUPABASE_LIBS = [
    "https://esm.sh/@supabase/supabase-js@2",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  ];

  var sb = null;            // verbinding met de database
  var sessie = null;        // wie is er ingelogd
  var mijnRol = null;       // kijker | bewerker | beheerder | null
  var inlogStatus = "";     // melding op het inlogscherm
  var opstartFout = "";     // als de verbinding niet lukt
  var organisaties = [];
  var personen = [];

  // De lijst komt volledig uit de database; er is geen startlijst in de pagina.

  // Lokale UI-state (niet gedeeld, niet opgeslagen)
  var ui = {
    view: "acties", // acties | besluiten | relaties
    bewerkOrg: {},      // organisatie-id -> true
    bewerkPersoon: {},  // persoon-id -> true
    nieuweOrg: false,
    nieuwPersoonBij: {},// organisatie-id -> true
    relatieFilter: "alle", // "alle" of een organisatie-id
    relatieView: "organisaties", // organisaties | personen
    actieView: "categorie",      // categorie | alle
    relatieZoek: "",   // zoektekst in de relatielijst
    soortFilter: "alle",   // "alle", een soort, of "geen"
    sectorFilter: "alle",  // idem voor sector
    soortenBeheer: false, // het beheerpaneel voor soorten
    bewerkSoort: {},      // soortnaam -> true
    nieuwSoort: false,
    openOrg: {},        // organisatie-id -> true (personen tonen)
    filter: "todo", // todo | done | alle
    labelFilter: "alle", // "alle" of de naam van een label
    actionLabelFilter: "alle", // "alle" of een label dat op acties staat
    sortMode: "standaard", // standaard | label | datum
    dateFilter: "alle", // alle | verlopen | week | maand | geen
    editingDecision: {}, // besluit-id -> true
    taskLabelFilter: {}, // sectionId -> label (alleen acties met dat label tonen)
    collapsed: {},
    adding: {},        // sectionId -> true
    customOwner: {},   // sectionId -> true (aan het typen van nieuwe naam)
    completing: {},    // taskId -> true (bezig met afronden)
    completingExtra: {}, // taskId -> true (vervolgtaak/besluit-velden getoond)
    editingCompletion: {}, // taskId -> true (afrondingsgegevens bewerken)
    reopening: {},     // taskId -> true (bevestiging om weer open te zetten)
    editingTask: {},   // taskId -> true (taakgegevens bewerken)
    editingSection: {}, // sectionId -> true (naam/volgnummer bewerken)
    editCustomOwner: {}, // taskId -> true (aan het typen van nieuwe naam bij bewerken)
    addingSection: false // formulier voor nieuwe categorie tonen
  };

  var currentSections = null;
  var currentDecisions = null;
  var syncing = false;
  var saveError = false;
  var pdfStatus = "";

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Categorieën hadden vroeger één vaste groep; dat leest nu als labels verder.
  // Oude gegevens hoeven daardoor niet omgezet te worden.
  var LEGACY_GROUP_LABELS = {
    bestuur: ["Bestuur"],
    projectgroep: ["Projectgroep"],
    beide: ["Bestuur", "Projectgroep"]
  };
  var LABEL_PALETTE = { "Bestuur": "#3E86B8", "Projectgroep": "#1D9C8C" };
  var LABEL_HUES = ["#B85D95", "#7A6BA6", "#C07A3E", "#4A8F6B", "#646C79", "#3E86B8", "#1D9C8C"];

  function sectionLabels(section) {
    if (Array.isArray(section.labels)) return section.labels;
    return LEGACY_GROUP_LABELS[section.group] || [];
  }

  function taskLabels(task) {
    return Array.isArray(task.labels) ? task.labels : [];
  }

  // Labels van acties verschillen per categorie, dus suggesties komen
  // altijd uit dezelfde categorie.
  function organisatieOp(id) {
    return organisaties.find(function (o) { return o.id === id; }) || null;
  }
  function persoonOp(id) {
    return personen.find(function (x) { return x.id === id; }) || null;
  }
  // De volledige naam uit de drie delen. Staan die niet ingevuld
  // (bijvoorbeeld bij oudere gegevens), dan blijft het naamveld gelden.
  function volledigeNaam(p) {
    if (!p) return "";
    var delen = [p.voornaam, p.tussenvoegsel, p.achternaam].filter(function (x) { return x && x.trim(); });
    return delen.length ? delen.join(" ") : (p.naam || "");
  }

  // Sorteren gaat op achternaam: dat is wat je in een adressenlijst zoekt.
  function opAchternaam(a, b) {
    var aa = (a.achternaam || a.naam || ""), bb = (b.achternaam || b.naam || "");
    var v = aa.localeCompare(bb, "nl");
    return v !== 0 ? v : (a.voornaam || "").localeCompare(b.voornaam || "", "nl");
  }

  var GESLACHTEN = [["", "—"], ["vrouw", "Vrouw"], ["man", "Man"], ["anders", "Anders"]];

  function adresVan(org) {
    if (!org) return "";
    var regel = [org.adres || "", [org.postcode || "", org.plaats || ""].filter(Boolean).join("  ")]
      .filter(Boolean).join(", ");
    return regel;
  }

  function personenBij(orgId) {
    return personen.filter(function (x) { return x.organisatie_id === orgId; });
  }
  function actiesBij(orgId, persoonId) {
    var uit = [];
    (currentSections || []).forEach(function (sec) {
      sec.tasks.forEach(function (t) {
        if (persoonId ? t.persoonId === persoonId : t.organisatieId === orgId) {
          uit.push({ sectie: sec, taak: t });
        }
      });
    });
    return uit;
  }
  // Wie doet deze actie? Een persoon uit de relatielijst gaat voor; is er
  // geen gekoppeld, dan de losse naam ("Sectoren", "Allen").
  function eigenaarNaam(taak) {
    if (taak.eigenaarPersoonId) {
      var p = persoonOp(taak.eigenaarPersoonId);
      if (p) return volledigeNaam(p);
    }
    return taak.owner || "";
  }

  // Bij iemand van buiten is de organisatie net zo belangrijk als de naam.
  function eigenaarToelichting(taak) {
    if (!taak.eigenaarPersoonId) return "";
    var p = persoonOp(taak.eigenaarPersoonId);
    if (!p) return "";
    var org = organisatieOp(p.organisatie_id);
    if (!org || org.eigen) return "";
    return org.naam;
  }

  function eigenMensen() {
    var eigenIds = organisaties.filter(function (o) { return o.eigen; })
                               .map(function (o) { return o.id; });
    return personen.filter(function (x) { return eigenIds.indexOf(x.organisatie_id) !== -1; });
  }

  // Losse namen die in gebruik zijn en geen persoon zijn: Sectoren, Allen.
  function losseNamen() {
    var set = {};
    (currentSections || []).forEach(function (sec) {
      sec.tasks.forEach(function (t) {
        if (!t.eigenaarPersoonId && t.owner) set[t.owner] = true;
      });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "nl"); });
  }

  function relatieNaam(taak) {
    var pers = taak.persoonId ? persoonOp(taak.persoonId) : null;
    var org = taak.organisatieId ? organisatieOp(taak.organisatieId) : null;
    if (pers && org) return volledigeNaam(pers) + " · " + org.naam;
    if (pers) return volledigeNaam(pers);
    if (org) return org.naam;
    return "";
  }
  function nieuwId(voorvoegsel) {
    return voorvoegsel + "-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
  }

  // ── Opslaan van relaties ───────────────────────────────────────
  function bewaarRelatie(tabel, rij, lokaleLijst) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    syncing = true; render();
    controleer(sb.from(tabel).upsert(rij)).then(function () {
      var i = lokaleLijst.findIndex(function (x) { return x.id === rij.id; });
      if (i === -1) lokaleLijst.push(rij); else lokaleLijst[i] = rij;
      lokaleLijst.sort(tabel === "personen" ? opAchternaam
        : function (a, b) { return (a.naam || "").localeCompare(b.naam || "", "nl"); });
      syncing = false; saveError = false; render();
    }).catch(function () {
      syncing = false; saveError = true; render();
      laadAlles().then(render).catch(function () {});

  function bewaarSoort(veld, oudeNaam, nieuweNaam) {
    if (!sb || !magBewerken()) { saveError = true; render(); return; }
    var k = keuzelijst(veld);
    syncing = true; render();
    var lijst = k.lees();
    var volgorde = oudeNaam ? (lijst.indexOf(oudeNaam) + 1) * 10 : (lijst.length + 1) * 10 + 100;
    controleer(sb.from(k.tabel).upsert({ naam: nieuweNaam, volgorde: volgorde }))
      .then(function () {
        if (!oudeNaam) return;
        // Hernoemen: de organisaties die deze waarde hadden, gaan mee.
        var raken = organisaties.filter(function (o) { return o[veld] === oudeNaam; });
        return Promise.all(raken.map(function (o) {
          var patch = {}; patch[veld] = nieuweNaam;
          return controleer(sb.from("organisaties").update(patch).eq("id", o.id));
        })).then(function () {
          return controleer(sb.from(k.tabel).delete().eq("naam", oudeNaam));
        });
      })
      .then(function () { return laadAlles(); })
      .then(function () { syncing = false; saveError = false; render(); })
      .catch(function () { syncing = false; saveError = true; render(); laadAlles().then(render).catch(function () {}); });
  }

  function verwijderSoort(veld, naam) {

  function labelColor(label) {
    if (LABEL_PALETTE[label]) return LABEL_PALETTE[label];
    var hash = 0;
    for (var i = 0; i < label.length; i++) hash = label.charCodeAt(i) + ((hash << 5) - hash);
    return LABEL_HUES[Math.abs(hash) % LABEL_HUES.length];
  }

  // De keuzelijst levert "p:<persoon-id>" of "n:<naam>"; het losse

  function leesEigenaar(form) {

    var keuze = form.querySelector('[data-field="owner-keuze"]');

  function parseLabels(text) {
    return String(text || "").split(",").map(function (l) {

    }).filter(function (l, i, arr) {

    });
  }

  var OWNER_PALETTE = { "Marinus": "#1D9C8C", "Sectoren": "#3E86B8", "Marketing": "#B85D95" };
  var HUES = ["#3E86B8", "#B85D95", "#1D9C8C", "#646C79", "#7A6BA6"];
  function ownerColor(owner) {
    if (OWNER_PALETTE[owner]) return OWNER_PALETTE[owner];
    var hash = 0;
    for (var i = 0; i < owner.length; i++) hash = owner.charCodeAt(i) + ((hash << 5) - hash);
    return HUES[Math.abs(hash) % HUES.length];
  }

  function todayISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function formatDateNL(iso) {
    if (!iso) return "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  }

  function knownOwners(sections) {
    var set = {};
    sections.forEach(function (s) { s.tasks.forEach(function (t) { if (t.owner) set[t.owner] = true; }); });

  // Bij het openen staan alle categorieën ingeklapt: je ziet eerst een inhoudsopgave.

  // Invouwen sluit ook de formulieren die in die categorie openstonden,

  function closeOpenFormsInSection(sectionId) {
    delete ui.adding[sectionId];

    delete ui.customOwner[sectionId];
    var s = (currentSections || []).find(function (x) { return x.id === sectionId; });

      delete ui.completing[t.id];
      delete ui.completingExtra[t.id];
      delete ui.editingCompletion[t.id];
      delete ui.reopening[t.id];
    });

  function parseWhenDate(when) {
    if (when && /^\d{4}-\d{2}-\d{2}$/.test(when)) return when;
    return null;
  }

  function addDaysISO(iso, dagen) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + dagen);
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  // Alleen echte datums (uit de datumkiezer) zijn te vergelijken; vrije tekst
  // zoals "week van 17 aug" telt als "zonder datum".
  function matchesDateFilter(task) {
    if (ui.dateFilter === "alle") return true;
    var d = parseWhenDate(task.when);
    if (ui.dateFilter === "geen") return !d;
    if (!d) return false;
    var vandaag = todayISO();
    if (ui.dateFilter === "verlopen") return d < vandaag;
    if (ui.dateFilter === "week") return d <= addDaysISO(vandaag, 7);
    if (ui.dateFilter === "maand") return d <= addDaysISO(vandaag, 30);
    return true;
  }

  function sortedSections(sections) {
    var list = sections.slice();
    if (ui.sortMode === "label") {
      list.sort(function (a, b) {
        var la = sectionLabels(a)[0] || "";
        var lb = sectionLabels(b)[0] || "";
        if (la !== lb) {
          if (!la) return 1;
          if (!lb) return -1;
          return la.localeCompare(lb, "nl");
        }
        return (a.nr || 0) - (b.nr || 0);
      });
    }
    return list;
  }

  // Taken zonder echte datum ("week van 17 aug") komen achteraan.
  function sortedTasks(tasks) {
    if (ui.sortMode !== "datum") return tasks;
    var list = tasks.slice();
    list.sort(function (a, b) {
      var da = parseWhenDate(a.when);
      var db = parseWhenDate(b.when);
      if (da && db) return da < db ? -1 : da > db ? 1 : 0;
      if (da && !db) return -1;
      if (!da && db) return 1;
      return 0;
    });
    return list;
  }

  function filterSectionsByLabel(sections, labelFilter) {
    if (labelFilter === "alle") return sections;
    return sections.filter(function (s) { return sectionLabels(s).indexOf(labelFilter) !== -1; });
  }

  function cloneDecisions() {

  }

  function sortedDecisions(decisions) {

  }

  function lightenHex(hex, pct) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    function mix(c) { return Math.round(c * pct + 255 * (1 - pct)); }
    return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
  }
  function ownerTagStyle(owner) {
    var color = ownerColor(owner);
    return "color:" + color + ";background:" + lightenHex(color, 0.14) + ";";
  }

  function buildPrintHtml(sections, labelFilter, decisions) {
    var visible = filterSectionsByLabel(sections, labelFilter);
    var scopeLabel = labelFilter === "alle" ? "alle labels" : labelFilter;
    var html = "";
    html += '<div class="pdf-kicker">Stichting Mobiele Collectie Nederland</div>';
    html += '<div class="pdf-h1">Mobiel Erfgoed Console</div>';
    html += '<div class="pdf-scope">Afgedrukt op ' + escapeHtml(formatDateNL(todayISO())) + " — " + escapeHtml(scopeLabel) + '</div>';

    visible.forEach(function (section) {
      html += '<div class="pdf-section-card">';
      html += '<div class="pdf-section-header"><span class="pdf-section-nr">' + String(section.nr).padStart(2, "0") + '</span><span class="pdf-section-title">' + escapeHtml(section.title) + '</span>';
      sectionLabels(section).forEach(function (l) {
        var lc = labelColor(l);
        html += '<span class="pdf-label" style="color:' + lc + ';background:' + lightenHex(lc, 0.14) + ';">' + escapeHtml(l) + '</span>';
      });
      html += '</div>';
      html += '<div class="pdf-section-body">';
      if (section.tasks.length === 0) {
        html += '<div class="pdf-empty">Geen taken.</div>';
      }
      section.tasks.forEach(function (task) {
        html += '<div class="pdf-row' + (task.done ? " done" : "") + '">';
        html += '<div class="pdf-check' + (task.done ? " done" : "") + '"></div>';
        html += '<div class="pdf-row-body">';
        html += '<div class="pdf-title-row"><div class="pdf-title">' + escapeHtml(task.title) + '</div><span class="pdf-owner" style="' + ownerTagStyle(task.owner) + '">' + escapeHtml(task.owner) + "</span></div>";
        var pdfTaakLabels = taskLabels(task);
        if (task.when || task.note || pdfTaakLabels.length || (task.done && task.completedDate)) {
          html += '<div class="pdf-meta">';
          if (pdfTaakLabels.length) {
            html += '<div class="pdf-labels">';
            pdfTaakLabels.forEach(function (l) {
              var lc = labelColor(l);
              html += '<span class="pdf-label" style="color:' + lc + ';background:' + lightenHex(lc, 0.14) + ';">' + escapeHtml(l) + '</span>';
            });
            html += '</div>';
          }
          if (task.when) html += '<span class="pdf-when">' + escapeHtml(formatDateNL(task.when)) + "</span>";
          if (task.done && task.completedDate) html += '<span class="pdf-when">Afgerond ' + escapeHtml(formatDateNL(task.completedDate)) + "</span>";
          if (task.note) html += '<div class="pdf-note">' + escapeHtml(task.note) + "</div>";
          html += "</div>";
        }
        html += "</div></div>";
      });
      html += "</div></div>";
    });

    if (visible.length === 0) {
      html += '<div class="pdf-empty">Geen categorieën met dit label.</div>';
    }

    var decisionList = sortedDecisions(decisions);
    html += '<div class="pdf-besluiten-heading">Besluitenlijst</div>';
    if (decisionList.length === 0) {
      html += '<div class="pdf-empty">Nog geen besluiten vastgelegd.</div>';
    } else {
      html += '<div class="pdf-section-card"><div class="pdf-section-body" style="padding-top:8px;">';
      decisionList.forEach(function (d) {
        var sourceBits = [d.date ? formatDateNL(d.date) : "", d.sectionTitle, d.taskTitle].filter(function (v) { return !!v; });
        html += '<div class="pdf-row"><div class="pdf-row-body">';
        html += '<div class="pdf-title">' + escapeHtml(d.text) + "</div>";
        if (sourceBits.length) html += '<div class="pdf-meta"><div class="pdf-note">' + escapeHtml(sourceBits.join("   ·   ")) + "</div></div>";
        html += "</div></div>";
      });
      html += "</div></div>";
    }

    return html;
  }

  function renderPdfBlob(sections, labelFilter, decisions) {
    return new Promise(function (resolve, reject) {
      if (!window.html2canvas || !window.jspdf) { resolve(null); return; }
      var container = document.createElement("div");
      container.id = "pdf-export-root";
      container.innerHTML = buildPrintHtml(sections, labelFilter, decisions);
      document.body.appendChild(container);

      function cleanup() {
        if (container.parentNode) container.parentNode.removeChild(container);
      }

      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      }).then(function () {
        var scale = 2;
        var rootRect = container.getBoundingClientRect();
        var rows = container.querySelectorAll(".pdf-row, .pdf-section-card, .pdf-besluiten-heading");
        var points = [];
        rows.forEach(function (r) {
          var rect = r.getBoundingClientRect();
          var top = Math.round((rect.top - rootRect.top) * scale);
          if (top > 0) points.push(top);
        });
        var breakPoints = Array.from(new Set(points)).sort(function (a, b) { return a - b; });

        return html2canvas(container, { scale: scale, backgroundColor: "#ffffff", useCORS: true }).then(function (canvas) {
          var jsPDFCtor = window.jspdf.jsPDF;
          var doc = new jsPDFCtor({ unit: "mm", format: "a4" });
          var pageWidthMM = doc.internal.pageSize.getWidth();
          var pageHeightMM = doc.internal.pageSize.getHeight();
          var marginMM = 14;
          var contentWidthMM = pageWidthMM - marginMM * 2;
          var pxPerMM = canvas.width / contentWidthMM;
          var pageContentHeightMM = pageHeightMM - marginMM * 2;
          var pageContentHeightPx = Math.floor(pageContentHeightMM * pxPerMM);

          var renderedPx = 0;
          var first = true;
          while (renderedPx < canvas.height) {
            var maxEnd = Math.min(renderedPx + pageContentHeightPx, canvas.height);
            var chosen = maxEnd;
            if (maxEnd < canvas.height) {
              for (var i = breakPoints.length - 1; i >= 0; i--) {
                if (breakPoints[i] > renderedPx && breakPoints[i] <= maxEnd) { chosen = breakPoints[i]; break; }
              }
            }
            var sliceHeightPx = chosen - renderedPx;
            if (sliceHeightPx <= 0) sliceHeightPx = maxEnd - renderedPx;

            var sliceCanvas = document.createElement("canvas");
            sliceCanvas.width = canvas.width;
            sliceCanvas.height = sliceHeightPx;
            var ctx = sliceCanvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
            ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

            if (!first) doc.addPage();
            first = false;
            var sliceHeightMM = sliceHeightPx / pxPerMM;
            doc.addImage(sliceCanvas.toDataURL("image/jpeg", 0.92), "JPEG", marginMM, marginMM, contentWidthMM, sliceHeightMM);

            renderedPx += sliceHeightPx;
          }

          cleanup();
          resolve(doc.output("blob"));
        });
      }).catch(function (err) {
        cleanup();
        reject(err);
      });
    });
  }

  // De PDF-bibliotheken zijn samen ruim een halve megabyte. Ze worden pas
  // opgehaald wanneer iemand echt een PDF wil, zodat de lijst zelf snel opent.
  var PDF_LIBS = [

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement("script");
      el.src = src;

      el.onerror = function () { reject(new Error("script laden mislukt")); };
      document.head.appendChild(el);
    });
  }

  function loadPdfLibs() {
    if (window.html2canvas && window.jspdf) return Promise.resolve();

        pdfLibsPromise = null;   // volgende poging mag het opnieuw proberen

  function bewaarBestand(blob, bestandsnaam) {

    document.body.appendChild(a);

  function downloadExcel(soort) {
    pdfStatus = "Bestand maken\u2026";

    loadExcelLib().then(function () {

      } else {
        var r = adressenlijstRijen();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r.organisaties), "Organisaties");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(r.personen), "Personen");
        naam = "adressenlijst-" + todayISO() + ".xlsx";
        toelichting = [["Adressenlijst"], [], ["Gemaakt op", formatDateNL(todayISO())],
          ["Selectie", selectieOmschrijving()],
          ["Aantal organisaties", r.organisaties.length - 1],
          ["Aantal personen", r.personen.length - 1]];
      }
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(toelichting), "Over deze lijst");
      var data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      return bewaarBestand(new Blob([data], { type: "application/octet-stream" }), naam);
    }).then(function () {
      pdfStatus = "Gedownload.";
      render();
    }).catch(function (err) {
      pdfStatus = "Downloaden lukte niet: " + ((err && err.message) || String(err));
      render();
    });
  }

  function downloadPdf() {
    pdfStatus = "PDF opmaken…";
    render();
    loadPdfLibs().then(function () {
      return renderPdfBlob(currentSections, ui.labelFilter, currentDecisions);
    }).then(function (blob) {
      if (!blob) {
        pdfStatus = "PDF kon niet worden gemaakt. Ververs de pagina en probeer het opnieuw.";
        render();
        return;
      }
      pdfStatus = "Bestand aanbieden…";
      render();
      return bewaarBestand(blob, "mobiel-erfgoed-console-" + todayISO() + ".pdf").then(function () {
        pdfStatus = "Gedownload.";
        render();
      });
    }).catch(function (err) {
      pdfStatus = "Downloaden lukte niet" + (err && err.code ? " (" + err.code + ")" : "") + ".";
      render();
    });
  }

  function relatieZoekFilter(tekst) {
    var z = (ui.relatieZoek || "").trim().toLowerCase();
    if (!z) return true;
    return (tekst || "").toLowerCase().indexOf(z) !== -1;
  }

  function keuzeOk(org, waarde, veld) {
    if (waarde === "alle") return true;
    if (waarde === "geen") return !org || !org[veld];
    return !!org && org[veld] === waarde;
  }
  function soortOk(org) {
    return keuzeOk(org, ui.soortFilter, "soort") && keuzeOk(org, ui.sectorFilter, "sector");
  }

  function zichtbareOrganisaties() {
    return organisaties.filter(function (org) {
      return soortOk(org) &&
        relatieZoekFilter([org.naam, org.plaats, org.soort, org.sector, org.adres,
                           org.postcode, org.email, org.notitie].join(" "));
    });
  }

  function zichtbarePersonen() {
    return personen.filter(function (x) {
      var org = organisatieOp(x.organisatie_id);
      return soortOk(org) &&
        relatieZoekFilter([volledigeNaam(x), x.achternaam, x.functie, x.email,
                           org ? org.naam : ""].join(" "));
    });
  }

  function renderAlleActiesHtml(secties, hoort) {
    var regels = [];
    secties.forEach(function (sec) {
      sec.tasks.filter(hoort).forEach(function (t) { regels.push({ sectie: sec, taak: t }); });

  // Binnen een categorie is de kolom Categorie overbodig.
  function renderActieTabel(regels, toonCategorie) {
    var mag = magBewerken();

    html += '<div class="acties-kop sans">';

    html += '</div>';

    regels.forEach(function (r) {
      var t = r.taak, sec = r.sectie;
      if (ui.editingTask[t.id] || ui.completing[t.id] || ui.editingCompletion[t.id] || ui.reopening[t.id]) {
        html += '<div class="actie-formulier">' + renderTaskRow(sec, t, knownOwners(currentSections)) + '</div>';
        return;
      }
      var labels = taskLabels(t);
      var relatie = relatieNaam(t);
      var verlopen = !t.done && isVerlopen(t.when);

      html += '<div class="actie-regel' + (t.done ? " gereed" : "") + '" style="--balk:' + ownerColor(eigenaarNaam(t)) + ';">';
      html += '<span class="ak-vink">';
      html += '<button class="check-btn' + (t.done ? " done" : "") + '" data-action="toggle-complete" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="' + (t.done ? "Weer openzetten" : "Afronden") + '"></button>';
      html += '</span>';
      html += '<span class="ak-titel">' + escapeHtml(t.title);
      if (t.note) html += '<span class="ak-note" title="' + escapeHtml(t.note) + '">' + escapeHtml(t.note) + '</span>';
      if (t.done && t.completedNote) html += '<span class="ak-note" title="' + escapeHtml(t.completedNote) + '">' + escapeHtml(t.completedNote) + '</span>';
      html += '</span>';
      var wie = eigenaarNaam(t), wieOrg = eigenaarToelichting(t);
      html += '<span class="ak-veld"><span class="owner-tag" style="color:' + ownerColor(wie) + ';background:' + lightenHex(ownerColor(wie), 0.14) + ';"'
           + (wieOrg ? ' title="' + escapeHtml(wie + " — " + wieOrg) + '"' : '') + '>' + escapeHtml(wie)
           + (wieOrg ? '<span class="wie-extern">' + escapeHtml(wieOrg) + '</span>' : '') + '</span></span>';
      var datumTekst = toonDatum(t) ? formatDateNL(toonDatum(t)) : "";
      html += '<span class="ak-veld' + (verlopen ? " verlopen" : "") + '">' + escapeHtml(datumTekst) + '</span>';
      if (toonCategorie) {
        html += '<span class="ak-veld"><button class="ak-link" data-action="toon-categorie" data-section="' + sec.id + '">' + escapeHtml(sec.title) + '</button></span>';
      }
      html += '<span class="ak-veld">';
      labels.forEach(function (l) {
        var c = labelColor(l);
        html += '<button class="label-chip" data-action="set-action-label-filter-knop" data-label="' + escapeHtml(l) + '" style="color:' + c + ';background:' + lightenHex(c, 0.14) + ';">' + escapeHtml(l) + '</button>';
      });
      html += '</span>';
      html += '<span class="ak-veld">' + (relatie
        ? '<button class="relatie-chip" data-action="toon-relatie" data-org="' + escapeHtml(t.organisatieId || "") + '" data-persoon="' + escapeHtml(t.persoonId || "") + '">' + personSvg() + escapeHtml(relatie) + '</button>' : '') + '</span>';
      html += '<span class="ak-knoppen">';
      if (mag) {
        html += '<button class="edit-btn" data-action="open-edit-task" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="Actie bewerken">' + pencilSvg() + '</button>';
        html += '<button class="delete-btn" data-action="delete-task" data-section="' + sec.id + '" data-task="' + t.id + '" aria-label="Actie verwijderen">' + xSvg() + '</button>';
      }
      html += '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // De sortering van de keuzelijst toepassen op de vlakke lijst.
  function sorteerRegels(regels) {
    if (ui.sortMode === "datum") {
      return regels.slice().sort(function (a, b) {
        var da = parseWhenDate(toonDatum(a.taak)), db = parseWhenDate(toonDatum(b.taak));
        if (da && db) return da < db ? -1 : da > db ? 1 : 0;
        if (da && !db) return -1;
        if (!da && db) return 1;
        return 0;
      });
    }
    if (ui.sortMode === "label") {
      return regels.slice().sort(function (a, b) {
        var la = (taskLabels(a.taak)[0] || "\uffff"), lb = (taskLabels(b.taak)[0] || "\uffff");
        return la.localeCompare(lb, "nl");
      });
    }
    return regels;   // standaard: op categorie en daarbinnen op volgorde
  }

  // Welke datum staat er in de kolom? Bij een afgeronde actie de datum
  // waarop hij is afgerond, anders de geplande datum. Sorteren gebruikt
  // dezelfde waarde, anders lijkt de lijst niet gesorteerd.
  function toonDatum(t) {
    return t.done && t.completedDate ? t.completedDate : (t.when || "");
  }

  function isVerlopen(wanneer) {
    var d = parseWhenDate(wanneer);
    return !!d && d < todayISO();
  }

  // Het soort-veld wisselt tussen een keuzelijst en een eigen tekstveld.

  function keuzeVeldLijst(veld, huidig) {
    var k = keuzelijst(veld);
    var opties = k.lees().slice();
    // Een bestaande waarde die niet in de lijst staat, blijft gewoon kiesbaar.
    if (huidig && opties.indexOf(huidig) === -1) opties.unshift(huidig);
    var html = '<select class="sel-input" data-field="org-' + veld + '" data-keuzeveld="' + veld + '">';
    html += '<option value=""' + (huidig ? "" : " selected") + '>— ' + veld + ' kiezen —</option>';
    opties.forEach(function (o) {
      html += '<option value="' + escapeHtml(o) + '"' + (o === huidig ? " selected" : "") + '>' + escapeHtml(o) + '</option>';
    });
    html += '<option value="__eigen__">+ Anders, namelijk…</option>';
    html += '</select>';
    return html;
  }

    }

    var actieLabelFilter = ui.actionLabelFilter !== "alle" ? ui.actionLabelFilter : null;
